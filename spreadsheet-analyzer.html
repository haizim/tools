<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet AI Analyzer v3</title>
    <script src="assets/js/tailwindcss.js"></script>
    <script src="assets/js/theme-config.js"></script>
    <script defer src="assets/js/alpine.min.js"></script>
    <script src="assets/js/xlsx.full.min.js"></script>
    <script src="assets/js/showdown.min.js"></script>



    <style>
        [x-cloak] {
            display: none !important;
        }

        .scroller::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .scroller::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        /* Markdown Styles */
        .markdown-body p {
            margin-bottom: 0.5em;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-left: 1.5em;
            list-style: disc;
        }

        .markdown-body ol {
            list-style: decimal;
        }

        .markdown-body pre {
            background: #1f2937;
            color: #f3f4f6;
            padding: 0.5rem;
            border-radius: 0.375rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-body code {
            font-family: monospace;
            background: rgba(200, 200, 200, 0.2);
            padding: 0.1rem 0.3rem;
            border-radius: 0.2rem;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }

        .markdown-body h1 {
            font-size: 1.5em;
        }

        .markdown-body h2 {
            font-size: 1.25em;
        }

        .markdown-body blockquote {
            border-left: 4px solid #ccc;
            padding-left: 1em;
            color: #666;
        }
    </style>
</head>

<body
    class="bg-gray-100 dark:bg-gemini-gray-darker h-screen overflow-hidden font-sans text-sm transition-colors duration-300">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <div x-data="spreadsheetApp()" x-init="initApp()" class="flex h-full">

        <div
            class="w-2/3 flex flex-col border-r border-gray-300 dark:border-gemini-gray-dark bg-white dark:bg-gemini-gray-dark transition-colors duration-300">

            <div
                class="p-4 border-b border-gray-200 dark:border-gemini-gray-dark bg-gray-50 dark:bg-gemini-gray-darker flex items-center justify-between transition-colors duration-300">
                <div class="flex items-center gap-4">
                    <h1 class="font-bold text-gray-700 dark:text-gemini-gray-light text-lg">Data View</h1>
                    <!-- Theme Toggle Button -->
                    <button @click="toggleTheme()"
                        class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors">
                        <!-- Sun Icon -->
                        <svg x-show="!darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                        <!-- Moon Icon -->
                        <svg x-show="darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            style="display: none;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                            </path>
                        </svg>
                    </button>
                </div>
                <div class="relative">
                    <input type="file" @change="handleFileUpload" accept=".xlsx, .xls, .csv" class="hidden"
                        id="fileInput">
                    <label for="fileInput"
                        class="cursor-pointer bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded shadow transition text-xs font-semibold">
                        + Import Spreadsheet
                    </label>
                </div>
            </div>

            <div class="flex overflow-x-auto bg-gray-100 dark:bg-gemini-gray-darker border-b border-gray-300 dark:border-gemini-gray-dark"
                x-show="sheetNames.length > 0" x-cloak>
                <template x-for="name in sheetNames" :key="name">
                    <button @click="activeSheet = name"
                        :class="activeSheet === name ? 'bg-white dark:bg-gemini-gray-dark border-t-2 border-primary-600 text-primary-700 dark:text-primary-400' : 'bg-gray-200 dark:bg-gemini-gray-darker text-gray-600 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-gemini-gray-dark'"
                        class="px-4 py-2 border-r border-gray-300 dark:border-gemini-gray-dark font-medium text-xs whitespace-nowrap transition-colors"
                        x-text="name">
                    </button>
                </template>
            </div>

            <div x-show="sheetNames.length === 0"
                class="flex-1 flex flex-col items-center justify-center text-gray-400">
                <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                    </path>
                </svg>
                <p>Upload a .xlsx or .csv file to begin</p>
            </div>

            <div class="flex-1 overflow-auto scroller p-2" x-show="sheetNames.length > 0" x-cloak>
                <table class="min-w-full border-collapse text-left">
                    <thead class="bg-gray-50 dark:bg-gemini-gray-dark sticky top-0 shadow-sm z-10">
                        <tr>
                            <th
                                class="p-2 border border-gray-300 dark:border-gemini-gray-dark font-semibold text-gray-600 dark:text-gemini-gray-light text-xs bg-sky-100 dark:bg-sky-900">
                                no.</th>
                            <template x-for="header in getCurrentHeaders()" :key="header">
                                <th class="p-2 border border-gray-300 dark:border-gemini-gray-dark font-semibold text-gray-600 dark:text-gemini-gray-light text-xs bg-sky-100 dark:bg-sky-900"
                                    x-text="header"></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(row, index) in getCurrentRows()" :key="index">
                            <tr class="hover:bg-primary-50 dark:hover:bg-primary-900/20">
                                <td class="p-2 border border-gray-300 dark:border-gemini-gray-dark text-gray-700 dark:text-gemini-gray-light text-xs"
                                    x-text="index + 1"></td>
                                <template x-for="header in getCurrentHeaders()">
                                    <td class="p-2 border border-gray-300 dark:border-gemini-gray-dark text-gray-700 dark:text-gemini-gray-light text-xs truncate max-w-[200px]"
                                        x-text="row[header]"></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="w-1/3 flex flex-col bg-gray-50 dark:bg-gemini-gray-darker h-full transition-colors duration-300">

            <div x-data="{ open: true }"
                class="border-b border-gray-200 dark:border-gemini-gray-dark bg-white dark:bg-gemini-gray-dark shadow-sm z-20 transition-colors duration-300">
                <div @click="open = !open"
                    class="p-3 flex justify-between items-center cursor-pointer bg-gray-800 dark:bg-gemini-gray-darker text-white">
                    <h2 class="font-bold text-sm">OpenRouter Configuration</h2>
                    <span x-text="open ? '▼' : '▶'" class="text-xs"></span>
                </div>

                <div x-show="open"
                    class="p-4 space-y-3 bg-white dark:bg-gemini-gray-dark transition-colors duration-300" x-transition>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-bold text-gray-700 dark:text-gemini-gray-light">API
                                Key</label>
                            <span x-show="keySaved" class="text-[10px] text-green-600 dark:text-green-400 font-bold"
                                x-transition.duration.500ms>Saved!</span>
                        </div>
                        <input type="password" x-model="apiKey" @input="saveKey()" placeholder="sk-or-..."
                            class="w-full p-2 border rounded text-xs focus:ring-2 focus:ring-primary-500 outline-none bg-white dark:bg-gemini-gray-darker border-gray-300 dark:border-gemini-gray-dark text-gray-900 dark:text-gemini-gray-light placeholder-gray-400 dark:placeholder-gray-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <div class="flex justify-between items-end mb-1">
                                <label
                                    class="block text-xs font-bold text-gray-700 dark:text-gemini-gray-light">Model</label>
                                <button @click="fetchModels()"
                                    class="text-[10px] text-primary-600 dark:text-primary-400 hover:underline"
                                    :disabled="isLoadingModels">
                                    <span x-text="isLoadingModels ? 'Loading...' : 'Refresh'"></span>
                                </button>
                            </div>
                            <select x-model="model"
                                class="w-full p-2 border rounded text-xs bg-white dark:bg-gemini-gray-darker border-gray-300 dark:border-gemini-gray-dark text-gray-900 dark:text-gemini-gray-light focus:ring-2 focus:ring-primary-500 outline-none">
                                <template x-for="m in availableModels" :key="m.id">
                                    <option :value="m.id" x-text="`${m.name} [${m.priceLabel}]`"></option>
                                </template>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button @click="messages = []"
                                class="w-full bg-gray-200 dark:bg-gemini-gray-darker hover:bg-gray-300 dark:hover:bg-gemini-gray-dark/80 text-gray-700 dark:text-gemini-gray-light py-2 rounded text-xs font-bold transition">Clear
                                Chat</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 scroller bg-gray-50 dark:bg-gemini-gray-darker transition-colors duration-300"
                id="chatContainer">
                <div x-show="messages.length === 0" class="text-center text-gray-400 mt-10">
                    <p class="text-xs">Upload data and start chatting.</p>
                </div>

                <template x-for="(msg, index) in messages" :key="index">
                    <div :class="msg.role === 'user' ? 'text-right' : 'text-left'">
                        <div :class="msg.role === 'user' ? 'bg-primary-600 text-white' : 'bg-white dark:bg-gemini-gray-dark border border-gray-200 dark:border-gemini-gray-dark text-gray-800 dark:text-gemini-gray-light'"
                            class="inline-block p-3 rounded-lg max-w-[90%] text-sm shadow-sm leading-relaxed overflow-x-auto markdown-body"
                            x-html="parseMarkdown(msg.content)">
                        </div>
                        <div class="text-[10px] text-gray-400 mt-1 uppercase" x-text="msg.role"></div>
                    </div>
                </template>

                <div x-show="isLoading" class="flex items-center space-x-2 text-gray-500 text-xs">
                    <span class="animate-pulse">Analyzing...</span>
                </div>
            </div>

            <div
                class="p-3 bg-white dark:bg-gemini-gray-dark border-t border-gray-200 dark:border-gemini-gray-dark transition-colors duration-300">
                <div class="flex items-center mb-2 px-1" x-show="sheetNames.length > 0">
                    <input type="checkbox" id="attachData" x-model="attachData"
                        class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500 border-gray-300 dark:border-gemini-gray-dark bg-white dark:bg-gemini-gray-darker">
                    <label for="attachData"
                        class="ml-2 text-xs text-gray-600 dark:text-gray-400 select-none cursor-pointer">
                        Attach visible data (Top 500 rows)
                    </label>
                </div>

                <div class="flex space-x-2">
                    <input type="text" x-model="userInput" @keydown.enter="sendMessage()"
                        placeholder="Type your message..."
                        class="flex-1 p-2 border rounded text-sm focus:ring-2 focus:ring-primary-500 outline-none bg-white dark:bg-gemini-gray-darker border-gray-300 dark:border-gemini-gray-dark text-gray-900 dark:text-gemini-gray-light placeholder-gray-400 dark:placeholder-gray-500">
                    <button @click="sendMessage()" :disabled="isLoading || !apiKey"
                        :class="(!apiKey || isLoading) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-primary-700'"
                        class="bg-primary-600 text-white px-4 py-2 rounded font-bold text-sm transition">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function spreadsheetApp() {
            return {
                // Dark Mode
                darkMode: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');

                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },
                sheetNames: [],
                sheetsData: {},
                activeSheet: null,

                // Config
                apiKey: '',
                model: 'openai/gpt-3.5-turbo',
                availableModels: [
                    { id: 'openai/gpt-3.5-turbo', name: 'GPT-3.5 Turbo' },
                    { id: 'openai/gpt-4-turbo', name: 'GPT-4 Turbo' },
                    { id: 'anthropic/claude-3-haiku', name: 'Claude 3 Haiku' },
                    { id: 'meta-llama/llama-3-70b-instruct', name: 'Llama 3 70B' }
                ],
                systemPrompt: 'You are a skilled data analyst.',

                // UI & Logic
                keySaved: false,
                isLoadingModels: false,
                messages: [],
                userInput: '',
                isLoading: false,
                attachData: false, // New State
                converter: null,

                initApp() {
                    const storedKey = localStorage.getItem('or_apiKey');
                    if (storedKey) this.apiKey = storedKey;

                    // Initialize Showdown Converter
                    this.converter = new showdown.Converter({
                        tables: true,
                        simplifiedAutoLink: true,
                        strikethrough: true,
                        tasklists: true
                    });
                },

                saveKey() {
                    localStorage.setItem('or_apiKey', this.apiKey);
                    this.keySaved = true;
                    setTimeout(() => this.keySaved = false, 2000);
                },

                async fetchModels() {
                    this.isLoadingModels = true;
                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/models");
                        const data = await response.json();

                        this.availableModels = data.data.map(m => {
                            let priceLabel = "Unknown";

                            // Calculate Price per 1M tokens
                            if (m.pricing) {
                                // Pricing is usually string like "0.000005"
                                const promptPrice = parseFloat(m.pricing.prompt) * 1000000;
                                const completionPrice = parseFloat(m.pricing.completion) * 1000000;

                                if (promptPrice === 0 && completionPrice === 0) {
                                    priceLabel = "Free";
                                } else {
                                    // Format to significant digits or 2 decimals
                                    const pStr = promptPrice < 0.01 ? promptPrice.toPrecision(2) : promptPrice.toFixed(2);
                                    const cStr = completionPrice < 0.01 ? completionPrice.toPrecision(2) : completionPrice.toFixed(2);
                                    priceLabel = `$${pStr} / $${cStr}`;
                                }
                            }

                            return {
                                id: m.id,
                                name: m.name || m.id,
                                priceLabel: priceLabel
                            };
                        }).sort((a, b) => a.name.localeCompare(b.name));

                    } catch (e) {
                        alert("Error fetching models. Using cached list.");
                        console.error(e);
                    } finally {
                        this.isLoadingModels = false;
                    }
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const wb = XLSX.read(e.target.result, { type: 'array' });
                        this.sheetNames = wb.SheetNames;
                        this.sheetsData = {};
                        this.sheetNames.forEach(n => this.sheetsData[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "" }));
                        if (this.sheetNames.length > 0) this.activeSheet = this.sheetNames[0];
                    };
                    reader.readAsArrayBuffer(file);
                },

                getCurrentRows() {
                    return (this.activeSheet && this.sheetsData[this.activeSheet]) ? this.sheetsData[this.activeSheet] : [];
                },
                getCurrentHeaders() {
                    const rows = this.getCurrentRows();
                    return rows.length > 0 ? Object.keys(rows[0]) : [];
                },

                // --- NEW: Generate Markdown Table from Data ---
                generateMarkdownTable() {
                    const rows = this.getCurrentRows();
                    if (rows.length === 0) return "No data available.";
                    const limit = 500;

                    // Limit to top 50 rows to save tokens/prevent crash
                    const limitRows = rows.slice(0, limit);
                    const headers = Object.keys(rows[0]);

                    // Create Header Row
                    let md = "| " + headers.join(" | ") + " |\n";
                    // Create Separator Row
                    md += "| " + headers.map(() => "---").join(" | ") + " |\n";
                    // Create Data Rows
                    limitRows.forEach(row => {
                        md += "| " + headers.map(h => row[h]).join(" | ") + " |\n";
                    });

                    if (rows.length > limit) {
                        md += `\n*(Data truncated. Showing first ${limit} of ${rows.length} rows)*`;
                    }
                    return md;
                },

                async sendMessage() {
                    if (!this.userInput.trim() || !this.apiKey) return;

                    let contentToSend = this.userInput;

                    // Inject Data if Checkbox is Checked
                    let systemPrompt = this.systemPrompt;
                    if (this.attachData && this.sheetNames.length > 0) {
                        const tableData = this.generateMarkdownTable();
                        systemPrompt += `\n\n=== SPREADSHEET DATA (${this.activeSheet}) ===\n${tableData}\n==============================`;
                        // Reset toggle to prevent accidental resend (optional, kept persistent here for workflow)
                    }

                    // Push formatted message to UI (hide big data from UI, keep it clean)
                    // We only show the user input in the chat bubble, but send the big data to API
                    this.messages.push({ role: 'user', content: contentToSend, display: this.userInput });

                    this.userInput = '';
                    this.isLoading = true;
                    this.scrollToBottom();

                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${this.apiKey}`,
                                "Content-Type": "application/json",
                                "HTTP-Referer": window.location.href,
                                "X-Title": "Mini Alpine Analyzer"
                            },
                            body: JSON.stringify({
                                "model": this.model,
                                "messages": [
                                    { "role": "system", "content": systemPrompt },
                                    ...this.messages.map(m => ({ role: m.role, content: m.content }))
                                ]
                            })
                        });

                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        this.messages.push({ role: 'assistant', content: data.choices[0].message.content });
                    } catch (error) {
                        this.messages.push({ role: 'assistant', content: `Error: ${error.message}` });
                    } finally {
                        this.isLoading = false;
                        this.scrollToBottom();
                    }
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = document.getElementById('chatContainer');
                        container.scrollTop = container.scrollHeight;
                    });
                },

                parseMarkdown(text) {
                    if (this.converter) {
                        return this.converter.makeHtml(text);
                    }
                    return text;
                }
            }
        }
    </script>
</body>

</html>
