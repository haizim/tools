<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Visual Editor v2.2</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .editor-selected {
            outline: 2px dashed #3b82f6 !important;
            outline-offset: -2px;
            position: relative;
            z-index: 50;
        }

        .preview-transition {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200 h-screen overflow-hidden font-sans" x-data="pageEditor()" x-init="initEditor()"
    @keydown.window.prevent.ctrl.z="undo()" @keydown.window.prevent.ctrl.y="redo()">

    <header class="h-14 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center gap-4">
            <button @click="showSource = !showSource"
                :class="showSource ? 'text-blue-400 bg-gray-900 border-blue-500/30' : 'text-gray-500 hover:text-gray-300 border-transparent'"
                class="p-1.5 rounded border transition mr-2" title="Toggle Source">
                <span class="material-icons text-lg">code</span>
            </button>
            <div class="flex items-center gap-2 border-l border-gray-700 pl-4">
                <span class="material-icons text-blue-400">layers</span>
                <h1 class="font-bold tracking-wide text-sm">Alpine <span class="text-blue-400">Builder v2.2</span></h1>
            </div>
            <div class="flex items-center bg-gray-900 rounded-lg p-1 border border-gray-700 ml-4">
                <button @click="undo()" :disabled="historyIndex <= 0"
                    class="p-1 rounded hover:bg-gray-700 disabled:opacity-30 text-gray-400"><span
                        class="material-icons text-sm">undo</span></button>
                <button @click="redo()" :disabled="historyIndex >= historyStack.length - 1"
                    class="p-1 rounded hover:bg-gray-700 disabled:opacity-30 text-gray-400"><span
                        class="material-icons text-sm">redo</span></button>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button @click="copyToClipboard()"
                class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold transition">
                <span class="material-icons text-sm">code</span> Export HTML
            </button>
            <button @click="showInspector = !showInspector"
                :class="showInspector ? 'text-blue-400 bg-gray-900 border-blue-500/30' : 'text-gray-500 hover:text-gray-300 border-transparent'"
                class="p-1.5 rounded border transition ml-2 border-l border-gray-700 pl-2">
                <span class="material-icons text-lg">tune</span>
            </button>
        </div>
    </header>

    <main class="flex h-[calc(100vh-3.5rem)]">

        <section x-show="showSource"
            class="w-1/4 min-w-[300px] border-r border-gray-700 flex flex-col bg-gray-900 transition-all duration-300">
            <div
                class="bg-gray-800 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-700">
                Source Code</div>
            <textarea x-model="sourceCode" @input.debounce.500ms="syncPreview(true)"
                class="w-full h-full bg-[#0d1117] text-gray-300 font-mono text-xs p-4 outline-none resize-none border-none focus:ring-0"
                spellcheck="false"></textarea>
        </section>

        <section class="flex-1 bg-gray-700/50 relative overflow-hidden flex flex-col transition-all duration-300">
            <div
                class="bg-gray-100 px-3 py-2 border-b border-gray-300 flex justify-between items-center shadow-sm z-10">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Visual Preview</span>
                <div class="flex bg-gray-200 rounded p-0.5">
                    <button @click="viewport = '100%'"
                        :class="viewport === '100%' ? 'bg-white shadow text-blue-600' : 'text-gray-500'"
                        class="p-1 rounded transition"><span
                            class="material-icons text-sm">desktop_windows</span></button>
                    <button @click="viewport = '768px'"
                        :class="viewport === '768px' ? 'bg-white shadow text-blue-600' : 'text-gray-500'"
                        class="p-1 rounded transition"><span class="material-icons text-sm">tablet_mac</span></button>
                    <button @click="viewport = '375px'"
                        :class="viewport === '375px' ? 'bg-white shadow text-blue-600' : 'text-gray-500'"
                        class="p-1 rounded transition"><span class="material-icons text-sm">smartphone</span></button>
                </div>
            </div>
            <div class="flex-1 overflow-auto flex justify-center pt-8 pb-20 bg-gray-300/50" @click="deselect()">
                <div :style="`width: ${viewport}`"
                    class="preview-transition bg-white shadow-2xl min-h-[800px] transition-all duration-300 origin-top">
                    <div x-ref="previewCanvas" @click.stop="handleSelection($event)" class="min-h-full"></div>
                </div>
            </div>
        </section>

        <section x-show="showInspector"
            class="w-80 min-w-[320px] border-l border-gray-700 bg-gray-800 flex flex-col overflow-hidden shrink-0 z-10 transition-all duration-300">
            <div
                class="bg-gray-800 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-700">
                Inspector</div>

            <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-6">
                <template x-if="!selectedEl">
                    <div class="text-center text-gray-500 mt-20 flex flex-col items-center">
                        <span class="material-icons text-3xl opacity-50 mb-2">touch_app</span>
                        <p class="text-xs text-gray-400">Select an element to edit</p>
                    </div>
                </template>

                <template x-if="selectedEl">
                    <div class="space-y-6 animate-fade-in">

                        <div
                            class="flex flex-wrap items-center gap-1 text-[10px] font-mono text-gray-500 pb-2 border-b border-gray-700">
                            <template x-for="(crumb, idx) in breadcrumbs" :key="idx">
                                <div class="flex items-center">
                                    <span x-show="idx > 0"
                                        class="material-icons text-[10px] mx-0.5 text-gray-600">chevron_right</span>
                                    <button @click="selectElement(crumb.el)"
                                        class="hover:text-blue-400 hover:bg-gray-700 px-1 rounded transition truncate max-w-[80px]"
                                        :class="{'text-blue-400 font-bold bg-gray-700': idx === breadcrumbs.length - 1}"
                                        x-text="crumb.tag"></button>
                                </div>
                            </template>
                        </div>

                        <div class="grid grid-cols-4 gap-2">
                            <button @click="moveElement('up')"
                                class="bg-gray-700 hover:bg-gray-600 p-1.5 rounded text-gray-300"><span
                                    class="material-icons text-sm">arrow_upward</span></button>
                            <button @click="moveElement('down')"
                                class="bg-gray-700 hover:bg-gray-600 p-1.5 rounded text-gray-300"><span
                                    class="material-icons text-sm">arrow_downward</span></button>
                            <button @click="duplicateElement()"
                                class="bg-gray-700 hover:bg-gray-600 p-1.5 rounded text-gray-300"><span
                                    class="material-icons text-sm">content_copy</span></button>
                            <button @click="deleteElement()"
                                class="bg-red-900/30 hover:bg-red-900/50 text-red-400 p-1.5 rounded"><span
                                    class="material-icons text-sm">delete</span></button>
                        </div>

                        <div class="space-y-3 pt-2 border-t border-gray-700">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Content</p>
                            <template x-for="(node, index) in textNodes" :key="index">
                                <input type="text" x-model="node.text" @input="updateTextNode(index, node.text)"
                                    class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:border-blue-500 outline-none">
                            </template>
                            <template x-if="tagName === 'IMG'">
                                <div class="space-y-1">
                                    <label class="text-[10px] text-gray-500">Image Source</label>
                                    <input type="text" x-model="imgSrc" @change="updateAttr('src', imgSrc)"
                                        class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-blue-300 outline-none">
                                </div>
                            </template>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-gray-700">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Typography</p>

                            <div class="flex gap-2">
                                <select @change="updateTextAlign($event.target.value)" x-model="textAlign"
                                    class="bg-gray-900 border border-gray-600 text-xs rounded px-2 py-1 flex-1 text-white outline-none">
                                    <option value="">Align</option>
                                    <option value="text-left">Left</option>
                                    <option value="text-center">Center</option>
                                    <option value="text-right">Right</option>
                                </select>
                                <select @change="applyClass('font', $event.target.value)"
                                    class="bg-gray-900 border border-gray-600 text-xs rounded px-2 py-1 flex-1 text-white outline-none">
                                    <option value="">Weight</option>
                                    <option value="font-light">Light</option>
                                    <option value="font-normal">Normal</option>
                                    <option value="font-bold">Bold</option>
                                </select>
                            </div>

                            <div class="space-y-1">
                                <label class="text-[10px] text-gray-500">Size</label>
                                <select @change="updateTextSize($event.target.value)" x-model="textSize"
                                    class="w-full bg-gray-900 border border-gray-600 text-xs rounded px-2 py-1 text-white outline-none">
                                    <option value="text-xs">XS (0.75rem)</option>
                                    <option value="text-sm">SM (0.875rem)</option>
                                    <option value="text-base">Base (1rem)</option>
                                    <option value="text-lg">LG (1.125rem)</option>
                                    <option value="text-xl">XL (1.25rem)</option>
                                    <option value="text-2xl">2XL</option>
                                    <option value="text-3xl">3XL</option>
                                    <option value="text-4xl">4XL</option>
                                </select>
                            </div>

                            <div class="flex flex-wrap gap-1 pt-1">
                                <template x-for="color in colors">
                                    <button @click="updateTextColor('text-' + color + '-600')"
                                        :class="`bg-${color}-500 w-4 h-4 rounded-full hover:scale-125 transition`"></button>
                                </template>
                                <button @click="updateTextColor('text-white')"
                                    class="bg-white w-4 h-4 rounded-full border border-gray-500"></button>
                                <button @click="updateTextColor('text-gray-900')"
                                    class="bg-gray-900 w-4 h-4 rounded-full border border-gray-500"></button>
                            </div>
                        </div>

                        <div class="space-y-3 pt-2 border-t border-gray-700">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Spacing</p>
                            <div class="space-y-1">
                                <div class="flex justify-between text-[10px] text-gray-500"><span>Padding</span> <span
                                        x-text="currentPadding"></span></div>
                                <input type="range" min="0" max="12" step="1" x-model="currentPadding"
                                    @input="applyClass('p', 'p-' + currentPadding)"
                                    class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div class="space-y-1">
                                <div class="flex justify-between text-[10px] text-gray-500"><span>Margin</span> <span
                                        x-text="currentMargin"></span></div>
                                <input type="range" min="0" max="12" step="1" x-model="currentMargin"
                                    @input="applyClass('m', 'm-' + currentMargin)"
                                    class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                            </div>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-gray-700">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Background</p>

                            <div class="grid grid-cols-8 gap-1 mb-2">
                                <button @click="applyClass('bg', 'bg-transparent')"
                                    class="w-5 h-5 rounded border border-gray-600 text-[8px] flex items-center justify-center text-gray-500">x</button>
                                <button @click="applyClass('bg', 'bg-white')"
                                    class="bg-white w-5 h-5 rounded border border-gray-600"></button>
                                <template x-for="color in colors">
                                    <button @click="applyClass('bg', 'bg-' + color + '-100')"
                                        :class="`bg-${color}-100 w-5 h-5 rounded hover:opacity-80`"></button>
                                </template>
                                <template x-for="color in colors">
                                    <button @click="applyClass('bg', 'bg-' + color + '-500')"
                                        :class="`bg-${color}-500 w-5 h-5 rounded hover:opacity-80`"></button>
                                </template>
                            </div>

                            <div class="space-y-2">
                                <div class="space-y-1">
                                    <label class="text-[10px] text-gray-500">Image URL</label>
                                    <input type="text" x-model="bgImage" @change="updateBgImage()"
                                        placeholder="https://..."
                                        class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-xs text-blue-300 outline-none">
                                </div>
                                <div class="flex gap-2">
                                    <button @click="applyClass('bg-size', 'bg-cover')"
                                        class="flex-1 py-1 bg-gray-700 text-[10px] rounded hover:bg-gray-600">Cover</button>
                                    <button @click="applyClass('bg-size', 'bg-contain')"
                                        class="flex-1 py-1 bg-gray-700 text-[10px] rounded hover:bg-gray-600">Contain</button>
                                    <button @click="applyClass('bg-pos', 'bg-center')"
                                        class="flex-1 py-1 bg-gray-700 text-[10px] rounded hover:bg-gray-600">Center</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </section>
    </main>

    <script>
        function pageEditor() {
            return {
                showSource: true,
                showInspector: true,
                sourceCode: '',
                selectedEl: null,
                tagName: '',
                textNodes: [],
                imgSrc: '',
                bgImage: '',
                textSize: '',
                textAlign: '',
                breadcrumbs: [],
                viewport: '100%',
                currentPadding: 0,
                currentMargin: 0,
                historyStack: [],
                historyIndex: -1,
                colors: ['slate', 'red', 'orange', 'amber', 'green', 'teal', 'blue', 'indigo', 'purple', 'pink'],

                initEditor() {
                    const starter = `
<div class="flex flex-col items-center justify-center min-h-[400px] p-8 bg-slate-50 text-center font-sans bg-[url('https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1000&q=80')] bg-cover bg-center">
    <div class="bg-white/90 p-10 rounded-2xl shadow-xl max-w-md backdrop-blur-sm border border-white/50">
        <h2 class="text-4xl font-extrabold text-slate-800 mb-3">Hello v2.2</h2>
        <p class="text-lg text-slate-600 mb-6">
            Now with <span class="font-bold text-blue-600">Text Size</span> and <span class="font-bold text-blue-600">Background Images</span>!
        </p>
        <button class="bg-blue-600 text-white text-lg px-8 py-3 rounded-full font-bold hover:bg-blue-700 shadow-lg transition">
            Get Started
        </button>
    </div>
</div>`;
                    this.sourceCode = starter.trim();
                    this.saveHistory();
                    this.syncPreview(false);
                },

                syncPreview(saveToHistory = false) {
                    this.$refs.previewCanvas.innerHTML = this.sourceCode;
                    if (saveToHistory) this.saveHistory();
                },

                updateSourceCode(saveToHistory = true) {
                    if (this.selectedEl) this.selectedEl.classList.remove('editor-selected');
                    const cleanHTML = this.formatHTML(this.$refs.previewCanvas.innerHTML);
                    if (cleanHTML !== this.sourceCode) {
                        this.sourceCode = cleanHTML;
                        if (saveToHistory) this.saveHistory();
                    }
                    if (this.selectedEl) this.selectedEl.classList.add('editor-selected');
                },

                // --- HISTORY ---
                saveHistory() {
                    if (this.historyIndex < this.historyStack.length - 1) {
                        this.historyStack = this.historyStack.slice(0, this.historyIndex + 1);
                    }
                    this.historyStack.push(this.sourceCode);
                    this.historyIndex++;
                    if (this.historyStack.length > 50) { this.historyStack.shift(); this.historyIndex--; }
                },
                undo() {
                    if (this.historyIndex > 0) {
                        this.historyIndex--;
                        this.sourceCode = this.historyStack[this.historyIndex];
                        this.syncPreview(false);
                        this.selectedEl = null;
                    }
                },
                redo() {
                    if (this.historyIndex < this.historyStack.length - 1) {
                        this.historyIndex++;
                        this.sourceCode = this.historyStack[this.historyIndex];
                        this.syncPreview(false);
                        this.selectedEl = null;
                    }
                },

                // --- SELECTION ---
                handleSelection(e) {
                    if (e.target === this.$refs.previewCanvas) return;
                    if (this.selectedEl) this.selectedEl.classList.remove('editor-selected');
                    this.selectedEl = e.target;
                    this.selectedEl.classList.add('editor-selected');
                    this.tagName = this.selectedEl.tagName;

                    this.generateBreadcrumbs();
                    this.scanTextNodes();
                    this.scanAttributes();
                    this.parseCurrentStyles();

                    if (!this.showInspector) this.showInspector = true;
                },

                deselect() {
                    if (this.selectedEl) this.selectedEl.classList.remove('editor-selected');
                    this.selectedEl = null;
                },
                selectElement(el) { this.handleSelection({ target: el }); },

                generateBreadcrumbs() {
                    this.breadcrumbs = [];
                    let curr = this.selectedEl;
                    while (curr && curr !== this.$refs.previewCanvas) {
                        this.breadcrumbs.unshift({ tag: curr.tagName.toLowerCase(), el: curr });
                        curr = curr.parentElement;
                    }
                },

                // --- MANIPULATION ---
                moveElement(direction) {
                    if (!this.selectedEl) return;
                    const parent = this.selectedEl.parentNode;
                    if (direction === 'up' && this.selectedEl.previousElementSibling) {
                        parent.insertBefore(this.selectedEl, this.selectedEl.previousElementSibling);
                    } else if (direction === 'down' && this.selectedEl.nextElementSibling) {
                        parent.insertBefore(this.selectedEl.nextElementSibling, this.selectedEl);
                    }
                    this.updateSourceCode();
                },
                duplicateElement() {
                    if (!this.selectedEl) return;
                    const clone = this.selectedEl.cloneNode(true);
                    clone.classList.remove('editor-selected');
                    this.selectedEl.parentNode.insertBefore(clone, this.selectedEl.nextSibling);
                    this.updateSourceCode();
                },
                deleteElement() {
                    if (!this.selectedEl) return;
                    this.selectedEl.remove();
                    this.selectedEl = null;
                    this.updateSourceCode();
                },

                // --- SPECIFIC STYLE HANDLERS (To prevent Regex Conflicts) ---

                // 1. Text Size
                updateTextSize(val) {
                    // Regex: text-xs, text-sm, text-base, text-lg, text-xl, text-2xl...
                    this.applyRegexClass(/text-(xs|sm|base|lg|xl|[2-9]?xl)\b/g, val);
                    this.textSize = val;
                },

                // 2. Text Color
                updateTextColor(val) {
                    // Regex: text-{color}-{shade} or text-white/black
                    this.applyRegexClass(/text-(slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-(50|100|200|300|400|500|600|700|800|900|950)\b|text-(white|black)\b/g, val);
                },

                // 3. Text Align
                updateTextAlign(val) {
                    this.applyRegexClass(/text-(left|center|right|justify|start|end)\b/g, val);
                    this.textAlign = val;
                },

                // 4. Background Image
                updateBgImage() {
                    const val = this.bgImage.trim() ? `bg-[url('${this.bgImage}')]` : '';
                    // Regex handles: bg-[url('...')] or bg-[url(...)]
                    this.applyRegexClass(/bg-\[url\(.*?\)\].*?/g, val);
                },

                // --- GENERIC STYLE APP ---
                applyClass(prefix, newClass) {
                    // Fallback to prefix logic for simple classes (p-*, m-*, font-*, bg-{color})
                    const regex = new RegExp(`\\b${prefix}-[\\w-]+\\b`, 'g');
                    this.applyRegexClass(regex, newClass);
                },

                applyRegexClass(regex, newClass) {
                    if (!this.selectedEl) return;
                    let classes = this.selectedEl.className;

                    if (classes.match(regex)) {
                        classes = classes.replace(regex, newClass);
                    } else {
                        classes += ` ${newClass}`;
                    }

                    this.selectedEl.className = classes.replace(/\s+/g, ' ').trim();
                    this.updateSourceCode();
                },

                // --- PARSERS ---
                parseCurrentStyles() {
                    const classes = this.selectedEl.className;

                    // Padding/Margin
                    const pMatch = classes.match(/\bp-(\d+)\b/);
                    this.currentPadding = pMatch ? pMatch[1] : 0;
                    const mMatch = classes.match(/\bm-(\d+)\b/);
                    this.currentMargin = mMatch ? mMatch[1] : 0;

                    // Text Size
                    const sizeMatch = classes.match(/text-(xs|sm|base|lg|xl|[2-9]?xl)\b/);
                    this.textSize = sizeMatch ? sizeMatch[0] : 'text-base';

                    // Text Align
                    const alignMatch = classes.match(/text-(left|center|right)\b/);
                    this.textAlign = alignMatch ? alignMatch[0] : '';

                    // BG Image
                    const bgMatch = classes.match(/bg-\[url\(['"]?(.*?)['"]?\)\]/);
                    this.bgImage = bgMatch ? bgMatch[1] : '';
                },

                scanTextNodes() {
                    this.textNodes = [];
                    this.selectedEl.childNodes.forEach((node, index) => {
                        if (node.nodeType === 3 && node.nodeValue.trim().length > 0) {
                            this.textNodes.push({ index, text: node.nodeValue.trim(), ref: node });
                        }
                    });
                },
                updateTextNode(idx, newVal) { this.textNodes[idx].ref.nodeValue = newVal; this.updateSourceCode(); },
                updateAttr(attr, val) { this.selectedEl.setAttribute(attr, val); this.updateSourceCode(); },
                scanAttributes() { if (this.tagName === 'IMG') this.imgSrc = this.selectedEl.getAttribute('src') || ''; },

                formatHTML(html) {
                    let formatted = '';
                    let indent = 0;
                    html = html.replace(/>\s+</g, '><').trim();
                    html.split(/>\s*</).forEach(function (element) {
                        if (element.match(/^\/\w/)) indent -= 4;
                        formatted += ' '.repeat(Math.max(0, indent)) + '<' + element + '>\n';
                        if (element.match(/^<?\w[^>]*[^\/]$/) && !element.startsWith("input") && !element.startsWith("img") && !element.startsWith("br")) indent += 4;
                    });
                    return formatted.substring(1, formatted.length - 2);
                },
                copyToClipboard() { navigator.clipboard.writeText(this.sourceCode); alert('HTML copied!'); }
            }
        }
    </script>
</body>

</html>
