<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Vision & Gen-Art Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        [x-cloak] {
            display: none !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }

        /* Animasi fade in untuk gambar baru */
        .img-fade {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <div x-data="chatApp()" x-init="init()" class="flex flex-col h-screen max-w-5xl mx-auto p-2 sm:p-4">

        <header
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <span class="material-icons text-purple-400">wallpaper</span>
                    Vision & Art Client
                </h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">Multi-modal Interaction</p>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div
                    class="relative flex-1 flex items-center bg-slate-900 rounded-xl border border-slate-700 focus-within:border-purple-500 transition-all">
                    <input list="model-list" x-model="config.model" placeholder="Search/Type Model ID..."
                        class="bg-transparent text-sm p-2.5 outline-none w-full sm:w-64">
                    <datalist id="model-list">
                        <template x-for="model in availableModels" :key="model.id">
                            <option :value="model.id" x-text="model.name"></option>
                        </template>
                    </datalist>
                    <button @click="fetchModels()" :disabled="isFetchingModels"
                        class="pr-3 text-slate-500 hover:text-purple-400">
                        <span class="material-icons text-sm" :class="isFetchingModels ? 'animate-spin' : ''">sync</span>
                    </button>
                </div>

                <button @click="showSettings = true"
                    class="p-2.5 bg-slate-900 border border-slate-700 hover:border-purple-500 rounded-xl transition">
                    <span class="material-icons text-sm">settings</span>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scrollbar space-y-6 px-2" id="chat-window">
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="msg.role === 'user' ? 'bg-purple-700 border-purple-500' : 'bg-slate-800 border-slate-700'"
                        class="max-w-[90%] sm:max-w-[75%] rounded-2xl p-4 border shadow-xl">

                        <div class="flex items-center gap-2 mb-2 opacity-50">
                            <span class="material-icons text-xs"
                                x-text="msg.role === 'user' ? 'person' : 'smart_toy'"></span>
                            <span class="text-[10px] font-bold uppercase" x-text="msg.role"></span>
                        </div>

                        <div class="space-y-3 text-sm leading-relaxed">
                            <template x-if="typeof msg.content === 'string'">
                                <div class="prose prose-invert max-w-none">
                                    <template x-for="part in formatMessage(msg.content)">
                                        <span>
                                            <template x-if="part.type === 'text'">
                                                <span class="whitespace-pre-wrap" x-text="part.value"></span>
                                            </template>
                                            <template x-if="part.type === 'image'">
                                                <div class="my-3">
                                                    <img :src="part.value" :alt="part.alt"
                                                        class="rounded-xl border border-slate-600 shadow-2xl img-fade max-h-96 w-auto cursor-zoom-in"
                                                        @click="window.open(part.value, '_blank')">
                                                    <p class="text-[10px] text-slate-500 mt-1 italic" x-text="part.alt">
                                                    </p>
                                                </div>
                                            </template>
                                        </span>
                                    </template>
                                </div>
                            </template>

                            <template x-if="Array.isArray(msg.content)">
                                <div class="space-y-3">
                                    <template x-for="part in msg.content">
                                        <div>
                                            <template x-if="part.type === 'text'">
                                                <p x-text="part.text"></p>
                                            </template>
                                            <template x-if="part.type === 'image_url'">
                                                <img :src="part.image_url.url"
                                                    class="rounded-lg max-h-48 border border-white/20 shadow-md">
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <div x-show="isLoading" class="flex justify-start animate-pulse">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex gap-2">
                    <div class="w-2 h-2 bg-purple-500 rounded-full"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full"></div>
                </div>
            </div>
        </main>

        <footer class="mt-4 bg-slate-800 rounded-2xl p-3 border border-slate-700 shadow-2xl">
            <div x-show="imagePreview" class="mb-3 relative inline-block">
                <img :src="imagePreview" class="h-32 w-32 object-cover rounded-xl border-2 border-purple-500 shadow-lg">
                <button @click="clearImage"
                    class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 rounded-full p-1 shadow-xl transition">
                    <span class="material-icons text-xs font-bold">close</span>
                </button>
            </div>

            <div class="flex items-end gap-3">
                <label
                    class="mb-1 p-2.5 hover:bg-slate-700 rounded-xl cursor-pointer transition text-slate-400 hover:text-purple-400 group">
                    <span class="material-icons">attach_file</span>
                    <input type="file" @change="handleFileUpload" class="hidden" accept="image/*">
                </label>

                <textarea x-model="userInput" @keydown.enter.prevent="sendMessage()"
                    placeholder="Ask to analyze this image or generate something..." rows="1"
                    class="flex-1 bg-transparent py-3 outline-none resize-none text-sm max-h-48 custom-scrollbar"></textarea>

                <button @click="sendMessage()" :disabled="isLoading || (!userInput.trim() && !imagePreview)"
                    class="mb-1 p-3 bg-purple-600 hover:bg-purple-700 disabled:opacity-20 rounded-xl transition shadow-lg shadow-purple-900/20">
                    <span class="material-icons" x-text="isLoading ? 'hourglass_top' : 'send'"></span>
                </button>
            </div>
        </footer>

        <div x-show="showSettings" x-cloak
            class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div @click.away="showSettings = false"
                class="bg-slate-800 w-full max-w-md p-8 rounded-3xl border border-slate-700 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Configuration</h3>
                    <button @click="showSettings = false" class="text-slate-500 hover:text-white"><span
                            class="material-icons">close</span></button>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase font-black mb-2 block">API Key</label>
                        <input type="password" x-model="config.apiKey" placeholder="sk-or-..."
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm focus:border-purple-500 outline-none transition-all">
                    </div>
                    <button @click="saveSettings()"
                        class="w-full bg-purple-600 hover:bg-purple-700 py-4 rounded-xl font-bold transition">
                        Save & Initialize
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function chatApp() {
            return {
                showSettings: false,
                isLoading: false,
                isFetchingModels: false,
                userInput: '',
                imagePreview: null,
                imageBase64: null,
                availableModels: [],
                messages: [{ role: 'assistant', content: 'Ready! If you use an image generation model, I can display the result here. You can also upload images for analysis.' }],
                config: {
                    apiKey: '',
                    model: 'openai/gpt-4o-mini'
                },

                init() {
                    const key = localStorage.getItem('openrouter_key');
                    if (key) {
                        this.config.apiKey = key;
                        this.fetchModels();
                    } else {
                        this.showSettings = true;
                    }
                },

                // Handler untuk mendeteksi Markdown Images dalam teks respon
                formatMessage(text) {
                    const parts = [];
                    // Regex untuk mendeteksi ![alt](url)
                    const mdImageRegex = /!\[(.*?)\]\((.*?)\)/g;
                    let lastIndex = 0;
                    let match;

                    while ((match = mdImageRegex.exec(text)) !== null) {
                        // Tambahkan teks sebelum gambar
                        if (match.index > lastIndex) {
                            parts.push({ type: 'text', value: text.substring(lastIndex, match.index) });
                        }
                        // Tambahkan gambar
                        parts.push({ type: 'image', alt: match[1], value: match[2] });
                        lastIndex = mdImageRegex.lastIndex;
                    }

                    // Tambahkan sisa teks
                    if (lastIndex < text.length) {
                        parts.push({ type: 'text', value: text.substring(lastIndex) });
                    }

                    return parts.length > 0 ? parts : [{ type: 'text', value: text }];
                },

                async fetchModels() {
                    this.isFetchingModels = true;
                    try {
                        const res = await fetch("https://openrouter.ai/api/v1/models");
                        const data = await res.json();
                        this.availableModels = data.data.map(m => ({ id: m.id, name: m.name || m.id }));
                    } catch (e) { console.error(e); } finally { this.isFetchingModels = false; }
                },

                saveSettings() {
                    localStorage.setItem('openrouter_key', this.config.apiKey);
                    this.fetchModels();
                    this.showSettings = false;
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        this.imagePreview = f.target.result;
                        this.imageBase64 = f.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                clearImage() {
                    this.imagePreview = null;
                    this.imageBase64 = null;
                },

                async sendMessage() {
                    if (this.isLoading || (!this.userInput.trim() && !this.imageBase64)) return;

                    const content = this.imageBase64
                        ? [{ type: "text", text: this.userInput }, { type: "image_url", image_url: { url: this.imageBase64 } }]
                        : this.userInput;

                    this.messages.push({ role: 'user', content });

                    const payload = {
                        model: this.config.model,
                        messages: this.messages
                    };

                    this.userInput = '';
                    this.clearImage();
                    this.isLoading = true;
                    this.scrollToBottom();

                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${this.config.apiKey}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        if (data.choices) {
                            this.messages.push(data.choices[0].message);
                        } else {
                            throw new Error(data.error?.message || "Request Error");
                        }
                    } catch (error) {
                        this.messages.push({ role: 'assistant', content: `Error: ${error.message}` });
                    } finally {
                        this.isLoading = false;
                        this.scrollToBottom();
                    }
                },

                scrollToBottom() {
                    setTimeout(() => {
                        const el = document.getElementById('chat-window');
                        el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                    }, 100);
                }
            }
        }
    </script>
</body>

</html>
