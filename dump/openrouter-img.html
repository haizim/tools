<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Alpine OpenRouter Client</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .prose img {
            border-radius: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            max-width: 100%;
        }

        .prose pre {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        .prose code {
            color: #e2e8f0;
            background-color: #334155;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
        }

        .prose pre code {
            background-color: transparent;
            padding: 0;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-200 font-sans h-screen flex overflow-hidden" x-data="openRouterApp()">

    <aside class="w-80 bg-slate-950 border-r border-slate-800 flex flex-col transition-all duration-300"
        :class="showSidebar ? 'translate-x-0' : '-translate-x-80 absolute h-full z-20'">

        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <h1 class="font-bold text-lg text-blue-400 flex items-center gap-2">
                <span class="material-icons">hub</span> OpenRouter
            </h1>
            <button @click="startNewChat()" class="p-1 hover:bg-slate-800 rounded text-slate-400" title="New Chat">
                <span class="material-icons">add_comment</span>
            </button>
        </div>

        <div class="p-4 space-y-4 overflow-y-auto flex-1">

            <div>
                <label class="text-xs text-slate-500 uppercase font-semibold">API Key</label>
                <input type="password" x-model="apiKey" @change="saveSettings(); fetchModels()" placeholder="sk-or-..."
                    class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none mt-1">
            </div>

            <div>
                <label class="text-xs text-slate-500 uppercase font-semibold">Model</label>
                <div class="relative mt-1">
                    <select x-model="selectedModel" @change="saveSettings()"
                        class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none appearance-none">
                        <template x-for="model in modelList" :key="model.id">
                            <option :value="model.id" x-text="model.name || model.id"></option>
                        </template>
                        <option value="openai/gpt-3.5-turbo" x-show="modelList.length === 0">Default: GPT-3.5</option>
                    </select>
                    <span
                        class="material-icons absolute right-2 top-1.5 text-slate-500 text-sm pointer-events-none">expand_more</span>
                </div>
                <input type="text" x-model="selectedModel" @change="saveSettings()" placeholder="Model ID"
                    class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none mt-1">
                Selected Model ID : <b x-text="selectedModel"></b>
                <button @click="fetchModels()" class="text-xs text-blue-500 mt-1 hover:underline">Refresh
                    Models</button>
            </div>

            <div>
                <label class="text-xs text-slate-500 uppercase font-semibold">System Prompt</label>
                <textarea x-model="systemPrompt" @change="saveSettings()" rows="3"
                    class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none mt-1 resize-none"></textarea>
            </div>

            <div class="space-y-3 pt-2 border-t border-slate-800">
                <div class="flex items-center justify-between">
                    <label class="text-sm">Stream Response</label>
                    <button @click="enableStream = !enableStream; saveSettings()"
                        class="w-10 h-5 rounded-full flex items-center p-1 transition-colors duration-300"
                        :class="enableStream ? 'bg-blue-600' : 'bg-slate-700'">
                        <div class="bg-white w-3 h-3 rounded-full shadow-md transform transition-transform duration-300"
                            :class="enableStream ? 'translate-x-5' : 'translate-x-0'"></div>
                    </button>
                </div>

                <div>
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Temperature</span>
                        <span x-text="temperature"></span>
                    </div>
                    <input type="range" min="0" max="2" step="0.1" x-model="temperature" @change="saveSettings()"
                        class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer mt-1">
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800 grid grid-cols-2 gap-2">
                <button @click="exportChats()"
                    class="flex items-center justify-center gap-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded transition">
                    <span class="material-icons text-sm">download</span> Export
                </button>
                <label
                    class="flex items-center justify-center gap-1 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded transition cursor-pointer">
                    <span class="material-icons text-sm">upload</span> Import
                    <input type="file" class="hidden" @change="importChats($event)">
                </label>
            </div>

        </div>

        <div class="p-2 border-t border-slate-800 h-1/3 overflow-y-auto">
            <div class="text-xs text-slate-500 mb-2 px-2">HISTORY</div>
            <template x-for="(chat, index) in history" :key="index">
                <div @click="loadChat(index)"
                    class="px-3 py-2 text-sm truncate rounded cursor-pointer hover:bg-slate-800 transition flex justify-between group"
                    :class="currentChatIndex === index ? 'bg-slate-800 text-blue-400' : 'text-slate-300'">
                    <span x-text="chat.title || 'Untitled Chat'"></span>
                    <span @click.stop="deleteChat(index)"
                        class="material-icons text-sm text-red-400 opacity-0 group-hover:opacity-100 hover:text-red-300">delete</span>
                </div>
            </template>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative">

        <button @click="showSidebar = !showSidebar"
            class="absolute top-4 left-4 z-30 p-2 bg-slate-800 rounded-full shadow-lg text-slate-300 hover:text-white transition">
            <span class="material-icons" x-text="showSidebar ? 'chevron_left' : 'menu'"></span>
        </button>

        <div class="flex-1 overflow-y-auto p-4 md:p-10 space-y-6" id="chatContainer">

            <div x-show="messages.length === 0"
                class="flex flex-col items-center justify-center h-full text-slate-500 opacity-50">
                <span class="material-icons text-6xl mb-4">smart_toy</span>
                <p>Select a model and start chatting</p>
            </div>

            <template x-for="(msg, idx) in messages" :key="idx">
                <div class="flex flex-col gap-2" :class="msg.role === 'user' ? 'items-end' : 'items-start'">

                    <div class="text-xs font-bold uppercase tracking-wider"
                        :class="msg.role === 'user' ? 'text-blue-400' : 'text-green-400'" x-text="msg.role"></div>

                    <!-- <textarea x-text="JSON.stringify(msg)"></textarea>
                    <p x-text="idx"></p> -->

                    <div class="max-w-[85%] rounded-lg p-4 shadow-sm"
                        :class="msg.role === 'user' ? 'bg-blue-900/30 border border-blue-800/50' : 'bg-slate-800 border border-slate-700'">

                        <template x-if="msg.image">
                            <div class="mb-3 relative group inline-block">
                                <img :src="msg.image" class="max-h-64 rounded border border-slate-600">
                                <button @click="downloadImage(msg.image, 'input-image.png')"
                                    class="absolute bottom-2 right-2 bg-black/70 p-1 rounded hover:bg-black text-white opacity-0 group-hover:opacity-100 transition">
                                    <span class="material-icons text-sm">download</span>
                                </button>
                            </div>
                        </template>

                        <div class="prose prose-invert text-sm leading-relaxed" x-html="renderMarkdown(msg.content)">
                        </div>

                        <template x-if="msg.role === 'assistant' && msg.isLoading">
                            <span class="inline-flex gap-1 mt-2">
                                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
                                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"
                                    style="animation-delay: 0.2s"></span>
                                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"
                                    style="animation-delay: 0.4s"></span>
                            </span>
                        </template>
                    </div>

                    <template x-if="msg.role === 'assistant' && hasImageInContent(msg.content)">
                        <button @click="extractAndDownload(msg.content)"
                            class="text-xs text-green-400 hover:text-green-300 flex items-center gap-1">
                            <span class="material-icons text-sm">image</span> Download Generated Image
                        </button>
                    </template>
                </div>
            </template>
            <div id="scrollAnchor"></div>
        </div>

        <div class="p-4 bg-slate-950 border-t border-slate-800">

            <div x-show="imageBase64" class="mb-2 relative inline-block">
                <img :src="imageBase64" class="h-16 rounded border border-slate-700">
                <button @click="imageBase64 = null; $refs.fileInput.value = ''"
                    class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 shadow">
                    <span class="material-icons text-xs">close</span>
                </button>
            </div>

            <div class="flex gap-2 max-w-4xl mx-auto">
                <button @click="$refs.fileInput.click()"
                    class="p-3 text-slate-400 hover:text-blue-400 bg-slate-900 border border-slate-700 rounded-lg transition">
                    <span class="material-icons">add_photo_alternate</span>
                </button>
                <input type="file" x-ref="fileInput" class="hidden" accept="image/*" @change="handleFileUpload($event)">

                <textarea x-model="userInput" @keydown.enter="if($event.ctrlKey) sendMessage()"
                    placeholder="Type a message..." rows="3"
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none overflow-hidden"
                    style="min-height: 48px; max-height: 150px;"
                    x-effect="$el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'"></textarea>

                <button @click="sendMessage()" :disabled="isSending || (!userInput && !imageBase64)"
                    class="p-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-lg transition shadow-lg">
                    <span class="material-icons" x-show="!isSending">send</span>
                    <span class="material-icons animate-spin" x-show="isSending">sync</span>
                </button>
            </div>
            <div class="text-center mt-2 text-xs text-slate-500">
                <span x-text="selectedModel"></span> &bull; <span
                    x-text="enableStream ? 'Streaming On' : 'Streaming Off'"></span>
            </div>
        </div>

    </main>

    <script>
        let dt

        function openRouterApp() {
            return {
                // State
                apiKey: '',
                modelList: [],
                selectedModel: 'openai/gpt-3.5-turbo',
                systemPrompt: 'You are a helpful assistant.',
                temperature: 0.7,
                enableStream: true, // Default On

                showSidebar: true,
                history: [],
                messages: [],
                currentChatIndex: null,

                userInput: '',
                imageBase64: null,
                isSending: false,

                init() {
                    // Load from LocalStorage
                    const savedSettings = JSON.parse(localStorage.getItem('or_settings') || '{}');
                    this.apiKey = savedSettings.apiKey || '';
                    this.systemPrompt = savedSettings.systemPrompt || 'You are a helpful assistant.';
                    this.temperature = savedSettings.temperature || 0.7;
                    this.selectedModel = savedSettings.selectedModel || 'openai/gpt-3.5-turbo';
                    // Load Stream preference, default to true if undefined
                    this.enableStream = savedSettings.enableStream !== undefined ? savedSettings.enableStream : true;

                    this.history = JSON.parse(localStorage.getItem('or_history') || '[]');

                    if (this.history.length > 0) {
                        this.loadChat(0);
                    } else {
                        this.startNewChat();
                    }

                    if (this.apiKey) {
                        this.fetchModels();
                    }
                },

                saveSettings() {
                    localStorage.setItem('or_settings', JSON.stringify({
                        apiKey: this.apiKey,
                        systemPrompt: this.systemPrompt,
                        temperature: this.temperature,
                        selectedModel: this.selectedModel,
                        enableStream: this.enableStream
                    }));
                },

                saveHistory() {
                    // Update current chat in history array
                    if (this.currentChatIndex !== null && this.history[this.currentChatIndex]) {
                        this.history[this.currentChatIndex].messages = this.messages;
                        // Auto-title based on first user message if Untitled
                        if (this.messages.length > 0 && this.history[this.currentChatIndex].title === 'New Chat') {
                            const firstMsg = this.messages.find(m => m.role === 'user');
                            if (firstMsg) {
                                this.history[this.currentChatIndex].title = firstMsg.content.substring(0, 30) + '...';
                            }
                        }
                    }
                    localStorage.setItem('or_history', JSON.stringify(this.history));
                },

                async fetchModels() {
                    if (!this.apiKey) return;
                    try {
                        const res = await fetch('https://openrouter.ai/api/v1/models', {
                            headers: { 'Authorization': `Bearer ${this.apiKey}` }
                        });
                        const data = await res.json();
                        if (data.data) {
                            this.modelList = data.data.sort((a, b) => a.id.localeCompare(b.id));
                        }
                    } catch (e) {
                        console.error("Failed to fetch models", e);
                    }
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        this.imageBase64 = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                startNewChat() {
                    this.messages = [];
                    this.history.unshift({ title: 'New Chat', timestamp: Date.now(), messages: [] });
                    this.currentChatIndex = 0;
                    this.saveHistory();
                },

                loadChat(index) {
                    this.currentChatIndex = index;
                    this.messages = this.history[index].messages || [];
                },

                deleteChat(index) {
                    this.history.splice(index, 1);
                    if (this.history.length === 0) {
                        this.startNewChat();
                    } else {
                        this.loadChat(0);
                    }
                    this.saveHistory();
                },

                async sendMessage() {
                    if ((!this.userInput.trim() && !this.imageBase64) || this.isSending) return;

                    const userMsgContent = this.userInput;
                    const userImage = this.imageBase64;

                    // 1. Add User Message
                    this.messages.push({
                        role: 'user',
                        content: userMsgContent,
                        image: userImage
                    });

                    // Prepare payload content
                    let contentPayload;
                    if (userImage) {
                        contentPayload = [
                            { type: "text", text: userMsgContent },
                            { type: "image_url", image_url: { url: userImage } }
                        ];
                    } else {
                        contentPayload = userMsgContent;
                    }

                    // Prepare Request History
                    // Filter messages to send only text/image content needed for API
                    const apiMessages = [
                        { role: 'system', content: this.systemPrompt },
                        ...this.messages.map(m => {
                            let c = m.content;
                            if (m.image) {
                                c = [
                                    { type: "text", text: m.content },
                                    { type: "image_url", image_url: { url: m.image } }
                                ];
                            }
                            return { role: m.role, content: c };
                        })
                    ];
                    // Remove the last one we just added locally to avoid duplication in payload construction if logic differs, 
                    // but usually we just send the whole array. Ideally, we shouldn't send the base64 back if the server has no state, 
                    // but OpenRouter is stateless, so we must send full context.
                    // Note: Sending huge base64 history can be expensive.

                    this.userInput = '';
                    this.imageBase64 = null;
                    this.$refs.fileInput.value = '';
                    this.isSending = true;
                    this.scrollToBottom();

                    // 2. Add Placeholder Assistant Message
                    this.messages.push({
                        role: 'assistant',
                        content: '',
                        isLoading: true
                    });
                    const assistantIndex = this.messages.length - 1;

                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${this.apiKey}`,
                                "Content-Type": "application/json",
                                "HTTP-Referer": window.location.href,
                                "X-Title": "Mini Alpine Client"
                            },
                            body: JSON.stringify({
                                model: this.selectedModel,
                                messages: apiMessages,
                                temperature: parseFloat(this.temperature),
                                stream: this.enableStream // Toggle Stream
                            })
                        });

                        if (!response.ok) throw new Error('API Error');

                        // HANDLE STREAMING
                        if (this.enableStream) {
                            const reader = response.body.getReader();
                            const decoder = new TextDecoder("utf-8");
                            let buffer = "";

                            this.messages[assistantIndex].isLoading = false; // Start showing content

                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;

                                buffer += decoder.decode(value, { stream: true });
                                const lines = buffer.split("\n");
                                buffer = lines.pop(); // Keep incomplete chunk

                                for (const line of lines) {
                                    if (line.trim() === "") continue;
                                    if (line.trim() === "data: [DONE]") continue;
                                    if (line.startsWith("data: ")) {
                                        try {
                                            const json = JSON.parse(line.substring(6));
                                            const delta = json.choices[0].delta.content;
                                            if (delta) {
                                                this.messages[assistantIndex].content += delta;
                                                this.scrollToBottom();
                                            }
                                        } catch (e) { console.error("Parse error", e); }
                                    }
                                }
                            }
                        }
                        // HANDLE NON-STREAMING
                        else {
                            const data = await response.json();
                            dt = data;
                            console.log(dt);

                            this.messages[assistantIndex].isLoading = false;
                            this.messages[assistantIndex].content = data.choices[0].message.content;
                            this.messages[assistantIndex].image = data.choices[0].message.images ? data.choices[0].message.images[0].image_url.url : null;
                        }

                        this.saveHistory();

                    } catch (error) {
                        this.messages[assistantIndex].isLoading = false;
                        this.messages[assistantIndex].content = "Error: " + error.message;
                    } finally {
                        this.isSending = false;
                        this.scrollToBottom();
                    }
                },

                renderMarkdown(text) {
                    return marked.parse(text || '');
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = document.getElementById('chatContainer');
                        container.scrollTop = container.scrollHeight;
                    });
                },

                // UTILS: Download / Import / Export
                downloadImage(url, filename) {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename || 'image.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                },

                hasImageInContent(content) {
                    // Basic check if markdown contains an image tag
                    return content.includes('![');
                },

                extractAndDownload(content) {
                    // Extract URL from markdown format ![alt](url)
                    const match = content.match(/!\[.*?\]\((.*?)\)/);
                    if (match && match[1]) {
                        this.downloadImage(match[1], 'generated-output.png');
                    }
                },

                exportChats() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.history));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "chat_history.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                },

                importChats(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (Array.isArray(imported)) {
                                this.history = [...imported, ...this.history];
                                this.saveHistory();
                                alert('Chats imported successfully!');
                            }
                        } catch (err) {
                            alert('Invalid JSON file');
                        }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
</body>

</html>
