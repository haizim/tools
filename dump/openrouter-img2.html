<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Alpine OpenRouter (IndexedDB)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .prose img {
            border-radius: 0.5rem;
            margin: 1rem 0;
            max-width: 100%;
        }

        .prose pre {
            background-color: #020617;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            border: 1px solid #1e293b;
        }

        .prose code {
            color: #e2e8f0;
            background-color: #1e293b;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.85em;
        }

        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        .prose p {
            margin-bottom: 0.5rem;
        }

        [x-cloak] {
            display: none !important;
        }

        /* Loading Overlay Transition */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.5s;
        }

        .fade-enter,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-200 font-sans h-screen flex overflow-hidden" x-data="openRouterApp()" x-cloak>

    <div x-show="!dbReady" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center flex-col gap-4">
        <span class="material-icons text-5xl text-blue-500 animate-spin">sync</span>
        <p class="text-sm text-slate-400">Initializing IndexedDB...</p>
    </div>

    <aside
        class="w-80 bg-slate-950 border-r border-slate-800 flex flex-col transition-all duration-300 absolute z-20 h-full md:relative"
        :class="showSidebar ? 'translate-x-0 shadow-2xl md:shadow-none' : '-translate-x-full md:-translate-x-0 md:w-0 md:opacity-0 overflow-hidden'">

        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
            <h1 class="font-bold text-lg text-blue-400 flex items-center gap-2">
                <span class="material-icons">storage</span> OR Client
            </h1>
            <button @click="startNewChat()" class="p-1 hover:bg-slate-800 rounded text-slate-400 transition"
                title="New Chat">
                <span class="material-icons">add_comment</span>
            </button>
        </div>

        <div class="p-4 space-y-4 overflow-y-auto flex-1 custom-scrollbar">

            <div>
                <label class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">API Key</label>
                <div class="relative">
                    <input :type="showKey ? 'text' : 'password'" x-model="apiKey"
                        @change="saveSettings(); fetchModels()" placeholder="sk-or-..."
                        class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none mt-1 text-slate-300 placeholder-slate-600">
                    <button @click="showKey = !showKey"
                        class="absolute right-2 top-2 text-slate-500 hover:text-slate-300">
                        <span class="material-icons text-sm" x-text="showKey ? 'visibility_off' : 'visibility'"></span>
                    </button>
                </div>
            </div>

            <div>
                <label class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Model</label>
                <div class="relative mt-1 group">
                    <select x-model="selectedModel" @change="saveSettings(); updateCurrentModelPrice()"
                        class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none appearance-none cursor-pointer truncate pr-8">
                        <template x-for="model in modelList" :key="model.id">
                            <option :value="model.id" x-text="model.name"></option>
                        </template>
                        <option value="openai/gpt-3.5-turbo" x-show="modelList.length === 0">Default: GPT-3.5</option>
                    </select>
                    <span
                        class="material-icons absolute right-2 top-1.5 text-slate-500 text-sm pointer-events-none group-hover:text-blue-400 transition">expand_more</span>
                </div>
                <input type="text" x-model="selectedModel" @change="saveSettings(); updateCurrentModelPrice()"
                    class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none appearance-none cursor-pointer truncate pr-8">
                <div class="mt-1 flex justify-between text-[10px] text-slate-500 px-1">
                    <span>In: $<span x-text="currentModelPricing.prompt"></span>/1M</span>
                    <span>Out: $<span x-text="currentModelPricing.completion"></span>/1M</span>
                </div>
            </div>

            <div>
                <label class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">System Prompt</label>
                <textarea x-model="systemPrompt" @change="saveSettings()" rows="3"
                    class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none mt-1 resize-none text-slate-300"></textarea>
            </div>

            <div class="space-y-3 pt-2 border-t border-slate-800">
                <div class="flex items-center justify-between cursor-pointer"
                    @click="enableStream = !enableStream; saveSettings()">
                    <label class="text-xs font-medium cursor-pointer">Stream Response</label>
                    <div class="w-8 h-4 rounded-full relative transition-colors duration-300"
                        :class="enableStream ? 'bg-blue-600' : 'bg-slate-700'">
                        <div class="bg-white w-3 h-3 rounded-full shadow absolute top-0.5 left-0.5 transition-transform duration-300"
                            :class="enableStream ? 'translate-x-4' : 'translate-x-0'"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span>Temperature</span>
                        <span x-text="temperature"></span>
                    </div>
                    <input type="range" min="0" max="2" step="0.1" x-model="temperature" @change="saveSettings()"
                        class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <div class="pt-2 border-t border-slate-800 grid grid-cols-2 gap-2">
                <button @click="exportChats()"
                    class="flex items-center justify-center gap-1 bg-slate-800 hover:bg-slate-700 text-[10px] py-1.5 rounded transition border border-slate-700">
                    <span class="material-icons text-xs">download</span> Export JSON
                </button>
                <label
                    class="flex items-center justify-center gap-1 bg-slate-800 hover:bg-slate-700 text-[10px] py-1.5 rounded transition cursor-pointer border border-slate-700">
                    <span class="material-icons text-xs">upload</span> Import JSON
                    <input type="file" class="hidden" @change="importChats($event)">
                </label>
            </div>

            <div class="text-[10px] text-center text-slate-600 pt-2">
                Storage: IndexedDB (High Capacity)
            </div>
        </div>

        <div class="flex-1 flex flex-col min-h-0 border-t border-slate-800 bg-slate-950">
            <div class="text-[10px] text-slate-500 font-bold tracking-wider px-4 py-2 bg-slate-950 sticky top-0 z-10">
                HISTORY</div>
            <div class="overflow-y-auto flex-1 p-2 space-y-1 custom-scrollbar">
                <template x-for="chat in history" :key="chat.id">
                    <div @click="loadChat(chat.id)"
                        class="px-3 py-2 text-xs truncate rounded cursor-pointer transition flex justify-between items-center group border border-transparent"
                        :class="currentChatId === chat.id ? 'bg-slate-800 border-slate-700 text-blue-400' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'">
                        <span x-text="chat.title || 'Untitled Chat'" class="truncate flex-1"></span>
                        <button @click.stop="deleteChat(chat.id)"
                            class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition"
                            title="Delete Chat">
                            <span class="material-icons text-xs">delete</span>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative bg-slate-900 w-full min-w-0">

        <div class="h-14 border-b border-slate-800 flex items-center justify-between px-4 bg-slate-900 z-10 shadow-sm">
            <div class="flex items-center gap-3">
                <button @click="showSidebar = !showSidebar"
                    class="p-2 -ml-2 text-slate-400 hover:text-white transition rounded-full hover:bg-slate-800">
                    <span class="material-icons" x-text="showSidebar ? 'menu_open' : 'menu'"></span>
                </button>
                <div class="flex flex-col">
                    <span class="text-sm font-semibold text-slate-200"
                        x-text="modelList.find(m => m.id === selectedModel)?.name || selectedModel"></span>
                    <div class="text-[10px] text-slate-500 flex gap-2">
                        <template x-if="sessionStats.totalCost > 0">
                            <span class="text-blue-400 font-mono">
                                Total: $<span x-text="sessionStats.totalCost.toFixed(5)"></span>
                                (<span x-text="sessionStats.totalTokens"></span> toks)
                            </span>
                        </template>
                        <span x-show="sessionStats.totalCost === 0">Ready</span>
                    </div>
                </div>
            </div>
            <button @click="startNewChat()" class="md:hidden p-2 text-slate-400 hover:text-white">
                <span class="material-icons">add_comment</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth" id="chatContainer">

            <div x-show="messages.length === 0" class="flex flex-col items-center justify-center h-full text-slate-600">
                <span class="material-icons text-7xl mb-4 opacity-20">storage</span>
                <p class="text-sm">IndexedDB Enabled. High Capacity Storage.</p>
                <div class="mt-4 flex gap-2 text-xs">
                    <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700">Local Data</span>
                    <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700">Encrypted Key</span>
                    <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700">Cost Tracking</span>
                </div>
            </div>

            <template x-for="(msg, idx) in messages" :key="idx">
                <div class="group flex flex-col gap-1 max-w-4xl mx-auto w-full animate-fade-in"
                    :class="msg.role === 'user' ? 'items-end' : 'items-start'">

                    <div class="flex items-center gap-2 px-1 opacity-60 text-[10px] uppercase font-bold tracking-wider mb-1"
                        :class="msg.role === 'user' ? 'flex-row-reverse' : ''">
                        <span :class="msg.role === 'user' ? 'text-blue-400' : 'text-purple-400'"
                            x-text="msg.role"></span>

                        <button @click="deleteMessage(idx)"
                            class="opacity-0 group-hover:opacity-100 transition text-slate-500 hover:text-red-400"
                            title="Delete Message">
                            <span class="material-icons text-[14px]">delete</span>
                        </button>
                    </div>

                    <div class="max-w-[90%] md:max-w-[80%] rounded-xl p-4 shadow-sm border text-sm relative"
                        :class="msg.role === 'user' ? 'bg-blue-950/40 border-blue-900/50 rounded-tr-none' : 'bg-slate-800/80 border-slate-700/80 rounded-tl-none'">

                        <template x-if="msg.image">
                            <div class="mb-3 relative inline-block group/img">
                                <img :src="msg.image" class="max-h-64 rounded border border-slate-600/50 bg-black/20">
                                <a :href="msg.image" download="upload.png"
                                    class="absolute bottom-2 right-2 p-1 bg-black/60 hover:bg-black rounded text-white opacity-0 group-hover/img:opacity-100 transition">
                                    <span class="material-icons text-sm block">download</span>
                                </a>
                            </div>
                        </template>

                        <div class="prose prose-invert prose-sm max-w-none leading-relaxed break-words"
                            x-html="renderMarkdown(msg.content)"></div>

                        <template x-if="msg.role === 'assistant' && msg.isLoading">
                            <div class="flex gap-1 mt-2 h-4 items-center">
                                <div class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce"></div>
                                <div class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce delay-100"></div>
                                <div class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce delay-200"></div>
                            </div>
                        </template>
                    </div>

                    <template x-if="msg.usage">
                        <div class="flex items-center gap-3 px-1 mt-1 text-[10px] text-slate-500 font-mono opacity-80"
                            :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
                            <span title="Prompt + Completion">
                                <span class="material-icons text-[10px] align-middle">generating_tokens</span>
                                <span x-text="msg.usage.total_tokens"></span> Toks
                            </span>
                            <template x-if="msg.cost">
                                <span title="Estimated Cost" class="text-green-500/80">
                                    <span class="material-icons text-[10px] align-middle">attach_money</span>
                                    <span x-text="msg.cost"></span>
                                </span>
                            </template>
                        </div>
                    </template>

                    <template x-if="msg.role === 'assistant' && hasImageInContent(msg.content)">
                        <button @click="extractAndDownload(msg.content)"
                            class="mt-1 text-xs text-green-400 hover:text-green-300 flex items-center gap-1 bg-green-900/20 px-2 py-1 rounded border border-green-900/50 self-start">
                            <span class="material-icons text-sm">image</span> Download AI Image
                        </button>
                    </template>
                </div>
            </template>
            <div id="scrollAnchor" class="h-4"></div>
        </div>

        <div class="p-4 bg-slate-950 border-t border-slate-800">
            <div class="max-w-4xl mx-auto flex flex-col gap-2">

                <div x-show="imageBase64" class="inline-flex relative self-start animate-fade-in-up">
                    <img :src="imageBase64" class="h-14 rounded border border-slate-700 bg-black">
                    <button @click="imageBase64 = null; $refs.fileInput.value = ''"
                        class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full p-0.5 shadow-md transition transform hover:scale-110">
                        <span class="material-icons text-xs block">close</span>
                    </button>
                </div>

                <div class="flex gap-2 items-end">
                    <button @click="$refs.fileInput.click()"
                        class="p-3 text-slate-400 hover:text-blue-400 bg-slate-900 border border-slate-700 rounded-xl transition hover:border-blue-500/50 h-[50px] w-[50px] flex items-center justify-center">
                        <span class="material-icons">add_photo_alternate</span>
                    </button>
                    <input type="file" x-ref="fileInput" class="hidden" accept="image/*"
                        @change="handleFileUpload($event)">

                    <div class="flex-1 relative">
                        <textarea x-model="userInput" @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
                            placeholder="Message..." rows="1"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-4 pr-12 py-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none custom-scrollbar shadow-inner text-sm leading-relaxed"
                            style="min-height: 50px; max-height: 200px;"
                            x-effect="$el.style.height = 'auto'; $el.style.height = Math.max($el.scrollHeight, 50) + 'px'"></textarea>

                        <button @click="sendMessage()" :disabled="isSending || (!userInput && !imageBase64)"
                            class="absolute right-2 bottom-2 p-1.5 bg-blue-600 hover:bg-blue-500 disabled:bg-transparent disabled:text-slate-600 text-white rounded-lg transition shadow-lg flex items-center justify-center">
                            <span class="material-icons text-sm" x-show="!isSending">send</span>
                            <span class="material-icons text-sm animate-spin" x-show="isSending">sync</span>
                        </button>
                    </div>
                </div>
                <div class="text-center text-[10px] text-slate-600">
                    Enter to send, Shift+Enter for new line
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- INDEXEDDB WRAPPER ---
        const DB_NAME = 'OpenRouterDB';
        const DB_VERSION = 1;

        const idb = {
            db: null,

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('settings')) {
                            db.createObjectStore('settings', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('chats')) {
                            db.createObjectStore('chats', { keyPath: 'id' });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };

                    request.onerror = (e) => reject(e);
                });
            },

            async get(storeName, id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            },

            async getAll(storeName) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                });
            },

            async put(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(item);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },

            async delete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            }
        };

        // --- APP LOGIC ---
        function openRouterApp() {
            return {
                // Config
                apiKey: '',
                modelList: [],
                currentModelPricing: { prompt: 0, completion: 0 },
                selectedModel: '',
                systemPrompt: 'You are a helpful assistant.',
                temperature: 0.7,
                enableStream: true,
                showKey: false,

                // State
                dbReady: false,
                showSidebar: window.innerWidth > 768,
                history: [], // List of {id, title, updated_at} - Lightweight for sidebar
                messages: [], // Current chat messages
                currentChatId: null, // Using ID instead of Index

                userInput: '',
                imageBase64: null,
                isSending: false,

                async init() {
                    try {
                        await idb.init();
                        this.dbReady = true;

                        // 1. Migration Check (LocalStorage -> IDB)
                        await this.migrateFromLocalStorage();

                        // 2. Load Settings
                        const settings = await idb.get('settings', 'config');
                        if (settings) {
                            this.apiKey = settings.apiKey || '';
                            this.systemPrompt = settings.systemPrompt || 'You are a helpful assistant.';
                            this.temperature = settings.temperature || 0.7;
                            this.selectedModel = settings.selectedModel || 'openai/gpt-3.5-turbo';
                            this.enableStream = settings.enableStream !== undefined ? settings.enableStream : true;
                        }

                        // 3. Load History
                        await this.refreshHistoryList();

                        // 4. Load Initial Chat
                        if (this.history.length > 0) {
                            // Load most recent
                            this.history.sort((a, b) => b.updated_at - a.updated_at);
                            await this.loadChat(this.history[0].id);
                        } else {
                            await this.startNewChat();
                        }

                        // 5. Fetch Models
                        if (this.apiKey) {
                            this.fetchModels().then(() => this.updateCurrentModelPrice());
                        }

                    } catch (e) {
                        console.error("DB Init Failed", e);
                    }
                },

                // Migration Utility
                async migrateFromLocalStorage() {
                    const oldHistory = localStorage.getItem('or_history');
                    if (oldHistory) {
                        const parsed = JSON.parse(oldHistory);
                        if (parsed.length > 0) {
                            // Check if DB is empty to avoid double migration
                            const existing = await idb.getAll('chats');
                            if (existing.length === 0) {
                                console.log("Migrating LocalStorage to IDB...");
                                for (const chat of parsed) {
                                    // Generate ID if missing (old version didn't have IDs inside object usually)
                                    const chatObj = {
                                        id: chat.id || Date.now() + Math.random().toString(36).substr(2, 5),
                                        title: chat.title || 'Migrated Chat',
                                        messages: chat.messages || [],
                                        updated_at: chat.timestamp || Date.now()
                                    };
                                    await idb.put('chats', chatObj);
                                }
                                localStorage.removeItem('or_history'); // Clean up
                            }
                        }
                    }
                },

                get sessionStats() {
                    let cost = 0;
                    let tokens = 0;
                    this.messages.forEach(m => {
                        if (m.usage) {
                            tokens += (m.usage.total_tokens || 0);
                            if (m.rawCost) cost += m.rawCost;
                        }
                    });
                    return { totalCost: cost, totalTokens: tokens };
                },

                async saveSettings() {
                    await idb.put('settings', {
                        id: 'config',
                        apiKey: this.apiKey,
                        systemPrompt: this.systemPrompt,
                        temperature: this.temperature,
                        selectedModel: this.selectedModel,
                        enableStream: this.enableStream
                    });
                },

                async saveCurrentChat() {
                    if (!this.currentChatId) return;

                    const currentTitle = this.history.find(h => h.id === this.currentChatId)?.title || 'New Chat';

                    // Update Title if it's "New Chat" and we have messages
                    let finalTitle = currentTitle;
                    if (this.messages.length > 0 && currentTitle === 'New Chat') {
                        const firstMsg = this.messages.find(m => m.role === 'user');
                        if (firstMsg) {
                            finalTitle = firstMsg.content.substring(0, 25) + '...';
                        }
                    }

                    const chatObj = {
                        id: this.currentChatId,
                        title: finalTitle,
                        messages: this.messages,
                        updated_at: Date.now()
                    };

                    await idb.put('chats', chatObj);
                    await this.refreshHistoryList(); // Refresh sidebar order
                },

                async refreshHistoryList() {
                    const allChats = await idb.getAll('chats');
                    // Sort desc by updated_at
                    this.history = allChats.sort((a, b) => b.updated_at - a.updated_at).map(c => ({
                        id: c.id,
                        title: c.title,
                        updated_at: c.updated_at
                    }));
                },

                async fetchModels() {
                    if (!this.apiKey) return;
                    try {
                        const res = await fetch('https://openrouter.ai/api/v1/models', {
                            headers: { 'Authorization': `Bearer ${this.apiKey}` }
                        });
                        const data = await res.json();
                        if (data.data) {
                            this.modelList = data.data.sort((a, b) => a.name.localeCompare(b.name));
                            this.updateCurrentModelPrice();
                        }
                    } catch (e) { console.error(e); }
                },

                updateCurrentModelPrice() {
                    const model = this.modelList.find(m => m.id === this.selectedModel);
                    if (model && model.pricing) {
                        this.currentModelPricing = {
                            prompt: parseFloat(model.pricing.prompt) * 1000000,
                            completion: parseFloat(model.pricing.completion) * 1000000,
                            rawPrompt: parseFloat(model.pricing.prompt),
                            rawCompletion: parseFloat(model.pricing.completion)
                        };
                    } else {
                        this.currentModelPricing = { prompt: 0, completion: 0, rawPrompt: 0, rawCompletion: 0 };
                    }
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => this.imageBase64 = evt.target.result;
                    reader.readAsDataURL(file);
                },

                // --- CHAT ACTIONS ---
                async startNewChat() {
                    const newId = Date.now().toString();
                    const newChat = {
                        id: newId,
                        title: 'New Chat',
                        messages: [],
                        updated_at: Date.now()
                    };
                    await idb.put('chats', newChat);
                    this.currentChatId = newId;
                    this.messages = [];
                    await this.refreshHistoryList();
                    if (window.innerWidth <= 768) this.showSidebar = false;
                },

                async loadChat(id) {
                    const chat = await idb.get('chats', id);
                    if (chat) {
                        this.currentChatId = chat.id;
                        this.messages = chat.messages || [];
                        this.scrollToBottom();
                        if (window.innerWidth <= 768) this.showSidebar = false;
                    }
                },

                async deleteChat(id) {
                    if (!confirm('Delete this chat permanently?')) return;
                    await idb.delete('chats', id);
                    await this.refreshHistoryList();

                    if (this.currentChatId === id) {
                        if (this.history.length > 0) {
                            await this.loadChat(this.history[0].id);
                        } else {
                            await this.startNewChat();
                        }
                    }
                },

                deleteMessage(index) {
                    if (!confirm('Remove this message?')) return;
                    this.messages.splice(index, 1);
                    this.saveCurrentChat();
                },

                // --- SEND LOGIC ---
                async sendMessage() {
                    if ((!this.userInput.trim() && !this.imageBase64) || this.isSending) return;

                    const text = this.userInput;
                    const img = this.imageBase64;

                    this.userInput = '';
                    this.imageBase64 = null;
                    this.$refs.fileInput.value = '';
                    this.isSending = true;

                    this.messages.push({ role: 'user', content: text, image: img });
                    this.scrollToBottom();

                    // Update DB immediately for User Message
                    await this.saveCurrentChat();

                    // Prepare Context
                    const apiMessages = [
                        { role: 'system', content: this.systemPrompt },
                        ...this.messages.map(m => {
                            if (m.image) {
                                return {
                                    role: m.role,
                                    content: [
                                        { type: "text", text: m.content },
                                        { type: "image_url", image_url: { url: m.image } }
                                    ]
                                };
                            }
                            return { role: m.role, content: m.content };
                        })
                    ];

                    this.messages.push({ role: 'assistant', content: '', isLoading: true });
                    const assistantIdx = this.messages.length - 1;

                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${this.apiKey}`,
                                "Content-Type": "application/json",
                                "HTTP-Referer": window.location.href,
                                "X-Title": "Mini Alpine IDB"
                            },
                            body: JSON.stringify({
                                model: this.selectedModel,
                                messages: apiMessages,
                                temperature: parseFloat(this.temperature),
                                stream: this.enableStream
                            })
                        });

                        if (!response.ok) {
                            const errData = await response.json();
                            throw new Error(errData.error?.message || 'API Error');
                        }

                        if (this.enableStream) {
                            await this.handleStream(response, assistantIdx);
                        } else {
                            const data = await response.json();
                            this.messages[assistantIdx].content = data.choices[0].message.content;
                            this.messages[assistantIdx].image = data.choices[0].message.images ? data.choices[0].message.images[0].image_url.url : null;
                            this.messages[assistantIdx].isLoading = false;
                            if (data.usage) this.calculateAndSetCost(assistantIdx, data.usage);
                        }

                        // Save Final State
                        await this.saveCurrentChat();

                    } catch (error) {
                        this.messages[assistantIdx].content = "**Error:** " + error.message;
                        this.messages[assistantIdx].isLoading = false;
                        await this.saveCurrentChat();
                    } finally {
                        this.isSending = false;
                        this.scrollToBottom();
                    }
                },

                async handleStream(response, msgIndex) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let buffer = "";
                    this.messages[msgIndex].isLoading = false;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop();

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed === "data: [DONE]") continue;
                            if (trimmed.startsWith("data: ")) {
                                try {
                                    const json = JSON.parse(trimmed.substring(6));
                                    if (json.choices && json.choices[0].delta.content) {
                                        this.messages[msgIndex].content += json.choices[0].delta.content;
                                        this.scrollToBottom();
                                    }
                                    if (json.usage) {
                                        this.calculateAndSetCost(msgIndex, json.usage);
                                    }
                                } catch (e) { console.error("Stream Error", e); }
                            }
                        }
                    }
                },

                calculateAndSetCost(msgIndex, usage) {
                    this.messages[msgIndex].usage = usage;
                    const pPrice = this.currentModelPricing.rawPrompt || 0;
                    const cPrice = this.currentModelPricing.rawCompletion || 0;
                    const cost = (usage.prompt_tokens * pPrice) + (usage.completion_tokens * cPrice);
                    this.messages[msgIndex].rawCost = cost;
                    this.messages[msgIndex].cost = '$' + cost.toFixed(6);
                },

                // UTILS
                renderMarkdown(text) { return marked.parse(text || ''); },
                scrollToBottom() { this.$nextTick(() => { const c = document.getElementById('chatContainer'); if (c) c.scrollTop = c.scrollHeight; }); },
                hasImageInContent(content) { return content && content.includes('!['); },
                extractAndDownload(content) {
                    const match = content.match(/!\[.*?\]\((.*?)\)/);
                    if (match && match[1]) {
                        const a = document.createElement('a');
                        a.href = match[1]; a.download = 'ai-generated.png';
                        document.body.appendChild(a); a.click(); a.remove();
                    }
                },

                // EXPORT IMPORT (Modified for IDB structure)
                async exportChats() {
                    const allChats = await idb.getAll('chats');
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allChats));
                    const a = document.createElement('a');
                    a.href = dataStr; a.download = "or_history_full_" + new Date().toISOString().slice(0, 10) + ".json";
                    document.body.appendChild(a); a.click(); a.remove();
                },

                importChats(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (Array.isArray(imported)) {
                                for (const chat of imported) {
                                    // Ensure ID exists
                                    if (!chat.id) chat.id = Date.now() + Math.random().toString();
                                    await idb.put('chats', chat);
                                }
                                await this.refreshHistoryList();
                                alert('Chats imported to IndexedDB!');
                            }
                        } catch (err) { alert('Invalid JSON'); }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
