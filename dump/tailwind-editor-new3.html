<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Editor v2.6 (Iframe Isolation)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .preview-transition {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200 h-screen overflow-hidden font-sans" x-data="pageEditor()" x-init="initEditor()"
    @keydown.window.prevent.ctrl.z="undo()" @keydown.window.prevent.ctrl.y="redo()">

    <header class="h-14 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center gap-4">
            <button @click="toggleSource()"
                :class="showSource ? 'text-blue-400 bg-gray-900 border-blue-500/30' : 'text-gray-500'"
                class="p-1.5 rounded border border-transparent transition mr-2"><span
                    class="material-icons text-lg">code</span></button>
            <div class="flex items-center gap-2 border-l border-gray-700 pl-4">
                <span class="material-icons text-blue-400">web_asset</span>
                <h1 class="font-bold tracking-wide text-sm">Alpine <span class="text-blue-400">Builder v2.6</span></h1>
            </div>
            <div class="flex items-center bg-gray-900 rounded-lg p-1 border border-gray-700 ml-4">
                <button @click="undo()" :disabled="historyIndex <= 0"
                    class="p-1 rounded hover:bg-gray-700 disabled:opacity-30 text-gray-400"><span
                        class="material-icons text-sm">undo</span></button>
                <button @click="redo()" :disabled="historyIndex >= historyStack.length - 1"
                    class="p-1 rounded hover:bg-gray-700 disabled:opacity-30 text-gray-400"><span
                        class="material-icons text-sm">redo</span></button>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button @click="copyToClipboard()"
                class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold transition">
                <span class="material-icons text-sm">code</span> Export
            </button>
            <button @click="toggleInspector()"
                :class="showInspector ? 'text-blue-400 bg-gray-900 border-blue-500/30' : 'text-gray-500'"
                class="p-1.5 rounded border border-transparent transition ml-2 border-l border-gray-700 pl-2"><span
                    class="material-icons text-lg">tune</span></button>
        </div>
    </header>

    <main class="flex h-[calc(100vh-3.5rem)]">

        <section x-show="showSource"
            class="w-1/4 min-w-[300px] border-r border-gray-700 flex flex-col bg-gray-900 transition-all duration-300">
            <div
                class="bg-gray-800 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-700">
                Source Code</div>
            <textarea x-model="sourceCode" @input.debounce.500ms="syncPreview(true)"
                class="w-full h-full bg-[#0d1117] text-gray-300 font-mono text-xs p-4 outline-none resize-none border-none focus:ring-0"
                spellcheck="false"></textarea>
        </section>

        <section class="flex-1 bg-gray-700/50 relative overflow-hidden flex flex-col transition-all duration-300">
            <div
                class="bg-gray-100 px-3 py-2 border-b border-gray-300 flex justify-between items-center shadow-sm z-10">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Iframe Preview</span>
                <div class="flex bg-gray-200 rounded p-0.5">
                    <button @click="viewport = '100%'"
                        :class="viewport === '100%' ? 'bg-white shadow text-blue-600' : 'text-gray-500'"
                        class="p-1 rounded transition"><span
                            class="material-icons text-sm">desktop_windows</span></button>
                    <button @click="viewport = '768px'"
                        :class="viewport === '768px' ? 'bg-white shadow text-blue-600' : 'text-gray-500'"
                        class="p-1 rounded transition"><span class="material-icons text-sm">tablet_mac</span></button>
                    <button @click="viewport = '375px'"
                        :class="viewport === '375px' ? 'bg-white shadow text-blue-600' : 'text-gray-500'"
                        class="p-1 rounded transition"><span class="material-icons text-sm">smartphone</span></button>
                </div>
            </div>
            <div class="flex-1 overflow-auto flex justify-center bg-gray-300/50" @click="deselect()">
                <div :style="`width: ${viewport}`"
                    class="preview-transition bg-white shadow-2xl min-h-[800px] transition-all duration-300 origin-top h-full">
                    <iframe x-ref="previewFrame" class="w-full h-full border-none bg-white"></iframe>
                </div>
            </div>
        </section>

        <section x-show="showInspector"
            class="w-80 min-w-[320px] border-l border-gray-700 bg-gray-800 flex flex-col overflow-hidden shrink-0 z-10 transition-all duration-300">
            <div
                class="bg-gray-800 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-700">
                Inspector</div>

            <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-6">
                <template x-if="!selectedEl">
                    <div class="text-center text-gray-500 mt-20 flex flex-col items-center">
                        <span class="material-icons text-3xl opacity-50 mb-2">touch_app</span>
                        <p class="text-xs text-gray-400">Select an element to edit</p>
                    </div>
                </template>

                <template x-if="selectedEl">
                    <div class="space-y-6 animate-fade-in">

                        <div class="space-y-4 border-b border-gray-700 pb-4">
                            <div class="flex flex-wrap items-center gap-1 text-[10px] font-mono text-gray-500">
                                <template x-for="(crumb, idx) in breadcrumbs" :key="idx">
                                    <div class="flex items-center">
                                        <span x-show="idx > 0"
                                            class="material-icons text-[10px] mx-0.5 text-gray-600">chevron_right</span>
                                        <button @click="selectElement(crumb.el)"
                                            class="hover:text-blue-400 hover:bg-gray-700 px-1 rounded transition truncate max-w-[80px]"
                                            :class="{'text-blue-400 font-bold bg-gray-700': idx === breadcrumbs.length - 1}"
                                            x-text="crumb.tag"></button>
                                    </div>
                                </template>
                            </div>
                            <div class="grid grid-cols-4 gap-2">
                                <button @click="moveElement('up')"
                                    class="bg-gray-700 hover:bg-gray-600 p-1.5 rounded text-gray-300"><span
                                        class="material-icons text-sm">arrow_upward</span></button>
                                <button @click="moveElement('down')"
                                    class="bg-gray-700 hover:bg-gray-600 p-1.5 rounded text-gray-300"><span
                                        class="material-icons text-sm">arrow_downward</span></button>
                                <button @click="duplicateElement()"
                                    class="bg-gray-700 hover:bg-gray-600 p-1.5 rounded text-gray-300"><span
                                        class="material-icons text-sm">content_copy</span></button>
                                <button @click="deleteElement()"
                                    class="bg-red-900/30 hover:bg-red-900/50 text-red-400 p-1.5 rounded"><span
                                        class="material-icons text-sm">delete</span></button>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Content</p>
                            <template x-for="(node, index) in textNodes" :key="index">
                                <input type="text" x-model="node.text" @input="updateTextNode(index, node.text)"
                                    class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:border-blue-500 outline-none">
                            </template>
                            <template x-if="tagName === 'A'">
                                <div class="bg-blue-900/20 p-2 rounded border border-blue-900/50 space-y-1">
                                    <label
                                        class="text-[10px] text-blue-300 font-bold uppercase flex items-center gap-1"><span
                                            class="material-icons text-[10px]">link</span> Href</label>
                                    <input type="text" x-model="hrefLink" @change="updateAttr('href', hrefLink)"
                                        class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-xs text-blue-300 outline-none">
                                </div>
                            </template>
                            <template x-if="tagName === 'IMG'">
                                <div class="space-y-1">
                                    <label class="text-[10px] text-gray-500">Src</label>
                                    <input type="text" x-model="imgSrc" @change="updateAttr('src', imgSrc)"
                                        class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-blue-300 outline-none">
                                </div>
                            </template>
                        </div>

                        <div class="space-y-4 pt-2 border-t border-gray-700">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Typography</p>
                            <div class="grid grid-cols-2 gap-2">
                                <select @change="updateTextAlign($event.target.value)" x-model="textAlign"
                                    class="bg-gray-900 border border-gray-600 text-xs rounded px-2 py-1 text-white outline-none">
                                    <option value="">Align</option>
                                    <option value="text-left">Left</option>
                                    <option value="text-center">Center</option>
                                    <option value="text-right">Right</option>
                                </select>
                                <select @change="applyClass('font', $event.target.value)"
                                    class="bg-gray-900 border border-gray-600 text-xs rounded px-2 py-1 text-white outline-none">
                                    <option value="">Weight</option>
                                    <option value="font-light">Light</option>
                                    <option value="font-normal">Normal</option>
                                    <option value="font-bold">Bold</option>
                                    <option value="font-extrabold">Heavy</option>
                                </select>
                                <select @change="updateTextSize($event.target.value)" x-model="textSize"
                                    class="col-span-2 bg-gray-900 border border-gray-600 text-xs rounded px-2 py-1 text-white outline-none">
                                    <option value="text-xs">XS</option>
                                    <option value="text-sm">SM</option>
                                    <option value="text-base">Base</option>
                                    <option value="text-lg">LG</option>
                                    <option value="text-xl">XL</option>
                                    <option value="text-2xl">2XL</option>
                                    <option value="text-3xl">3XL</option>
                                    <option value="text-4xl">4XL</option>
                                </select>
                            </div>

                            <div class="space-y-1 bg-gray-900/50 p-2 rounded border border-gray-700">
                                <label class="text-[10px] text-gray-500 uppercase font-semibold">Text Color</label>
                                <div class="flex gap-2 mb-2">
                                    <select x-model="activeTextFamily"
                                        class="flex-1 bg-gray-800 border border-gray-600 text-xs rounded px-2 py-1 text-white outline-none capitalize">
                                        <template x-for="fam in colorFamilies">
                                            <option :value="fam" x-text="fam"></option>
                                        </template>
                                    </select>
                                    <button @click="updateTextColor('text-white')"
                                        class="w-6 h-6 bg-white rounded border border-gray-500"></button>
                                    <button @click="updateTextColor('text-black')"
                                        class="w-6 h-6 bg-black rounded border border-gray-500"></button>
                                </div>
                                <div class="grid grid-cols-6 gap-1">
                                    <template x-for="shade in shades"><button
                                            @click="updateTextColor('text-' + activeTextFamily + '-' + shade)"
                                            :class="`bg-${activeTextFamily}-${shade} h-5 rounded border border-transparent hover:scale-110`"></button></template>
                                </div>
                            </div>

                            <div class="space-y-2 pt-2 border-t border-gray-700">
                                <label class="text-[10px] text-gray-500 uppercase font-semibold">Border</label>
                                <div class="flex gap-1">
                                    <button @click="updateBorderWidth('border-0')"
                                        class="flex-1 bg-gray-700 text-[10px] py-1">0</button>
                                    <button @click="updateBorderWidth('border')"
                                        class="flex-1 bg-gray-700 text-[10px] py-1">1</button>
                                    <button @click="updateBorderWidth('border-2')"
                                        class="flex-1 bg-gray-700 text-[10px] py-1">2</button>
                                    <button @click="updateBorderWidth('border-4')"
                                        class="flex-1 bg-gray-700 text-[10px] py-1">4</button>
                                    <button @click="updateBorderWidth('border-8')"
                                        class="flex-1 bg-gray-700 text-[10px] py-1">8</button>
                                </div>
                                <div class="grid grid-cols-6 gap-1">
                                    <button @click="updateBorderRadius('rounded-none')"
                                        class="bg-gray-700 rounded-none h-4 text-[7px]">0</button>
                                    <button @click="updateBorderRadius('rounded')"
                                        class="bg-gray-700 rounded h-4 text-[7px]">S</button>
                                    <button @click="updateBorderRadius('rounded-md')"
                                        class="bg-gray-700 rounded-md h-4 text-[7px]">M</button>
                                    <button @click="updateBorderRadius('rounded-lg')"
                                        class="bg-gray-700 rounded-lg h-4 text-[7px]">L</button>
                                    <button @click="updateBorderRadius('rounded-full')"
                                        class="bg-gray-700 rounded-full h-4 text-[7px]">O</button>
                                </div>
                                <div class="grid grid-cols-6 gap-1 mt-2">
                                    <template x-for="shade in shades"><button
                                            @click="updateBorderColor('border-' + activeBorderFamily + '-' + shade)"
                                            :class="`bg-${activeBorderFamily}-${shade} h-4 rounded border border-transparent hover:scale-110`"></button></template>
                                </div>
                            </div>

                            <div class="space-y-3 pt-2 border-t border-gray-700">
                                <div class="space-y-1">
                                    <div class="flex justify-between text-[10px] text-gray-500"><span>Padding</span>
                                        <span x-text="currentPadding"></span>
                                    </div>
                                    <input type="range" min="0" max="12" step="1" x-model="currentPadding"
                                        @input="applyClass('p', 'p-' + currentPadding)"
                                        class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                                </div>
                                <div class="space-y-1">
                                    <div class="flex justify-between text-[10px] text-gray-500"><span>Margin</span>
                                        <span x-text="currentMargin"></span>
                                    </div>
                                    <input type="range" min="0" max="12" step="1" x-model="currentMargin"
                                        @input="applyClass('m', 'm-' + currentMargin)"
                                        class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                                </div>

                                <div class="space-y-1 bg-gray-900/50 p-2 rounded border border-gray-700">
                                    <label class="text-[10px] text-gray-500 uppercase font-semibold">Background</label>
                                    <div class="flex gap-2 mb-2">
                                        <select x-model="activeBgFamily"
                                            class="flex-1 bg-gray-800 border border-gray-600 text-xs rounded px-2 py-1 text-white outline-none capitalize">
                                            <template x-for="fam in colorFamilies">
                                                <option :value="fam" x-text="fam"></option>
                                            </template>
                                        </select>
                                        <button @click="applyClass('bg', 'bg-transparent')"
                                            class="w-6 h-6 bg-transparent border border-gray-500 text-[8px]">X</button>
                                        <button @click="applyClass('bg', 'bg-white')"
                                            class="w-6 h-6 bg-white rounded border border-gray-500"></button>
                                    </div>
                                    <div class="grid grid-cols-6 gap-1">
                                        <template x-for="shade in shades"><button
                                                @click="applyClass('bg', 'bg-' + activeBgFamily + '-' + shade)"
                                                :class="`bg-${activeBgFamily}-${shade} h-5 rounded border border-transparent hover:scale-110`"></button></template>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </section>
    </main>

    <script>
        function pageEditor() {
            return {
                showSource: true,
                showInspector: true,
                sourceCode: '',
                selectedEl: null,
                iframeDoc: null, // NEW: Reference to iframe document
                tagName: '',
                textNodes: [],
                imgSrc: '',
                hrefLink: '',
                textSize: '',
                textAlign: '',
                borderWidth: 'border-0',
                borderStyle: 'border-solid',
                borderRadius: 'rounded-none',
                breadcrumbs: [],
                viewport: '100%',
                currentPadding: 0,
                currentMargin: 0,
                historyStack: [],
                historyIndex: -1,

                colorFamilies: ['slate', 'gray', 'zinc', 'neutral', 'stone', 'red', 'orange', 'amber', 'yellow', 'lime', 'green', 'emerald', 'teal', 'cyan', 'sky', 'blue', 'indigo', 'violet', 'purple', 'fuchsia', 'pink', 'rose'],
                shades: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
                activeTextFamily: 'slate',
                activeBgFamily: 'blue',
                activeBorderFamily: 'gray',

                initEditor() {
                    // Initial Content
                    const starter = `
<div class="flex flex-col items-center justify-center min-h-screen p-8 bg-gray-50 text-center font-sans">
    <div class="bg-white p-12 rounded-3xl shadow-xl max-w-lg border border-gray-100">
        <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-icons text-blue-500 text-4xl">iframe</span>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-900 mb-4">Iframe Isolation</h2>
        <p class="text-lg text-gray-500 mb-8">
            This preview is now running inside an <code>&lt;iframe&gt;</code>. 
            Styles are completely isolated from the editor UI.
        </p>
        <button class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 transition">
            Test Button
        </button>
    </div>
</div>`;
                    this.sourceCode = starter.trim();

                    // --- IFRAME SETUP ---
                    const frame = this.$refs.previewFrame;
                    // Wait for frame to handle load
                    frame.onload = () => {
                        this.iframeDoc = frame.contentDocument || frame.contentWindow.document;
                        this.injectResources();
                        this.syncPreview(false);
                    };
                    // Trigger load if already ready (sometimes happens on refresh)
                    if (frame.contentDocument) frame.onload();

                    this.saveHistory();
                },

                injectResources() {
                    if (!this.iframeDoc) return;

                    const head = this.iframeDoc.head;

                    // 1. Inject Tailwind
                    const script = this.iframeDoc.createElement('script');
                    script.src = "https://cdn.tailwindcss.com";
                    head.appendChild(script);

                    // 2. Inject Material Icons
                    const link = this.iframeDoc.createElement('link');
                    link.rel = "stylesheet";
                    link.href = "https://fonts.googleapis.com/icon?family=Material+Icons";
                    head.appendChild(link);

                    // 3. Inject Editor Styles (Selection Outline)
                    const style = this.iframeDoc.createElement('style');
                    style.innerHTML = `
                        .editor-selected {
                            outline: 2px dashed #3b82f6 !important;
                            outline-offset: -2px;
                            cursor: default;
                        }
                        body { margin: 0; } /* Reset default margin */
                    `;
                    head.appendChild(style);

                    // 4. Attach Click Listener to Body
                    this.iframeDoc.body.addEventListener('click', (e) => {
                        this.handleSelection(e);
                    });
                },

                syncPreview(saveToHistory = false) {
                    if (!this.iframeDoc) return;

                    // Only update body content, keep head (scripts/styles) intact
                    if (this.iframeDoc.body.innerHTML !== this.sourceCode) {
                        this.iframeDoc.body.innerHTML = this.sourceCode;
                    }

                    if (saveToHistory) this.saveHistory();
                },

                updateSourceCode(saveToHistory = true) {
                    if (this.selectedEl) this.selectedEl.classList.remove('editor-selected');

                    // Read from Iframe Body
                    const rawHTML = this.iframeDoc.body.innerHTML;
                    const cleanHTML = this.formatHTML(rawHTML);

                    if (cleanHTML !== this.sourceCode) {
                        this.sourceCode = cleanHTML;
                        if (saveToHistory) this.saveHistory();
                    }
                    if (this.selectedEl) this.selectedEl.classList.add('editor-selected');
                },

                handleSelection(e) {
                    e.preventDefault(); // Stop links/forms
                    e.stopPropagation();

                    if (this.selectedEl) this.selectedEl.classList.remove('editor-selected');

                    this.selectedEl = e.target;
                    // Don't select the body/html itself
                    if (this.selectedEl.tagName === 'BODY' || this.selectedEl.tagName === 'HTML') {
                        this.selectedEl = null;
                        return;
                    }

                    this.selectedEl.classList.add('editor-selected');
                    this.tagName = this.selectedEl.tagName;

                    this.generateBreadcrumbs();
                    this.scanTextNodes();
                    this.scanAttributes();
                    this.parseCurrentStyles();

                    if (!this.showInspector) this.showInspector = true;
                },

                // --- UTILS (Same as v2.5 but referencing iframeDoc where needed) ---
                deselect() {
                    if (this.selectedEl) this.selectedEl.classList.remove('editor-selected');
                    this.selectedEl = null;
                },
                selectElement(el) { this.handleSelection({ target: el, preventDefault: () => { }, stopPropagation: () => { } }); },
                toggleSource() { this.showSource = !this.showSource; },
                toggleInspector() { this.showInspector = !this.showInspector; },

                generateBreadcrumbs() {
                    this.breadcrumbs = [];
                    let curr = this.selectedEl;
                    // Stop at Body
                    while (curr && curr.tagName !== 'BODY') {
                        this.breadcrumbs.unshift({ tag: curr.tagName.toLowerCase(), el: curr });
                        curr = curr.parentElement;
                    }
                },

                // History, Move, Duplicate, Delete, Style Logic...
                // (Identical to v2.5, logic operates on selectedEl which works cross-frame)
                saveHistory() {
                    if (this.historyIndex < this.historyStack.length - 1) this.historyStack = this.historyStack.slice(0, this.historyIndex + 1);
                    this.historyStack.push(this.sourceCode);
                    this.historyIndex++;
                    if (this.historyStack.length > 50) { this.historyStack.shift(); this.historyIndex--; }
                },
                undo() { if (this.historyIndex > 0) { this.historyIndex--; this.sourceCode = this.historyStack[this.historyIndex]; this.syncPreview(false); this.selectedEl = null; } },
                redo() { if (this.historyIndex < this.historyStack.length - 1) { this.historyIndex++; this.sourceCode = this.historyStack[this.historyIndex]; this.syncPreview(false); this.selectedEl = null; } },

                moveElement(d) {
                    if (!this.selectedEl) return;
                    const p = this.selectedEl.parentNode;
                    if (d === 'up' && this.selectedEl.previousElementSibling) p.insertBefore(this.selectedEl, this.selectedEl.previousElementSibling);
                    else if (d === 'down' && this.selectedEl.nextElementSibling) p.insertBefore(this.selectedEl.nextElementSibling, this.selectedEl);
                    this.updateSourceCode();
                },
                duplicateElement() {
                    if (!this.selectedEl) return;
                    const c = this.selectedEl.cloneNode(true);
                    c.classList.remove('editor-selected');
                    this.selectedEl.parentNode.insertBefore(c, this.selectedEl.nextSibling);
                    this.updateSourceCode();
                },
                deleteElement() {
                    if (!this.selectedEl) return;
                    this.selectedEl.remove();
                    this.selectedEl = null;
                    this.updateSourceCode();
                },

                // Style Parsers & Appliers (Identical logic)
                updateTextSize(val) { this.applyRegexClass(/text-(xs|sm|base|lg|xl|[2-9]?xl)\b/g, val); this.textSize = val; },
                updateTextColor(val) { this.applyRegexClass(/text-(slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-(50|100|200|300|400|500|600|700|800|900|950)\b|text-(white|black)\b/g, val); },
                updateTextAlign(val) { this.applyRegexClass(/text-(left|center|right|justify)\b/g, val); this.textAlign = val; },
                updateBorderWidth(val) { const regex = /\bborder(-(0|2|4|8))?\b/g; this.applyRegexClass(regex, val); this.borderWidth = val; },
                updateBorderRadius(val) { this.applyRegexClass(/rounded(-(none|sm|md|lg|xl|2xl|3xl|full))?\b/g, val); this.borderRadius = val; },
                updateBorderColor(val) { const regex = new RegExp(`border-(${this.colorFamilies.join('|')})-(50|100|200|300|400|500|600|700|800|900|950)\\b|border-(white|black|transparent)\\b`, 'g'); this.applyRegexClass(regex, val); },

                applyClass(prefix, newClass) {
                    if (prefix === 'bg') {
                        const regex = new RegExp(`bg-(${this.colorFamilies.join('|')})-(50|100|200|300|400|500|600|700|800|900|950)\\b|bg-(white|black|transparent)\\b`, 'g');
                        this.applyRegexClass(regex, newClass); return;
                    }
                    const regex = new RegExp(`\\b${prefix}-[\\w-]+\\b`, 'g');
                    this.applyRegexClass(regex, newClass);
                },
                applyRegexClass(regex, newClass) {
                    if (!this.selectedEl) return;
                    let classes = this.selectedEl.className;
                    if (classes.match(regex)) classes = classes.replace(regex, newClass);
                    else classes += ` ${newClass}`;
                    this.selectedEl.className = classes.replace(/\s+/g, ' ').trim();
                    this.updateSourceCode();
                },
                parseCurrentStyles() {
                    const c = this.selectedEl.className;
                    const p = c.match(/\bp-(\d+)\b/); this.currentPadding = p ? p[1] : 0;
                    const m = c.match(/\bm-(\d+)\b/); this.currentMargin = m ? m[1] : 0;
                    const sz = c.match(/text-(xs|sm|base|lg|xl|[2-9]?xl)\b/); this.textSize = sz ? sz[0] : 'text-base';
                    const al = c.match(/text-(left|center|right)\b/); this.textAlign = al ? al[0] : '';
                    const bw = c.match(/\bborder(-(0|2|4|8))?\b/); this.borderWidth = bw ? bw[0] : 'border-0'; if (this.borderWidth === 'border') this.borderWidth = 'border';
                    const br = c.match(/rounded(-(none|sm|md|lg|xl|2xl|3xl|full))?\b/); this.borderRadius = br ? br[0] : 'rounded-none';
                    const col = c.match(new RegExp(`(${this.colorFamilies.join('|')})-\\d+`));
                    if (col) { this.activeTextFamily = col[1]; this.activeBgFamily = col[1]; this.activeBorderFamily = col[1]; }
                },

                scanAttributes() {
                    if (this.tagName === 'A') this.hrefLink = this.selectedEl.getAttribute('href') || '#';
                    if (this.tagName === 'IMG') this.imgSrc = this.selectedEl.getAttribute('src') || '';
                },
                updateAttr(attr, val) { this.selectedEl.setAttribute(attr, val); this.updateSourceCode(); },
                scanTextNodes() {
                    this.textNodes = [];
                    this.selectedEl.childNodes.forEach((node, index) => {
                        if (node.nodeType === 3 && node.nodeValue.trim().length > 0) this.textNodes.push({ index, text: node.nodeValue.trim(), ref: node });
                    });
                },
                updateTextNode(idx, newVal) { this.textNodes[idx].ref.nodeValue = newVal; this.updateSourceCode(); },
                formatHTML(html) {
                    let formatted = '';
                    let indent = 0;
                    html = html.replace(/>\s+</g, '><').trim();
                    html.split(/>\s*</).forEach(function (element) {
                        if (element.match(/^\/\w/)) indent -= 4;
                        formatted += ' '.repeat(Math.max(0, indent)) + '<' + element + '>\n';
                        if (element.match(/^<?\w[^>]*[^\/]$/) && !element.startsWith("input") && !element.startsWith("img") && !element.startsWith("br")) indent += 4;
                    });
                    return formatted.substring(1, formatted.length - 2);
                },
                copyToClipboard() { navigator.clipboard.writeText(this.sourceCode); alert('HTML copied!'); }
            }
        }
    </script>
