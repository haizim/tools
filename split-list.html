<!DOCTYPE html>
<html lang="id" x-data="listSplitter()" :class="{ 'dark': dark }" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Splitter</title>

    <script defer src="assets/js/alpine.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        mono: ['DM Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />

    <script>
        function listSplitter() {
            return {
                dark: localStorage.getItem('ls-dark') === 'true',
                inputList: '',
                chunkSize: 10,
                chunks: [],
                copied: [],

                toggleDark() {
                    this.dark = !this.dark;
                    localStorage.setItem('ls-dark', this.dark);
                },

                get totalItems() {
                    return this.lines.length;
                },

                get lines() {
                    return this.inputList
                        .split('\n')
                        .map(l => l.trim())
                        .filter(l => l.length > 0);
                },

                get chunkCount() {
                    if (!this.lines.length || !this.chunkSize || this.chunkSize < 1) return 0;
                    return Math.ceil(this.lines.length / this.chunkSize);
                },

                split() {
                    const ls = this.lines;
                    const size = parseInt(this.chunkSize);
                    if (!ls.length || !size || size < 1) {
                        this.chunks = [];
                        return;
                    }
                    const result = [];
                    for (let i = 0; i < ls.length; i += size) {
                        result.push(ls.slice(i, i + size));
                    }
                    this.chunks = result;
                    this.copied = new Array(result.length).fill(false);
                },

                copyChunk(idx) {
                    const text = this.chunks[idx].join('\n');
                    navigator.clipboard.writeText(text).then(() => {
                        this.copied[idx] = true;
                        setTimeout(() => { this.copied[idx] = false; }, 1800);
                    });
                },

                copyAll() {
                    const text = this.chunks.map((c, i) => `--- Bagian ${i + 1} ---\n${c.join('\n')}`).join('\n\n');
                    navigator.clipboard.writeText(text);
                },

                clear() {
                    this.inputList = '';
                    this.chunks = [];
                    this.copied = [];
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        textarea {
            font-family: 'DM Mono', monospace;
            resize: none;
        }

        .chunk-card {
            transition: box-shadow 0.15s ease;
        }

        .chunk-card:hover {
            box-shadow: 0 0 0 2px #6366f1;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 99px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #4338ca;
        }
    </style>
</head>

<body
    class="min-h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- HEADER -->
    <header
        class="sticky top-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span class="material-icons-round text-indigo-500 text-xl">call_split</span>
                <span class="font-semibold text-sm tracking-tight">List Splitter</span>
            </div>
            <button @click="toggleDark()"
                class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span class="material-icons-round text-[18px]" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">

        <!-- INPUT PANEL -->
        <section
            class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 space-y-5">
            <h2 class="text-xs font-semibold uppercase tracking-widest text-indigo-500">Input</h2>

            <div class="grid grid-cols-1 lg:grid-cols-[1fr_220px] gap-5">

                <!-- Textarea -->
                <div class="space-y-1.5">
                    <label
                        class="text-xs font-medium text-slate-500 dark:text-slate-400 flex items-center justify-between">
                        <span>Daftar item <span class="text-slate-400 dark:text-slate-600 font-normal">(satu per
                                baris)</span></span>
                        <span x-show="totalItems > 0" class="text-indigo-400 font-mono"
                            x-text="totalItems + ' item'"></span>
                    </label>
                    <textarea x-model="inputList" rows="12"
                        placeholder="Masukkan list di sini&#10;satu item&#10;per baris..." class="w-full rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700
                   text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-600
                   px-3.5 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500
                   transition-colors scrollbar-thin">
          </textarea>
                </div>

                <!-- Config -->
                <div class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-medium text-slate-500 dark:text-slate-400 block">
                            Item per bagian
                        </label>
                        <div class="flex items-center gap-2">
                            <button @click="chunkSize = Math.max(1, chunkSize - 1)" class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700
                       bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700
                       text-slate-600 dark:text-slate-300 transition-colors shrink-0">
                                <span class="material-icons-round text-[16px]">remove</span>
                            </button>
                            <input type="number" x-model.number="chunkSize" min="1" class="flex-1 text-center rounded-lg border border-slate-200 dark:border-slate-700
                       bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200
                       text-sm font-mono h-9 px-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/50
                       transition-colors" />
                            <button @click="chunkSize++" class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700
                       bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700
                       text-slate-600 dark:text-slate-300 transition-colors shrink-0">
                                <span class="material-icons-round text-[16px]">add</span>
                            </button>
                        </div>
                    </div>

                    <!-- Stats preview -->
                    <div x-show="totalItems > 0 && chunkSize >= 1"
                        class="rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/60 p-3.5 space-y-2">
                        <p class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">Estimasi</p>
                        <div class="grid grid-cols-2 gap-2 text-center">
                            <div class="bg-white dark:bg-indigo-900/30 rounded-lg py-2 px-1">
                                <p class="font-mono text-lg font-semibold text-indigo-600 dark:text-indigo-300"
                                    x-text="chunkCount"></p>
                                <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                    Bagian</p>
                            </div>
                            <div class="bg-white dark:bg-indigo-900/30 rounded-lg py-2 px-1">
                                <p class="font-mono text-lg font-semibold text-indigo-600 dark:text-indigo-300"
                                    x-text="totalItems"></p>
                                <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total
                                </p>
                            </div>
                        </div>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400 text-center">
                            Sisa: <span class="font-mono text-indigo-500"
                                x-text="totalItems % chunkSize === 0 ? '0' : (totalItems % chunkSize) + ' item di bagian terakhir'"></span>
                        </p>
                    </div>

                    <!-- Actions -->
                    <div class="space-y-2 pt-1">
                        <button @click="split()" :disabled="!inputList.trim() || chunkSize < 1"
                            class="w-full flex items-center justify-center gap-2 px-4 h-10 rounded-xl text-sm font-semibold
                     bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white
                     disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow-sm shadow-indigo-200 dark:shadow-none">
                            <span class="material-icons-round text-[18px]">call_split</span>
                            Split
                        </button>
                        <button @click="clear()" x-show="inputList.trim()" class="w-full flex items-center justify-center gap-2 px-4 h-9 rounded-xl text-sm font-medium
                     border border-slate-200 dark:border-slate-700
                     text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            <span class="material-icons-round text-[16px]">clear</span>
                            Bersihkan
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- OUTPUT PANEL -->
        <section x-show="chunks.length > 0" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
            class="space-y-4">

            <!-- Output header -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold uppercase tracking-widest text-indigo-500">Hasil</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/50
                       text-indigo-600 dark:text-indigo-300 text-xs font-mono font-medium"
                        x-text="chunks.length + ' bagian'">
                    </span>
                </div>
                <button @click="copyAll()" class="flex items-center gap-1.5 text-xs font-medium px-3 h-8 rounded-lg
                 border border-slate-200 dark:border-slate-700
                 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <span class="material-icons-round text-[14px]">content_copy</span>
                    Salin Semua
                </button>
            </div>

            <!-- 4-column grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                <template x-for="(chunk, idx) in chunks" :key="idx">
                    <div
                        class="chunk-card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col">

                        <!-- Card header -->
                        <div
                            class="flex items-center justify-between px-4 py-2.5 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                            <div class="flex items-center gap-2">
                                <span class="w-5 h-5 rounded-md bg-indigo-100 dark:bg-indigo-900/60
                             text-indigo-600 dark:text-indigo-300 text-[10px] font-mono font-bold
                             flex items-center justify-center" x-text="idx + 1"></span>
                                <span class="text-xs text-slate-500 dark:text-slate-400 font-medium"
                                    x-text="chunk.length + ' item'"></span>
                            </div>
                            <button @click="copyChunk(idx)"
                                class="flex items-center gap-1 text-[11px] font-medium px-2 h-6 rounded-lg transition-colors"
                                :class="copied[idx]
                  ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400'
                  : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'">
                                <span class="material-icons-round text-[12px]"
                                    x-text="copied[idx] ? 'check' : 'content_copy'"></span>
                                <span x-text="copied[idx] ? 'Tersalin' : 'Salin'"></span>
                            </button>
                        </div>

                        <!-- Textarea -->
                        <textarea :value="chunk.join('\n')" readonly rows="8" class="flex-1 w-full bg-transparent text-xs text-slate-700 dark:text-slate-300
                     px-4 py-3 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-400/40
                     placeholder-slate-400 scrollbar-thin transition-colors">
            </textarea>

                    </div>
                </template>
            </div>

        </section>

        <!-- Empty state -->
        <div x-show="chunks.length === 0" class="flex flex-col items-center justify-center py-20 text-center space-y-3">
            <div class="w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 flex items-center justify-center">
                <span class="material-icons-round text-3xl text-indigo-300 dark:text-indigo-700">call_split</span>
            </div>
            <p class="text-sm text-slate-500 dark:text-slate-500">Masukkan list dan tekan <strong
                    class="text-slate-700 dark:text-slate-300">Split</strong> untuk membagi</p>
        </div>

    </main>

</body>

</html>
