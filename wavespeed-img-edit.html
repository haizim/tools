<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavespeed Image Editor (IDB)</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3342',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        [x-cloak] {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a202c;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
    </style>
</head>

<body
    class="bg-gray-950 text-gray-200 font-sans antialiased h-screen overflow-hidden selection:bg-indigo-500 selection:text-white"
    x-data="app()" x-init="initApp()">

    <nav class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-6 z-20 relative">
        <div class="flex items-center space-x-2">
            <span class="material-icons text-indigo-500">waves</span>
            <h1 class="text-xl font-bold tracking-tight">Wavespeed <span class="text-indigo-400">Gen</span> <span
                    class="text-xs text-gray-500 font-normal ml-2 border border-gray-700 rounded px-2 py-0.5">IndexedDB</span>
            </h1>
        </div>

        <div class="flex items-center space-x-4">
            <button @click="showHistory = !showHistory"
                class="md:hidden p-2 hover:bg-gray-800 rounded-lg transition-colors text-gray-400">
                <span class="material-icons" x-text="showHistory ? 'close' : 'history'"></span>
            </button>
            <button @click="showSettings = !showSettings"
                class="p-2 hover:bg-gray-800 rounded-lg transition-colors relative">
                <span class="material-icons text-gray-400">settings</span>
                <span x-show="!apiKey"
                    class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            </button>
        </div>
    </nav>

    <div class="flex h-[calc(100vh-64px)] relative">

        <!-- Mobile Backdrop -->
        <div x-show="showHistory" x-transition.opacity class="absolute inset-0 bg-black/50 z-20 md:hidden"
            @click="showHistory = false"></div>

        <aside
            class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col z-30 absolute h-full md:static transition-transform duration-300 transform"
            :class="showHistory ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                    History
                    <span class="bg-gray-800 text-gray-500 text-[10px] px-2 py-0.5 rounded-full"
                        x-text="history.length"></span>
                </h2>
                <button @click="clearHistoryDB()" class="text-xs text-red-400 hover:text-red-300 hover:underline">Clear
                    All</button>
            </div>

            <div class="flex-1 overflow-y-auto p-2 space-y-2">
                <div x-show="isLoadingHistory" class="p-4 text-center text-gray-500 text-xs">
                    <span class="material-icons animate-spin text-sm mb-2">sync</span>
                    <p>Loading DB...</p>
                </div>

                <template x-for="item in history" :key="item.id">
                    <div
                        class="p-3 bg-gray-800 rounded-lg cursor-pointer hover:bg-gray-750 transition-colors group border border-transparent hover:border-gray-600 relative">
                        <button @click.stop="deleteHistoryItem(item.id)"
                            class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 transition-opacity">
                            <span class="material-icons text-sm">close</span>
                        </button>

                        <div @click="loadFromHistory(item)">
                            <div class="flex items-center space-x-3 mb-2">
                                <div class="relative">
                                    <template x-if="item.inputThumbnail">
                                        <img :src="item.inputThumbnail"
                                            class="w-10 h-10 rounded object-cover border border-gray-600 bg-gray-900">
                                    </template>
                                    <template x-if="!item.inputThumbnail">
                                        <div
                                            class="w-10 h-10 rounded bg-gray-900 border border-gray-700 flex items-center justify-center">
                                            <span class="material-icons text-xs text-gray-600">text_fields</span>
                                        </div>
                                    </template>
                                    <div
                                        class="absolute -bottom-1 -right-1 bg-gray-700 text-[8px] px-1 rounded text-gray-300">
                                        IN</div>
                                </div>
                                <span class="material-icons text-gray-600 text-sm">arrow_right_alt</span>
                                <div class="relative">
                                    <template x-if="item.outputUrl">
                                        <img :src="item.outputUrl"
                                            class="w-10 h-10 rounded object-cover border border-indigo-500/50 bg-gray-900">
                                    </template>
                                    <template x-if="!item.outputUrl">
                                        <div class="w-10 h-10 rounded bg-gray-700 flex items-center justify-center">
                                            <span class="material-icons text-xs text-gray-500">block</span>
                                        </div>
                                    </template>
                                    <div
                                        class="absolute -bottom-1 -right-1 bg-indigo-900 text-[8px] px-1 rounded text-indigo-200">
                                        OUT</div>
                                </div>
                            </div>
                            <p class="text-xs text-gray-300 line-clamp-2" x-text="item.prompt"></p>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-[10px] text-gray-500"
                                    x-text="new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></span>
                                <span class="text-[10px] text-gray-600 truncate max-w-[80px]"
                                    x-text="item.model"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <div x-show="!isLoadingHistory && history.length === 0" class="text-center py-10 opacity-50">
                    <span class="material-icons text-4xl text-gray-700 mb-2">history</span>
                    <p class="text-xs text-gray-500">No edits saved yet.</p>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative bg-gray-950">

            <div x-show="showSettings" x-transition.opacity
                class="absolute inset-0 bg-gray-950/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div @click.away="showSettings = false"
                    class="bg-gray-900 border border-gray-700 w-full max-w-lg rounded-xl shadow-2xl p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold">Client Settings</h3>
                        <button @click="showSettings = false" class="text-gray-400 hover:text-white"><span
                                class="material-icons">close</span></button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Wavespeed API Key (Saved in
                                LocalStorage)</label>
                            <input type="password" x-model="apiKey" @change="saveSettings()"
                                class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm focus:border-indigo-500 focus:outline-none placeholder-gray-600"
                                placeholder="ws-...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Model ID</label>
                            <div class="flex space-x-2">
                                <select x-model="selectedModel" @change="saveSettings()"
                                    class="flex-1 bg-gray-800 border border-gray-700 rounded p-2 text-sm focus:border-indigo-500 focus:outline-none">
                                    <template x-for="model in models" :key="model.id">
                                        <option :value="model.id" x-text="model.name || model.id"></option>
                                    </template>
                                </select>
                            </div>
                            <input type="text" x-model="selectedModel" @change="saveSettings()"
                                class="w-full mt-2 bg-gray-800 border border-gray-700 rounded p-2 text-sm focus:border-indigo-500 focus:outline-none"
                                placeholder="Custom Model ID...">
                            <p class="text-xs text-gray-500 mt-1">
                                Selected: <b x-text="selectedModel"></b>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col lg:flex-row p-6 gap-6 overflow-y-auto">

                <div class="flex-1 flex flex-col space-y-4 min-w-0">
                    <div class="flex items-center space-x-2">
                        <span
                            class="w-6 h-6 rounded-full bg-gray-800 flex items-center justify-center text-xs font-bold text-indigo-400">1</span>
                        <h3 class="font-medium text-gray-300">Input</h3>
                    </div>

                    <div class="relative group flex-shrink-0">
                        <div class="border-2 border-dashed border-gray-700 rounded-xl bg-gray-900 h-72 flex flex-col items-center justify-center transition-all duration-200"
                            :class="{'border-indigo-500 bg-gray-800/50 ring-4 ring-indigo-500/10': isDragging}"
                            @dragover.prevent="isDragging = true" @dragleave.prevent="isDragging = false"
                            @drop.prevent="handleDrop($event)">

                            <template x-if="!inputImage">
                                <div class="text-center p-4 pointer-events-none">
                                    <span
                                        class="material-icons text-5xl text-gray-700 mb-3 group-hover:text-indigo-500 transition-colors">cloud_upload</span>
                                    <p class="text-sm text-gray-400 font-medium">Drop image here (Optional)</p>
                                    <p class="text-xs text-gray-600 mt-1">Supports JPG, PNG</p>
                                </div>
                            </template>

                            <template x-if="inputImage">
                                <div class="relative w-full h-full p-2 group-image">
                                    <img :src="inputImage" class="w-full h-full object-contain rounded-lg">
                                    <button @click="inputImage = null; inputParams.file = null"
                                        class="absolute top-4 right-4 bg-gray-900/80 text-white rounded-lg p-2 hover:bg-red-500 transition-colors shadow-lg backdrop-blur-sm">
                                        <span class="material-icons text-sm">delete</span>
                                    </button>
                                </div>
                            </template>

                            <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer"
                                @change="handleFileSelect($event)">
                        </div>
                    </div>

                    <select x-model="aspectRatio"
                        class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm focus:border-indigo-500 focus:outline-none">
                        <template x-for="ar in aspectRatioOptions">
                            <option :value="ar.value" x-text="ar.label"></option>
                        </template>
                    </select>

                    <div class="flex-1 flex flex-col min-h-0">
                        <textarea x-model="prompt"
                            class="w-full h-32 bg-gray-900 border border-gray-700 rounded-xl p-4 focus:border-indigo-500 focus:outline-none resize-none text-sm leading-relaxed"
                            placeholder="Describe your image..."></textarea>

                        <div class="mt-4 flex items-center justify-between">
                            <div class="text-xs text-gray-500 flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full" :class="db ? 'bg-green-500' : 'bg-red-500'"></span>
                                <span x-text="db ? 'DB Ready' : 'DB Offline'"></span>
                            </div>
                            <button @click="generateByTask()"
                                :disabled="isGenerating || isUploading || !prompt || !apiKey"
                                class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-8 py-2.5 rounded-lg font-medium shadow-lg shadow-indigo-500/20 flex items-center space-x-2 transition-all">
                                <span x-show="isGenerating || isUploading"
                                    class="material-icons animate-spin text-sm">refresh</span>
                                <span x-text="buttonText"></span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col space-y-4 min-w-0">
                    <div class="flex items-center space-x-2">
                        <span
                            class="w-6 h-6 rounded-full bg-gray-800 flex items-center justify-center text-xs font-bold text-green-400">2</span>
                        <h3 class="font-medium text-gray-300">Result</h3>
                    </div>

                    <div
                        class="flex-1 bg-gray-900 border border-gray-800 rounded-xl flex items-center justify-center relative overflow-hidden min-h-[400px]">
                        <div x-show="!outputImage && !isGenerating && !isUploading" class="text-center text-gray-600">
                            <span class="material-icons text-4xl mb-2 opacity-30">auto_awesome</span>
                            <p class="text-sm">AI Output Area</p>
                        </div>

                        <div x-show="isGenerating || isUploading" class="text-center">
                            <div
                                class="w-16 h-16 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mx-auto mb-4">
                            </div>
                            <p class="text-sm text-indigo-400 font-medium animate-pulse" x-text="statusText"></p>
                        </div>

                        <template x-if="outputImage">
                            <div class="w-full h-full flex flex-col">
                                <div class="flex-1 p-2 flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]"
                                    style="overflow: scroll;">
                                    <img :src="outputImage" class="max-w-full max-h-full rounded-lg shadow-2xl">
                                </div>
                                <div
                                    class="p-4 bg-gray-850 border-t border-gray-800 flex justify-end items-center gap-3">
                                    <a :href="outputImage" :download="'img-' + imgName + '.png'" target="_blank"
                                        class="flex items-center space-x-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg transition-colors shadow-lg">
                                        <span class="material-icons text-sm">download</span>
                                        <span>Download</span>
                                    </a>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const DB_NAME = 'Wavespeed_ImageEditor_DB';
        const DB_VERSION = 1;
        const STORE_NAME = 'history';

        function app() {
            return {
                // Config
                apiKey: '',
                models: [
                    { "id": "flux-dev", "name": "Flux Dev" },
                    { "id": "flux-schnell", "name": "Flux Schnell" }, // Based on common Wavespeed models
                    { "id": "bytedance-seed/seedream-4.5", "name": "Seedream 4.5" }
                    // Add more if known
                ],
                selectedModel: 'flux-dev',

                // State
                db: null, // IndexedDB Instance
                isLoadingHistory: true,
                showHistory: false,
                showSettings: false,
                isGenerating: false,
                isUploading: false,
                isDragging: false,
                statusText: 'Processing...',

                // Data
                inputImage: null, // Data URL for display
                inputParams: {
                    file: null // Actual File object for upload
                },
                prompt: '',
                outputImage: null,
                history: [],
                aspectRatio: '9:16',
                aspectRatioOptions: [
                    { value: '1*1', label: '1:1' },
                    { value: '2*3', label: '2:3' },
                    { value: '3*2', label: '3:2' },
                    { value: '3*4', label: '3:4' },
                    { value: '4*3', label: '4:3' },
                    { value: '4*5', label: '4:5' },
                    { value: '5*4', label: '5:4' },
                    { value: '9*16', label: '9:16' },
                    { value: '16*9', label: '16:9' },
                    { value: '21*9', label: '21:9' },
                ],
                // Note: Wavespeed uses "W*H" string format for size in some examples, assume mapping here.
                // Wait, the new example showed "1024*1024". I'll use that format.

                imgName: '',

                get buttonText() {
                    if (this.isUploading) return 'Uploading...';
                    if (this.isGenerating) return 'Generating...';
                    return 'Generate Image';
                },

                initApp() {
                    // 1. Load Settings from LocalStorage
                    this.apiKey = localStorage.getItem('ws_api_key') || '';
                    this.selectedModel = localStorage.getItem('ws_selected_model') || this.selectedModel;

                    // 2. Initialize IndexedDB
                    this.initDB();

                    if (!this.apiKey) {
                        this.showSettings = true;
                    }
                },

                // --- IndexedDB Logic (Identical to OpenRouter version, just different DB Name) ---
                initDB() {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        }
                    };

                    request.onsuccess = (event) => {
                        this.db = event.target.result;
                        this.loadHistoryFromDB();
                    };

                    request.onerror = (event) => {
                        console.error("IndexedDB Error:", event.target.error);
                        this.isLoadingHistory = false;
                    };
                },

                loadHistoryFromDB() {
                    if (!this.db) return;
                    this.isLoadingHistory = true;
                    const transaction = this.db.transaction([STORE_NAME], 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.getAll();

                    request.onsuccess = () => {
                        this.history = request.result.sort((a, b) => b.id - a.id);
                        this.isLoadingHistory = false;
                    };

                    request.onerror = () => this.isLoadingHistory = false;
                },

                addHistoryToDB(item) {
                    if (!this.db) return;
                    const transaction = this.db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.add(item);

                    request.onsuccess = (event) => {
                        item.id = event.target.result;
                        this.history.unshift(item);
                    };
                },

                deleteHistoryItem(id) {
                    if (!this.db || !confirm('Delete this item?')) return;
                    const transaction = this.db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    store.delete(id);
                    transaction.oncomplete = () => {
                        this.history = this.history.filter(h => h.id !== id);
                    };
                },

                clearHistoryDB() {
                    if (!this.db || !confirm('Permanently clear all history?')) return;
                    const transaction = this.db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    store.clear();
                    transaction.oncomplete = () => {
                        this.history = [];
                    };
                },
                // --- End IndexedDB Logic ---

                saveSettings() {
                    localStorage.setItem('ws_api_key', this.apiKey);
                    localStorage.setItem('ws_selected_model', this.selectedModel);
                },

                // Drag & Drop
                handleFileSelect(e) {
                    const file = e.target.files[0];
                    if (file) this.processFile(file);
                },
                handleDrop(e) {
                    this.isDragging = false;
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.processFile(file);
                    }
                },
                processFile(file) {
                    this.inputParams.file = file; // Store actual file for upload
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.inputImage = e.target.result; // Store Data URL for preview
                        this.outputImage = null;
                    };
                    reader.readAsDataURL(file);
                },

                // --- Wavespeed API Logic ---

                async uploadImage(file) {
                    this.isUploading = true;
                    this.statusText = 'Uploading image...';
                    const formData = new FormData();
                    formData.append('file', file);

                    try {
                        const response = await fetch('https://api.wavespeed.ai/api/v3/media/upload/binary', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${this.apiKey}`
                            },
                            body: formData
                        });

                        const data = await response.json();
                        if (!response.ok) throw new Error(data.message || 'Upload failed');
                        return data.data.download_url;
                    } finally {
                        this.isUploading = false;
                    }
                },

                async generateByTask() {
                    this.isGenerating = true;
                    this.outputImage = null;
                    this.statusText = 'Initializing task...';

                    try {
                        let uploadedImageUrl = null;
                        if (this.inputParams.file) {
                            uploadedImageUrl = await this.uploadImage(this.inputParams.file);
                        }

                        // Prepare Payload
                        const payload = {
                            prompt: this.prompt,
                            size: this.aspectRatio, // Assuming example 1024*1024 maps to our values
                            num_inference_steps: 28,
                            guidance_scale: 3.5
                        };

                        if (uploadedImageUrl) {
                            payload.image_url = uploadedImageUrl;
                            // Check if model supports img2img, some like flux-dev might, others need different endpoint?
                            // Docs for generate-image showed image_url in 'user' content for chat, but here we use /wavespeed-ai/{model}
                            // We will try adding image_url to root payload as per plan.
                        }

                        // Submit Task
                        this.statusText = 'Submitting task...';
                        const endpoint = `https://api.wavespeed.ai/api/v3/${this.selectedModel}/edit`;

                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.apiKey}`
                            },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();
                        if (!response.ok) throw new Error(data.message || JSON.stringify(data));

                        const taskId = data.data.id;
                        if (!taskId) throw new Error("No Task ID returned");

                        // Poll
                        await this.pollTask(taskId);

                    } catch (error) {
                        alert("Error: " + error.message);
                        this.isGenerating = false;
                    }
                },

                async pollTask(taskId) {
                    this.statusText = 'Processing...';
                    const pollEndpoint = `https://api.wavespeed.ai/api/v3/predictions/${taskId}`;

                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(pollEndpoint, {
                                headers: { 'Authorization': `Bearer ${this.apiKey}` }
                            });
                            const data = await res.json();

                            if (data.data.status === 'succeeded') {
                                clearInterval(interval);
                                this.handleSuccess(data.data);
                            } else if (data.data.status === 'failed') {
                                clearInterval(interval);
                                throw new Error(data.data.error || 'Generation failed');
                            }
                            // else: starting, processing -> continue polling
                        } catch (e) {
                            clearInterval(interval);
                            alert("Polling Error: " + e.message);
                            this.isGenerating = false;
                        }
                    }, 2000); // Poll server every 2 seconds
                },

                handleSuccess(data) {
                    // Extract Output URL
                    // Structure might be data.output[0] or data.output.url
                    // Based on common patterns for async APIs
                    let url = null;
                    if (Array.isArray(data.output) && data.output.length > 0) {
                        url = data.output[0];
                    } else if (typeof data.output === 'string') {
                        url = data.output;
                    }

                    if (!url) {
                        alert("Success but no output URL found");
                        this.isGenerating = false;
                        return;
                    }

                    this.outputImage = url;
                    this.isGenerating = false;

                    // Save to DB
                    const timestamp = Date.now();
                    this.imgName = `${timestamp}`;

                    const historyItem = {
                        timestamp: timestamp,
                        prompt: this.prompt,
                        inputThumbnail: this.inputImage,
                        outputUrl: this.outputImage,
                        model: this.selectedModel
                    };
                    this.addHistoryToDB(historyItem);
                },

                loadFromHistory(item) {
                    this.prompt = item.prompt;
                    this.inputImage = item.inputThumbnail;
                    this.inputParams.file = null; // Cannot re-upload from history easily unless we fetch blob
                    this.outputImage = item.outputUrl;
                    this.selectedModel = item.model;
                    this.imgName = item.timestamp;
                }
            }
        }
    </script>
</body>

</html>
