<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live HTML Viewer</title>
    <script src="assets/js/tailwindcss.js"></script>
    <script src="assets/js/theme-config.js"></script>
    <script defer src="assets/js/alpine.min.js"></script>

    <style>
        textarea::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track {
            background: #111827;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
    </style>
</head>

<body
    class="bg-gray-100 dark:bg-gemini-gray-darker text-gray-800 dark:text-gemini-gray-light h-screen flex flex-col overflow-hidden transition-colors duration-300"
    x-data="htmlViewer()">

    <main class="flex-1 flex overflow-hidden">

        <section
            class="flex flex-col border-r border-gray-300 dark:border-gemini-gray-dark transition-all duration-300 ease-in-out"
            :class="mode === 'full' ? 'w-0 overflow-hidden' : (mode === 'mobile' ? 'w-1/2' : 'w-1/2')"
            x-show="mode !== 'full'">
            <div
                class="bg-gray-200 dark:bg-gemini-gray-dark px-4 py-3 text-xs font-bold text-gray-600 dark:text-gray-400 uppercase flex justify-between border-b border-gray-300 dark:border-gemini-gray-dark">
                <span>Source Code</span>
                <button @click="sourceCode=''" class="hover:text-red-500 dark:hover:text-red-400">Clear</button>
            </div>
            <textarea x-model="sourceCode"
                class="flex-1 bg-white dark:bg-gemini-gray-darker text-gray-800 dark:text-green-400 font-mono text-sm p-4 focus:outline-none resize-none"
                spellcheck="false" placeholder="Tulis HTML..."></textarea>
        </section>

        <section class="flex flex-col bg-gray-100 dark:bg-gray-900 transition-all duration-300"
            :class="mode === 'full' ? 'w-full' : 'w-1/2'">
            <div
                class="bg-white dark:bg-gemini-gray-dark border-b border-gray-200 dark:border-gemini-gray-dark px-4 py-2 flex justify-between items-center gap-2 shadow-sm z-10">

                <div class="flex items-center gap-2">
                    <button @click="mode = 'split'"
                        class="flex items-center gap-2 px-3 py-1.5 rounded text-xs font-semibold transition-colors border"
                        :class="mode === 'split' ? 'bg-primary-50 dark:bg-primary-900/30 border-primary-200 dark:border-primary-700 text-primary-600 dark:text-primary-400' : 'text-gray-500 dark:text-gray-400 border-transparent hover:bg-gray-100 dark:hover:bg-gemini-gray-darker'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        Split
                    </button>

                    <button @click="mode = 'mobile'"
                        class="flex items-center gap-2 px-3 py-1.5 rounded text-xs font-semibold transition-colors border"
                        :class="mode === 'mobile' ? 'bg-primary-50 dark:bg-primary-900/30 border-primary-200 dark:border-primary-700 text-primary-600 dark:text-primary-400' : 'text-gray-500 dark:text-gray-400 border-transparent hover:bg-gray-100 dark:hover:bg-gemini-gray-darker'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                        Mobile
                    </button>

                    <button @click="mode = 'full'"
                        class="flex items-center gap-2 px-3 py-1.5 rounded text-xs font-semibold transition-colors border"
                        :class="mode === 'full' ? 'bg-primary-50 dark:bg-primary-900/30 border-primary-200 dark:border-primary-700 text-primary-600 dark:text-primary-400' : 'text-gray-500 dark:text-gray-400 border-transparent hover:bg-gray-100 dark:hover:bg-gemini-gray-darker'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                            </path>
                        </svg>
                        Full
                    </button>
                </div>


            </div>

            <div class="flex-1 bg-gray-200 overflow-auto flex items-center justify-center p-4 relative">

                <div class="bg-white transition-all duration-500 ease-in-out relative shadow-2xl overflow-hidden"
                    :class="{
                        'w-full h-full': mode === 'split' || mode === 'full',
                        'w-[375px] h-[667px] rounded-3xl border-8 border-gray-800': mode === 'mobile'
                    }">
                    <div x-show="mode === 'mobile'"
                        class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-800 rounded-b-xl z-20">
                    </div>

                    <iframe class="w-full h-full border-none"
                        :srcdoc="sourceCode + '<script src=\'https://cdn.tailwindcss.com\'></script>'"
                        sandbox="allow-scripts"></iframe>
                </div>

            </div>
        </section>
    </main>
    <script>
        function htmlViewer() {
            return {
                mode: 'split',
                sourceCode: '<div class=\'grid place-items-center h-full text-center bg-primary-50 p-6\'>\n  <div>\n    <div class=\'w-16 h-16 bg-primary-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl shadow-lg\'>🚀</div>\n    <h2 class=\'text-3xl font-bold text-gray-800 mb-2\'>Siap Meluncur!</h2>\n    <p class=\'text-gray-600 mb-6\'>Cobalah ubah mode tampilan di atas.</p>\n    <button class=\'bg-primary-600 hover:bg-primary-700 text-white px-6 py-2 rounded-full transition shadow\'>Aksi Utama</button>\n  </div>\n</div>',

            }
        }
    </script>
</body>

</html>
