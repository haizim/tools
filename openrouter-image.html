<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini OpenRouter Client</title>

    <script src="assets/js/tailwindcss.js"></script>

    <script defer src="assets/js/alpine.min.js"></script>

    <script src="assets/js/marked.min.js"></script>

    <script src="assets/js/dexie.js"></script>

    <link href="assets/css/material-icons.css" rel="stylesheet">

    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Markdown Styles */
        .prose img {
            border-radius: 0.5rem;
            max-width: 100%;
            margin-top: 0.5rem;
        }

        .prose pre {
            background: #111827;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        .prose code {
            color: #e5e7eb;
            font-family: monospace;
        }

        .prose p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 font-sans h-screen overflow-hidden" x-data="app()" x-init="initApp()">

    <div class="flex h-full">

        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col transition-all duration-300"
            :class="showSidebar ? 'translate-x-0' : '-translate-x-full absolute z-20 h-full md:static md:translate-x-0'">

            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <span class="font-bold text-lg tracking-wide">OpenRouter Client</span>
                <button @click="startNewChat()"
                    class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded shadow transition">
                    <span class="material-icons text-sm">add</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-2 space-y-2">
                <template x-for="chat in chatHistory" :key="chat.id">
                    <div class="group flex items-center justify-between p-3 rounded cursor-pointer hover:bg-gray-700 transition"
                        :class="currentChatId === chat.id ? 'bg-gray-700 border-l-4 border-blue-500' : ''"
                        @click="loadChat(chat.id)">
                        <div class="truncate text-sm w-40" x-text="chat.title || 'Untitled Chat'"></div>
                        <button @click.stop="deleteChat(chat.id)"
                            class="text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition">
                            <span class="material-icons text-xs">delete</span>
                        </button>
                    </div>
                </template>
                <div x-show="chatHistory.length === 0" class="text-gray-500 text-center text-sm mt-10">
                    No history found.
                </div>
            </div>

            <div class="p-4 border-t border-gray-700 space-y-2">
                <div class="flex gap-2">
                    <button @click="exportChats()"
                        class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded flex justify-center items-center gap-1 transition">
                        <span class="material-icons text-xs">download</span> Export
                    </button>
                    <label
                        class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded flex justify-center items-center gap-1 cursor-pointer transition">
                        <span class="material-icons text-xs">upload</span> Import
                        <input type="file" accept=".json" class="hidden" @change="importChats($event)">
                    </label>
                </div>
                <div class="text-xs text-gray-500 text-center pt-2">
                    <span x-text="apiKey ? 'API Key Set ✅' : 'No API Key ❌'"></span>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative w-full">

            <header class="h-16 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-4 z-10">
                <div class="flex items-center gap-3">
                    <button @click="showSidebar = !showSidebar" class="md:hidden text-gray-400">
                        <span class="material-icons">menu</span>
                    </button>

                    <div class="relative">
                        <select x-model="selectedModel"
                            class="bg-gray-700 text-sm rounded border border-gray-600 px-3 py-2 outline-none focus:border-blue-500 w-48 md:w-64 appearance-none truncate"
                            @change="saveSettings()">
                            <option value="" disabled>Select Model</option>
                            <template x-for="model in models" :key="model.id">
                                <option :value="model.id" x-text="model.name || model.id"></option>
                            </template>
                        </select>
                        <span
                            class="material-icons absolute right-2 top-2.5 text-gray-400 pointer-events-none text-sm">expand_more</span>
                    </div>
                    <input type="text" x-model="selectedModel" placeholder="Model" @change="saveSettings()"
                        class="bg-gray-700 text-sm rounded border border-gray-600 px-3 py-2 outline-none focus:border-blue-500 w-48 md:w-64">
                </div>

                <div class="flex items-center gap-3">
                    <!-- <div class="flex items-center gap-2 cursor-pointer" @click="toggleStream()">
                        <span class="text-xs text-gray-400">Stream</span>
                        <div class="w-8 h-4 bg-gray-700 rounded-full relative transition"
                            :class="streamEnabled ? 'bg-green-900' : ''">
                            <div class="w-4 h-4 bg-gray-400 rounded-full absolute top-0 transition-all"
                                :class="streamEnabled ? 'right-0 bg-green-500' : 'left-0'"></div>
                        </div>
                    </div> -->

                    <button @click="showSettings = true" class="text-gray-400 hover:text-white transition">
                        <span class="material-icons">settings</span>
                    </button>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth">
                <template x-for="(msg, index) in messages" :key="index">
                    <div class="flex flex-col gap-2" :class="msg.role === 'user' ? 'items-end' : 'items-start'">

                        <div class="text-xs text-gray-500 flex items-center gap-1">
                            <span class="material-icons text-xs"
                                x-text="msg.role === 'user' ? 'person' : 'smart_toy'"></span>
                            <span x-text="msg.role === 'user' ? 'You' : 'AI'"></span>
                        </div>

                        <div class="max-w-3xl p-4 rounded-lg shadow-lg relative prose prose-invert"
                            :class="msg.role === 'user' ? 'bg-blue-900 text-blue-50' : 'bg-gray-700 text-gray-100'">

                            <template x-if="msg.image">
                                <div class="mb-3 relative group inline-block">
                                    <img :src="msg.image" class="max-h-48 rounded border border-gray-600">
                                    <button @click="downloadImage(msg.image)"
                                        class="absolute bottom-2 right-2 bg-black/70 p-1 rounded hover:bg-black text-white opacity-0 group-hover:opacity-100 transition">
                                        <span class="material-icons text-sm">download</span>
                                    </button>
                                </div>
                            </template>

                            <div x-html="parseMarkdown(msg.content)"></div>

                            <!-- <template x-if="msg.role === 'assistant' && msg.content.includes('![')">
                                <div class="mt-2 pt-2 border-t border-gray-600">
                                    <small class="text-gray-400 italic">Image detected in output</small>
                                </div>
                            </template> -->
                        </div>
                    </div>
                </template>

                <div x-show="isLoading" class="flex items-center gap-2 text-gray-500 animate-pulse">
                    <span class="material-icons text-lg">hourglass_empty</span>
                    <span class="text-sm">Generating...</span>
                </div>

                <div class="h-16"></div>
            </div>

            <div class="bg-gray-800 border-t border-gray-700 p-4 sticky bottom-0 z-10">
                <div x-show="inputImage"
                    class="absolute bottom-full left-4 mb-2 bg-gray-800 p-2 rounded shadow-lg border border-gray-600 flex items-start gap-2"
                    x-transition>
                    <img :src="inputImage" class="h-20 w-auto rounded">
                    <button @click="inputImage = null"
                        class="text-red-400 hover:text-red-300 bg-gray-900 rounded-full p-1">
                        <span class="material-icons text-xs">close</span>
                    </button>
                </div>

                <div class="flex items-end gap-2 max-w-4xl mx-auto">
                    <label
                        class="p-3 text-gray-400 hover:text-white cursor-pointer transition rounded hover:bg-gray-700">
                        <span class="material-icons">add_photo_alternate</span>
                        <input type="file" accept="image/*" class="hidden" @change="handleImageInput($event)">
                    </label>

                    <textarea x-model="userInput" @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
                        class="w-full bg-gray-900 text-white rounded-lg border border-gray-600 p-3 outline-none focus:border-blue-500 resize-none h-12 max-h-32 overflow-y-auto"
                        placeholder="Type a message... (Shift+Enter for new line)"></textarea>

                    <button @click="sendMessage()" :disabled="isLoading || (!userInput && !inputImage)"
                        class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white p-3 rounded-lg shadow transition flex items-center">
                        <span class="material-icons">send</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div x-show="showSettings" x-cloak
        class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-gray-800 w-full max-w-md rounded-lg shadow-xl border border-gray-700 p-6"
            @click.away="showSettings = false">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span class="material-icons">settings</span> Settings
            </h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">OpenRouter API Key</label>
                    <input type="password" x-model="apiKey"
                        class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm focus:border-blue-500 outline-none">
                    <p class="text-xs text-gray-500 mt-1">Stored locally in your browser.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">System Prompt</label>
                    <textarea x-model="systemPrompt" rows="3"
                        class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm focus:border-blue-500 outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Temperature</label>
                        <input type="number" step="0.1" min="0" max="2" x-model="temperature"
                            class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm">
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button @click="saveSettings()"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm transition">
                    Save & Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Setup Dexie (IndexedDB Wrapper)
        const db = new Dexie('OpenRouterClientDB');
        db.version(1).stores({
            chats: '++id, title, timestamp'
        });

        function app() {
            return {
                // Config
                apiKey: '',
                systemPrompt: 'You are a helpful assistant.',
                temperature: 0.7,
                streamEnabled: false,

                // Data
                models: [],
                selectedModel: '',
                chatHistory: [],
                currentChatId: null,
                messages: [],

                // UI State
                isLoading: false,
                userInput: '',
                inputImage: null, // Base64
                showSidebar: false,
                showSettings: false,

                async initApp() {
                    // Load Settings from LocalStorage
                    this.apiKey = localStorage.getItem('or_apiKey') || '';
                    this.systemPrompt = localStorage.getItem('or_sysPrompt') || this.systemPrompt;
                    this.selectedModel = localStorage.getItem('or_model') || 'google/gemini-3-flash-preview';

                    // Initial Fetch
                    await this.loadHistory();
                    if (this.apiKey) {
                        this.fetchModels();
                    } else {
                        this.showSettings = true;
                    }

                    // Markdown Parser Config
                    marked.setOptions({
                        breaks: true,
                        gfm: true
                    });

                    // Watchers
                    this.$watch('messages', () => {
                        this.$nextTick(() => this.scrollToBottom());
                    });
                },

                saveSettings() {
                    localStorage.setItem('or_apiKey', this.apiKey);
                    localStorage.setItem('or_sysPrompt', this.systemPrompt);
                    localStorage.setItem('or_model', this.selectedModel);
                    this.showSettings = false;
                    if (this.models.length === 0) this.fetchModels();
                },

                toggleStream() {
                    this.streamEnabled = !this.streamEnabled;
                },

                async fetchModels() {
                    try {
                        const res = await fetch('https://openrouter.ai/api/v1/models');
                        const data = await res.json();
                        this.models = data.data.sort((a, b) => a.name.localeCompare(b.name));
                    } catch (e) {
                        console.error("Failed to fetch models", e);
                    }
                },

                async loadHistory() {
                    this.chatHistory = await db.chats.orderBy('timestamp').reverse().toArray();
                },

                async startNewChat() {
                    this.currentChatId = null;
                    this.messages = [];
                    this.userInput = '';
                    this.inputImage = null;
                    if (window.innerWidth < 768) this.showSidebar = false;
                },

                async loadChat(id) {
                    const chat = await db.chats.get(id);
                    if (chat) {
                        this.currentChatId = chat.id;
                        this.messages = chat.messages || [];
                        if (window.innerWidth < 768) this.showSidebar = false;
                    }
                },

                async deleteChat(id) {
                    if (!confirm('Delete this chat?')) return;
                    await db.chats.delete(id);
                    await this.loadHistory();
                    if (this.currentChatId === id) this.startNewChat();
                },

                handleImageInput(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        this.inputImage = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                downloadImage(url) {
                    const filename = new Date().toISOString() + '.png';
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                },

                async sendMessage() {
                    if ((!this.userInput.trim() && !this.inputImage) || this.isLoading || !this.apiKey) return;

                    const userMsgContent = [];
                    if (this.userInput.trim()) {
                        userMsgContent.push({ type: "text", text: this.userInput });
                    }
                    if (this.inputImage) {
                        userMsgContent.push({ type: "image_url", image_url: { url: this.inputImage } });
                    }

                    // Push User Message to UI
                    const userMsg = {
                        role: 'user',
                        content: this.userInput, // Storing text representation for display
                        image: this.inputImage,  // For UI display
                        fullContent: userMsgContent // Payload structure
                    };
                    this.messages.push(userMsg);

                    // Prepare AI Placeholder
                    const aiMsg = { role: 'assistant', content: '' };
                    this.messages.push(aiMsg);
                    const aiMsgIndex = this.messages.length - 1;

                    this.isLoading = true;
                    const payloadMessages = [
                        { role: "system", content: this.systemPrompt },
                        ...this.messages.slice(0, -1).map(m => ({
                            role: m.role,
                            content: m.fullContent || m.content
                        }))
                    ];

                    this.userInput = '';
                    this.inputImage = null;

                    try {
                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${this.apiKey}`,
                                "Content-Type": "application/json",
                                "HTTP-Referer": window.location.href,
                                "X-Title": "Mini Alpine Client"
                            },
                            body: JSON.stringify({
                                model: this.selectedModel || 'openai/gpt-3.5-turbo',
                                messages: payloadMessages,
                                temperature: parseFloat(this.temperature),
                                stream: this.streamEnabled
                            })
                        });

                        if (!response.ok) throw new Error("API Error");

                        if (this.streamEnabled) {
                            const reader = response.body.getReader();
                            const decoder = new TextDecoder("utf-8");

                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;

                                const chunk = decoder.decode(value, { stream: true });
                                const lines = chunk.split("\n");

                                for (const line of lines) {
                                    if (line.startsWith("data: ") && line !== "data: [DONE]") {
                                        try {
                                            const json = JSON.parse(line.substring(6));
                                            const content = json.choices[0]?.delta?.content || "";
                                            this.messages[aiMsgIndex].content += content;
                                        } catch (e) { /* ignore parse errors */ }
                                    }
                                }
                            }
                        } else {
                            const data = await response.json();
                            this.messages[aiMsgIndex].content = data.choices[0].message.content;
                            this.messages[aiMsgIndex].image = data.choices[0].message.images ? data.choices[0].message.images[0].image_url.url : null;
                        }

                        // Save to DB
                        await this.saveToDB();

                    } catch (error) {
                        this.messages[aiMsgIndex].content = "Error: " + error.message;
                    } finally {
                        this.isLoading = false;
                        this.scrollToBottom();
                    }
                },

                async saveToDB() {
                    const title = this.messages[0].content.substring(0, 30) + "...";
                    const chatData = {
                        title: title,
                        timestamp: Date.now(),
                        messages: JSON.parse(JSON.stringify(this.messages))
                    };

                    if (this.currentChatId) {
                        await db.chats.update(this.currentChatId, { messages: chatData.messages, timestamp: Date.now() });
                    } else {
                        this.currentChatId = await db.chats.add(chatData);
                    }
                    await this.loadHistory();
                },

                async exportChats() {
                    const allChats = await db.chats.toArray();
                    const blob = new Blob([JSON.stringify(allChats, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "openrouter-chats-backup.json";
                    a.click();
                    URL.revokeObjectURL(url);
                },

                async importChats(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            // Sanitized import: Remove IDs to avoid collisions, let IndexedDB auto-increment
                            const cleanData = data.map(({ id, ...rest }) => rest);
                            await db.chats.bulkAdd(cleanData);
                            await this.loadHistory();
                            alert("Import successful!");
                        } catch (err) {
                            alert("Invalid JSON file");
                        }
                    };
                    reader.readAsText(file);
                },

                parseMarkdown(text) {
                    // Custom renderer to add download functionality to images would go here
                    // For now, standard marked parse
                    const html = marked.parse(text);

                    // Simple hack to make generated images downloadable via click (handled via delegation or here)
                    // In a real app, we'd use a custom renderer. Here we rely on standard browser behavior
                    // but we ensure standard Markdown images are responsive.
                    return html;
                },

                scrollToBottom() {
                    const container = document.getElementById('chat-container');
                    container.scrollTop = container.scrollHeight;
                }
            }
        }
    </script>
</body>

</html>
