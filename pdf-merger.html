<!DOCTYPE html>
<html lang="id" x-data="pdfMerger()" :class="{ 'dark': isDark }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger Tool</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body
    class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300 font-sans p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <header
            class="flex justify-between items-center mb-8 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="flex items-center space-x-2">
                <span class="material-icons text-blue-600 dark:text-blue-400 text-3xl">picture_as_pdf</span>
                <h1 class="text-2xl font-bold tracking-tight">Mini PDF Merger</h1>
            </div>
            <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition"
                title="Toggle Dark Mode">
                <span class="material-icons" x-text="isDark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main
            class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 p-6 md:p-8">

            <div class="mb-8">
                <label
                    class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <span class="material-icons text-gray-400 dark:text-gray-300 text-4xl mb-2">upload_file</span>
                        <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Klik untuk
                                memilih</span> beberapa file PDF</p>
                    </div>
                    <input type="file" class="hidden" multiple accept="application/pdf" @change="handleFiles" />
                </label>
            </div>

            <div x-show="files.length > 0" class="mb-6" x-transition>
                <div class="flex justify-between items-end mb-3 border-b border-gray-200 dark:border-gray-700 pb-2">
                    <h2 class="text-lg font-semibold">Urutan Dokumen</h2>
                    <span class="text-sm text-gray-500 dark:text-gray-400"
                        x-text="files.length + ' file dipilih'"></span>
                </div>

                <ul class="space-y-3">
                    <template x-for="(fileItem, index) in files" :key="fileItem.id">
                        <li
                            class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-lg border border-gray-200 dark:border-gray-600">

                            <div class="flex items-center overflow-hidden mr-4">
                                <span class="material-icons text-red-500 mr-3">description</span>
                                <div class="truncate">
                                    <p class="text-sm font-medium truncate" x-text="fileItem.name"></p>
                                    <p class="text-xs text-gray-500 dark:text-gray-400" x-text="fileItem.size"></p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-1 shrink-0">
                                <button @click="moveUp(index)" :disabled="index === 0"
                                    class="p-1 rounded text-gray-500 hover:text-blue-600 hover:bg-gray-200 dark:hover:bg-gray-600 disabled:opacity-30 transition">
                                    <span class="material-icons text-xl">arrow_upward</span>
                                </button>
                                <button @click="moveDown(index)" :disabled="index === files.length - 1"
                                    class="p-1 rounded text-gray-500 hover:text-blue-600 hover:bg-gray-200 dark:hover:bg-gray-600 disabled:opacity-30 transition">
                                    <span class="material-icons text-xl">arrow_downward</span>
                                </button>
                                <button @click="removeFile(index)"
                                    class="p-1 rounded text-gray-500 hover:text-red-600 hover:bg-red-100 dark:hover:bg-red-900/30 transition ml-2">
                                    <span class="material-icons text-xl">delete</span>
                                </button>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-gray-200 dark:border-gray-700">
                <p x-show="files.length > 0 && files.length < 2" class="text-sm text-amber-600 dark:text-amber-400">
                    Pilih minimal 2 file.
                </p>
                <div x-show="files.length === 0 || files.length >= 2"></div>
                <div class="flex space-x-3">
                    <button x-show="files.length > 0" @click="resetAll" :disabled="isMerging"
                        class="flex items-center space-x-2 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium py-2.5 px-4 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                        <span class="material-icons">delete_sweep</span>
                        <span class="hidden sm:inline">Reset</span>
                    </button>

                    <button @click="mergePDFs" :disabled="files.length < 2 || isMerging"
                        class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition disabled:bg-gray-400 dark:disabled:bg-gray-600 disabled:cursor-not-allowed shadow-sm">
                        <span class="material-icons" x-text="isMerging ? 'hourglass_empty' : 'call_merge'"
                            :class="{'animate-spin': isMerging}"></span>
                        <span x-text="isMerging ? 'Memproses...' : 'Gabungkan'"></span>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script>
        function pdfMerger() {
            return {
                isDark: window.matchMedia('(prefers-color-scheme: dark)').matches,
                files: [],
                isMerging: false,

                toggleTheme() {
                    this.isDark = !this.isDark;
                },

                handleFiles(event) {
                    const selectedFiles = Array.from(event.target.files);
                    selectedFiles.forEach(file => {
                        if (file.type === 'application/pdf') {
                            this.files.push({
                                id: Date.now() + Math.random().toString(36).substring(7),
                                name: file.name,
                                size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
                                file: file
                            });
                        }
                    });
                    event.target.value = '';
                },

                removeFile(index) {
                    this.files.splice(index, 1);
                },

                // Fungsi baru untuk Reset
                resetAll() {
                    if (confirm("Apakah Anda yakin ingin menghapus semua file dari daftar?")) {
                        this.files = [];
                    }
                },

                moveUp(index) {
                    if (index > 0) {
                        const temp = this.files[index - 1];
                        this.files[index - 1] = this.files[index];
                        this.files[index] = temp;
                    }
                },

                moveDown(index) {
                    if (index < this.files.length - 1) {
                        const temp = this.files[index + 1];
                        this.files[index + 1] = this.files[index];
                        this.files[index] = temp;
                    }
                },

                async mergePDFs() {
                    if (this.files.length < 2) return;
                    this.isMerging = true;

                    try {
                        const { PDFDocument } = PDFLib;
                        const mergedPdf = await PDFDocument.create();

                        for (const item of this.files) {
                            const arrayBuffer = await item.file.arrayBuffer();
                            const pdf = await PDFDocument.load(arrayBuffer);
                            const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                            copiedPages.forEach((page) => mergedPdf.addPage(page));
                        }

                        const mergedPdfBytes = await mergedPdf.save();

                        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                        const url = URL.createObjectURL(blob);

                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Digabung_Mini_App_${Date.now()}.pdf`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        // Opsi: Otomatis reset setelah berhasil mengunduh
                        // this.files = [];

                    } catch (error) {
                        console.error("Terjadi kesalahan:", error);
                        alert("Gagal menggabungkan PDF. Pastikan file tidak rusak atau dienkripsi password.");
                    } finally {
                        this.isMerging = false;
                    }
                }
            }
        }
    </script>
</body>

</html>
