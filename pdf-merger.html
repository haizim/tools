<!DOCTYPE html>
<html lang="id" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger SPA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300"
    x-data="pdfApp()" x-init="initTheme()">

    <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="material-icons text-blue-600 dark:text-blue-400">picture_as_pdf</span>
                <h1 class="text-xl font-semibold">PDF Merger</h1>
            </div>
            <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                <span class="material-icons" x-text="isDark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <div class="mb-8">
            <label
                class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <span class="material-icons text-4xl text-gray-400 dark:text-gray-500 mb-2">cloud_upload</span>
                    <p class="mb-2 text-sm text-gray-500 dark:text-gray-400">
                        <span class="font-semibold text-blue-600 dark:text-blue-400">Klik untuk upload</span> atau drag
                        and drop
                    </p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Hanya mendukung file PDF</p>
                </div>
                <input type="file" class="hidden" multiple accept="application/pdf" @change="handleFiles">
            </label>
        </div>

        <div x-show="files.length > 0" x-cloak
            class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden mb-6">
            <div
                class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center">
                <h2 class="font-medium text-gray-700 dark:text-gray-200">Daftar File (<span
                        x-text="files.length"></span>)</h2>
                <span class="text-xs text-gray-500 dark:text-gray-400">Atur urutan file sebelum digabungkan</span>
            </div>

            <ul class="divide-y divide-gray-100 dark:divide-gray-700">
                <template x-for="(fileObj, index) in files" :key="fileObj.id">
                    <li
                        class="flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors group">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <span class="material-icons text-red-500 dark:text-red-400">description</span>
                            <div class="truncate">
                                <p class="text-sm font-medium truncate" x-text="fileObj.name"></p>
                                <p class="text-xs text-gray-500 dark:text-gray-400" x-text="fileObj.sizeFormat"></p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-1 ml-4">
                            <button @click="moveUp(index)" :disabled="index === 0"
                                class="p-1.5 rounded text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed transition">
                                <span class="material-icons text-sm">arrow_upward</span>
                            </button>
                            <button @click="moveDown(index)" :disabled="index === files.length - 1"
                                class="p-1.5 rounded text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed transition">
                                <span class="material-icons text-sm">arrow_downward</span>
                            </button>
                            <button @click="removeFile(index)"
                                class="p-1.5 rounded text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-gray-700 transition">
                                <span class="material-icons text-sm">delete</span>
                            </button>
                        </div>
                    </li>
                </template>
            </ul>
        </div>

        <div x-show="files.length > 0" x-cloak class="flex justify-end">
            <button @click="mergePDFs" :disabled="files.length < 2 || isMerging"
                class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 dark:disabled:bg-gray-600 text-white px-6 py-2.5 rounded-lg font-medium transition-colors shadow-sm">

                <span x-show="!isMerging" class="material-icons text-sm">call_merge</span>
                <span x-show="isMerging" class="material-icons text-sm animate-spin">autorenew</span>

                <span x-text="isMerging ? 'Menggabungkan...' : 'Gabungkan PDF'"></span>
            </button>
        </div>

        <p x-show="files.length === 1" x-cloak class="text-sm text-yellow-600 dark:text-yellow-400 text-right mt-2">
            * Tambahkan minimal 1 file PDF lagi untuk mulai menggabungkan.
        </p>

    </main>

    <script>
        function pdfApp() {
            return {
                isDark: false,
                files: [],
                isMerging: false,

                // Inisialisasi tema berdasarkan preferensi sistem
                initTheme() {
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        this.isDark = true;
                    }
                    this.applyTheme();
                },

                toggleTheme() {
                    this.isDark = !this.isDark;
                    this.applyTheme();
                },

                applyTheme() {
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                handleFiles(event) {
                    const selectedFiles = Array.from(event.target.files);
                    selectedFiles.forEach(file => {
                        if (file.type === 'application/pdf') {
                            this.files.push({
                                id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                                originalFile: file,
                                name: file.name,
                                sizeFormat: (file.size / 1024 / 1024).toFixed(2) + ' MB'
                            });
                        }
                    });
                    event.target.value = ''; // Reset input agar bisa upload file yang sama jika dihapus
                },

                removeFile(index) {
                    this.files.splice(index, 1);
                },

                moveUp(index) {
                    if (index > 0) {
                        const temp = this.files[index];
                        this.files[index] = this.files[index - 1];
                        this.files[index - 1] = temp;
                    }
                },

                moveDown(index) {
                    if (index < this.files.length - 1) {
                        const temp = this.files[index];
                        this.files[index] = this.files[index + 1];
                        this.files[index + 1] = temp;
                    }
                },

                async mergePDFs() {
                    if (this.files.length < 2) return;

                    this.isMerging = true;

                    try {
                        const { PDFDocument } = window.PDFLib;
                        const mergedPdf = await PDFDocument.create();

                        for (let fileObj of this.files) {
                            // Convert file ke ArrayBuffer
                            const arrayBuffer = await fileObj.originalFile.arrayBuffer();
                            // Load PDF
                            const pdf = await PDFDocument.load(arrayBuffer);
                            // Copy semua halaman
                            const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                            // Masukkan ke dokumen baru
                            copiedPages.forEach((page) => mergedPdf.addPage(page));
                        }

                        // Simpan dokumen yang digabung
                        const mergedPdfBytes = await mergedPdf.save();

                        // Buat Blob dan trigger download
                        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
                        const url = URL.createObjectURL(blob);

                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `Merged_Document_${new Date().getTime()}.pdf`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        URL.revokeObjectURL(url);
                    } catch (error) {
                        console.error("Terjadi kesalahan:", error);
                        alert("Gagal menggabungkan file PDF. Pastikan file tidak rusak atau dienkripsi.");
                    } finally {
                        this.isMerging = false;
                    }
                }
            }
        }
    </script>
</body>

</html>
