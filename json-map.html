<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Tree Mapper</title>

    <script src="assets/js/tailwindcss.js"></script>
    <script src="assets/js/theme-config.js"></script>
    <script defer src="assets/js/alpine.min.js"></script>

    <script src="assets/js/raphael.min.js"></script>
    <script src="assets/js/Treant.min.js"></script>
    <link rel="stylesheet" href="assets/css/Treant.css">


    <style>
        /* --- Node Styling --- */
        .Treant>.node {
            @apply p-2 pl-3 border-l-4 border-gray-200 dark:border-gemini-gray-dark bg-white dark:bg-gemini-gray-dark shadow-sm text-sm transition-all duration-200 cursor-pointer rounded-r-md;
            min-width: 100px;
            text-align: left;
            /* Text align left lebih bagus untuk horizontal */
            border-top: 2px solid #228be6;
            border-bottom: 2px solid #228be6;
            border-right: 2px solid #228be6;
            border-radius: 0 12px 12px 0;
            color: #228be6;
            padding: 0 12px;
        }



        /* Warna border kiri berbeda untuk membedakan level/jenis */
        .Treant>.node:hover {
            @apply border-l-primary-500 shadow-md bg-gray-50 dark:bg-gemini-gray-dark/80;
        }

        .Treant>.node .node-name {
            @apply font-bold text-gray-800 dark:text-gemini-gray-light text-sm;
        }

        .Treant>.node .node-desc {
            @apply text-xs text-gray-500 dark:text-gray-400 block mt-0.5;
        }

        .node img {
            display: none;
        }

        /* --- Collapse Switch Customization (Posisi Kanan) --- */
        .Treant .collapse-switch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #0ea5e9;
            background-color: #ffffff;
            cursor: pointer;

            /* Posisi untuk Layout Horizontal (WEST) */
            position: absolute;
            right: -12px;
            /* Keluar setengah dari node */
            top: 50%;
            /* Tengah secara vertikal */
            margin-top: -12px;
            /* Kompensasi tinggi agar benar-benar tengah */

            z-index: 20;
            transition: all 0.2s ease;
        }

        .Treant .collapse-switch:hover {
            background-color: #f0f9ff;
            transform: scale(1.2);
        }



        /* Ikon garis di dalam tombol switch */
        .Treant .collapse-switch::before,
        .Treant .collapse-switch::after {
            background-color: #0ea5e9;
        }

        /* --- Container Styling --- */
        #tree-container {
            overflow: visible;
            transform-origin: top left;
            /* Ubah pivot zoom */
            transition: transform 0.3s ease;
            padding: 40px;
            /* Padding agar tidak mepet kiri */
        }

        #tree-wrapper {
            overflow: auto;
            height: 100%;
            width: 100%;
            /* background-image: radial-gradient(#228be6 1px, transparent 1px); */
            background-size: 20px 20px;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gemini-gray-darker h-screen flex flex-col overflow-hidden font-sans"
    x-data="jsonTreeApp()">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <header
        class="bg-white dark:bg-gemini-gray-dark border-b border-gray-200 dark:border-gemini-gray-dark p-4 flex justify-between items-center shadow-sm z-30 relative">
        <h1 class="text-xl font-bold text-gray-800 dark:text-gemini-gray-light">
            JSON Mapper
        </h1>
        <div class="flex items-center gap-2">
            <!-- Theme Toggle Button -->
            <button @click="toggleTheme()"
                class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors mr-2">
                <!-- Sun Icon -->
                <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <!-- Moon Icon -->
                <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>

            <button @click="zoomOut()"
                class="w-8 h-8 bg-gray-200 dark:bg-gemini-gray-darker dark:text-gemini-gray-light rounded hover:bg-gray-300 dark:hover:bg-gemini-gray-dark/80 font-bold">-</button>
            <span class="text-xs text-gray-500 dark:text-gray-400 w-12 text-center"
                x-text="Math.round(zoom * 100) + '%'"></span>
            <button @click="zoomIn()"
                class="w-8 h-8 bg-gray-200 dark:bg-gemini-gray-darker dark:text-gemini-gray-light rounded hover:bg-gray-300 dark:hover:bg-gemini-gray-dark/80 font-bold">+</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <div
            class="w-1/3 flex flex-col border-r border-gray-200 dark:border-gemini-gray-dark bg-white dark:bg-gemini-gray-dark z-20 shadow-lg">
            <textarea x-model="rawJson" @input.debounce.500ms="parseAndRender()"
                class="flex-1 w-full p-4 font-mono text-xs focus:outline-none resize-none text-gray-800 dark:text-gemini-gray-light dark:bg-gemini-gray-darker leading-relaxed"
                :class="{'bg-red-50 dark:bg-red-900/20': !isValid}" spellcheck="false"></textarea>
        </div>

        <div class="flex-1 relative bg-gray-50 dark:bg-gemini-gray-darker overflow-hidden">
            <div id="tree-wrapper"
                :style="`background-image: radial-gradient(${darkMode ? '#5f6368' : '#cbd5e1'} 1px, transparent 1px);`">
                <div id="tree-container" :style="`transform: scale(${zoom})`"></div>
            </div>
        </div>
    </main>

    <script>
        function jsonTreeApp() {
            return {
                rawJson: JSON.stringify({
                    "App": "Horizontal Mapper",
                    "Config": {
                        "Orientation": "West",
                        "Theme": "Tailwind",
                        "Features": ["Zoom", "Collapse", "Live Edit"]
                    },
                    "Data": {
                        "User": "Admin",
                        "Role": "Developer"
                    }
                }, null, 2),
                isValid: true,
                zoom: 1.0,
                chart: null,
                darkMode: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),


                init() {
                    this.parseAndRender();
                },
                zoomIn() { if (this.zoom < 2.0) this.zoom += 0.1; },
                zoomOut() { if (this.zoom > 0.3) this.zoom -= 0.1; },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');

                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    // Re-render to update connector colors
                    this.parseAndRender();
                },

                parseAndRender() {
                    try {
                        const data = JSON.parse(this.rawJson);
                        this.isValid = true;
                        requestAnimationFrame(() => this.renderTreant(data));
                    } catch (e) {
                        this.isValid = false;
                    }
                },

                convertToTreantStructure(data, keyName = "ROOT") {
                    let node = {
                        text: { name: keyName },
                        collapsable: true
                    };

                    if (typeof data === 'object' && data !== null) {
                        if (Array.isArray(data)) {
                            node.text.desc = `[${data.length}]`;
                            node.children = data.map((item, index) =>
                                this.convertToTreantStructure(item, `${index}`)
                            );
                        } else {
                            node.text.desc = "{}";
                            node.children = Object.keys(data).map(key =>
                                this.convertToTreantStructure(data[key], key)
                            );
                        }
                    } else {
                        node.text.desc = String(data);
                        node.HTMLclass = "border-l-secondary-500"; // Green accent for leaf
                        node.collapsable = false;
                    }
                    return node;
                },

                renderTreant(jsonData) {
                    document.getElementById('tree-container').innerHTML = "";
                    const chartConfig = {
                        chart: {
                            container: "#tree-container",

                            // PENGATURAN UTAMA HORIZONTAL
                            rootOrientation: "WEST", // Arah Kiri ke Kanan

                            levelSeparation: 50, // Jarak horizontal antar level
                            siblingSeparation: 20, // Jarak vertikal antar item
                            subTeeSeparation: 20,

                            connectors: {
                                type: "curve", // Tipe garis siku
                                style: {
                                    "stroke-width": 2,
                                    "stroke": "#228be6", // Dynamic stroke color
                                    "stroke-linecap": "round"
                                }
                            },
                            node: { collapsable: true }
                        },
                        nodeStructure: this.convertToTreantStructure(jsonData)
                    };
                    this.chart = new Treant(chartConfig);
                }
            }
        }
    </script>
</body>

</html>
