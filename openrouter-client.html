<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Client</title>

    <script src="assets/js/tailwindcss.js"></script>

    <script defer src="assets/js/alpine.min.js"></script>

    <script src="assets/js/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'gemini-gray-light': '#f0f4f9',
                        'gemini-gray': '#e6e8ea',
                        'gemini-gray-dark': '#3c4043',
                        'gemini-gray-darker': '#202124',
                        'gemini-blue': '#8ab4f8',
                        primary: tailwind.colors.sky,
                        secondary: tailwind.colors.rose,
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #202124;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Styling khusus untuk PRE tag agar terlihat bisa diklik */
        .prose pre {
            background-color: #1e1e1e;
            padding: 1rem;
            border-radius: 0.5rem;
            cursor: text;
        }

        .prose p {
            margin-top: 0;
            margin-bottom: 1em;
        }
    </style>
</head>

<body class="bg-gemini-gray-darker text-gemini-gray-light antialiased">

    <div x-data="chatApp()" x-init="init()" class="flex h-screen w-full">

        <aside
            class="w-1/5 bg-[#131314] p-4 flex flex-col h-full absolute md:relative z-20 md:translate-x-0 transform -translate-x-full transition-transform duration-300 ease-in-out"
            :class="{'translate-x-0': sidebarOpen}">

            <div class="flex-shrink-0">
                <button @click="newChat()"
                    class="w-full flex items-center justify-between bg-gemini-gray-dark hover:bg-gemini-gray-dark/80 text-white font-semibold py-2 px-4 rounded-full transition-colors duration-200">
                    <span>New Chat</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <nav class="mt-6 flex-grow overflow-y-auto">
                <p class="text-xs text-gray-400 font-semibold mb-2 px-2">History</p>
                <template x-for="chat in chats.slice().reverse()" :key="chat.id">
                    <div @click="selectChat(chat.id)"
                        class="flex items-center justify-between p-2 rounded-lg cursor-pointer group"
                        :class="{ 'bg-gemini-gray-dark': activeChatId === chat.id, 'hover:bg-gemini-gray-dark/50': activeChatId !== chat.id }">

                        <div class="flex-grow truncate pr-2">
                            <template x-if="editingChatId !== chat.id">
                                <p class="text-sm" x-text="chat.title"></p>
                            </template>
                            <template x-if="editingChatId === chat.id">
                                <input type="text" x-model="tempTitle" :ref="`titleInput_${chat.id}`"
                                    @keydown.enter="saveTitle(chat.id)" @blur="saveTitle(chat.id)"
                                    class="text-sm bg-gemini-gray-darker border border-primary-400 rounded w-full px-1 py-0 focus:outline-none">
                            </template>
                        </div>

                        <div
                            class="flex-shrink-0 flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button @click.stop="startEditing(chat)">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 hover:text-white"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.536L16.732 3.732z" />
                                </svg>
                            </button>
                            <button @click.stop="deleteChat(chat.id)">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 hover:text-white"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </template>
            </nav>

            <div class="flex-shrink-0 mt-4">
                <label for="apiKey" class="text-xs text-gray-400 font-semibold mb-2 px-2">OpenRouter API Key</label>
                <input type="password" id="apiKey" x-model="apiKey" placeholder="sk-or-..."
                    class="w-full bg-gemini-gray-dark border border-gemini-gray-darker rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400 transition-shadow">
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen bg-gemini-gray-darker relative">
            <header
                class="md:hidden flex items-center justify-between p-4 bg-[#131314] border-b border-gemini-gray-dark">
                <button @click="sidebarOpen = !sidebarOpen">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h1 class="text-lg font-semibold truncate" x-text="activeChat ? activeChat.title : 'Chat'"></h1>
                <button @click="showSystemPromptInput = !showSystemPromptInput" title="Set System Prompt"
                    class="p-2 rounded-lg hover:bg-gemini-gray-dark focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.573-1.066z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </header>

            <div class="hidden md:flex items-center justify-between p-4 border-b border-gemini-gray-dark">
                <h1 class="text-xl font-semibold" x-text="activeChat ? activeChat.title : 'New Chat'"></h1>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center cursor-pointer" title="Toggle streaming response">
                        <span class="mr-2 text-sm text-gray-400">Stream:</span>
                        <div class="relative">
                            <input type="checkbox" x-model="useStreaming" class="sr-only peer">
                            <div
                                class="block w-10 h-6 bg-gemini-gray-dark rounded-full peer-checked:bg-primary-400 transition-colors">
                            </div>
                            <div
                                class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-full">
                            </div>
                        </div>
                    </label>

                    <select x-model="selectedModel"
                        class="bg-gemini-gray-dark border border-gemini-gray-darker rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400 max-w-xs">
                        <template x-for="model in models" :key="model.id">
                            <option :value="model.id" x-text="model.formattedName"></option>
                        </template>
                    </select>

                    <span x-text="selectedModel"></span>

                    <button @click="showSystemPromptInput = !showSystemPromptInput" title="Set System Prompt"
                        class="p-2 rounded-lg hover:bg-gemini-gray-dark focus:outline-none focus:ring-2 focus:ring-primary-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.573-1.066z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div x-show="showSystemPromptInput && activeChat" x-transition
                class="p-4 bg-[#131314] border-b border-gemini-gray-dark">
                <label for="systemPrompt" class="block text-sm font-medium text-gray-400 mb-2">System Prompt (for this
                    chat)</label>
                <textarea id="systemPrompt" x-model="activeChat.systemPrompt"
                    placeholder="e.g., You are a helpful assistant. You respond in pirate-speak."
                    class="w-full bg-gemini-gray-dark border border-gemini-gray-darker rounded-lg p-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-primary-400"
                    rows="3">
                 </textarea>
            </div>

            <div x-ref="chatContainer" class="flex-grow p-6 overflow-y-auto">
                <div class="max-w-4xl mx-auto">
                    <template x-if="activeChat && activeChat.messages.length === 0">
                        <div class="text-center text-gray-400">
                            <h2 class="text-4xl font-bold mb-4">Hello!</h2>
                            <p class="text-lg">How can I help you today?</p>
                        </div>
                    </template>
                    <template x-for="(message, index) in activeChat?.messages" :key="index">
                        <div class="mb-6">
                            <div class="flex items-start gap-4">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0"
                                    :class="{ 'bg-primary-600': message.role === 'user', 'bg-secondary-600': message.role === 'assistant' }">
                                    <span x-text="message.role === 'user' ? 'Y' : 'G'"></span>
                                </div>
                                <div class="prose prose-invert max-w-none prose-p:text-gemini-gray-light"
                                    x-html="renderMarkdown(message.content)" @dblclick="selectCodeBlock($event)">
                                </div>
                            </div>
                        </div>
                    </template>
                    <div x-show="isLoading" class="flex items-start gap-4">
                        <div
                            class="w-8 h-8 rounded-full bg-secondary-600 flex items-center justify-center font-bold text-white flex-shrink-0">
                            G</div>
                        <div class="w-full pt-1.5">
                            <div class="w-3 h-3 rounded-full bg-primary-400 animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full flex-shrink-0 p-4 bg-gemini-gray-darker">
                <div class="max-w-4xl mx-auto">
                    <form @submit.prevent="sendMessage()" class="relative">
                        <textarea x-model="currentMessage" @keydown.ctrl.enter="sendMessage()"
                            @keydown.meta.enter="sendMessage()"
                            placeholder="Enter your message... (Ctrl + Enter to send)"
                            class="w-full bg-gemini-gray-dark border border-gemini-gray-darker rounded-lg p-4 pr-12 text-base resize-none focus:outline-none focus:ring-2 focus:ring-primary-400 transition-shadow"
                            rows="1"
                            x-init="$el.addEventListener('input', () => { $el.style.height = 'auto'; $el.style.height = ($el.scrollHeight) + 'px' })"
                            style="max-height: 200px;">
                        </textarea>

                        <button type="submit" :disabled="isLoading || !currentMessage.trim()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-full transition-colors"
                            :class="{ 'bg-primary-400 text-gemini-gray-darker': currentMessage.trim(), 'bg-gray-500 text-gray-300 cursor-not-allowed': !currentMessage.trim() || isLoading }">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 10l7-7m0 0l7 7m-7-7v18" />
                            </svg>
                        </button>
                    </form>
                    <p class="text-xs text-gray-500 mt-2 text-center">Press <span
                            class="font-mono bg-gemini-gray-dark px-1 rounded">Ctrl + Enter</span> to send</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function chatApp() {
            return {
                apiKey: '',
                chats: [],
                activeChatId: null,
                currentMessage: '',
                selectedModel: localStorage.getItem('selected_model') || 'google/gemini-flash-1.5',
                models: [],
                isLoading: false,
                editingChatId: null,
                tempTitle: '',
                sidebarOpen: false,
                showSystemPromptInput: false,
                useStreaming: true,

                get activeChat() {
                    if (!this.activeChatId) return null;
                    return this.chats.find(chat => chat.id === this.activeChatId);
                },

                init() {
                    this.apiKey = localStorage.getItem('openrouter_api_key') || '';
                    const savedChats = localStorage.getItem('chat_histories');
                    this.chats = savedChats ? JSON.parse(savedChats) : [];

                    this.useStreaming = (localStorage.getItem('use_streaming') || 'true') === 'true';

                    this.$watch('selectedModel', (newModel) => {
                        localStorage.setItem('selected_model', newModel);
                    });

                    this.chats.forEach(chat => {
                        if (typeof chat.systemPrompt === 'undefined') {
                            chat.systemPrompt = '';
                        }
                    });

                    this.$watch('chats', (newChats) => {
                        localStorage.setItem('chat_histories', JSON.stringify(newChats));
                    }, { deep: true });

                    this.$watch('apiKey', (newKey) => {
                        localStorage.setItem('openrouter_api_key', newKey);
                    });

                    this.$watch('useStreaming', (newValue) => {
                        localStorage.setItem('use_streaming', newValue);
                    });

                    // <<< UPDATED LOGIC: Always open a new chat on load
                    this.newChat();

                    // OLD Logic (Commented out):
                    // if (this.chats.length > 0) {
                    //     this.activeChatId = this.chats[this.chats.length - 1].id;
                    // } else {
                    //     this.newChat();
                    // }

                    this.fetchModels();
                },

                selectCodeBlock(event) {
                    const pre = event.target.closest('pre');
                    if (pre) {
                        event.preventDefault();
                        const selection = window.getSelection();
                        const range = document.createRange();
                        range.selectNodeContents(pre);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                },

                formatPrice(pricePerToken) {
                    const pricePer1M = parseFloat(pricePerToken) * 1000000;
                    if (pricePer1M === 0) return '$0';
                    return '$' + pricePer1M.toPrecision(3).replace(/(\.0+|0+)$/, '');
                },

                async fetchModels() {
                    try {
                        const response = await fetch('https://openrouter.ai/api/v1/models');
                        const data = await response.json();

                        this.models = data.data.map(model => {
                            const name = model.name || model.id;
                            const outputPrice = this.formatPrice(model.pricing?.completion || '0');

                            let formattedName = name;
                            if (outputPrice !== '$0') {
                                formattedName = `${name} (${outputPrice}/M)`;
                            }

                            return {
                                ...model,
                                formattedName: formattedName
                            };
                        }).sort((a, b) => a.formattedName.localeCompare(b.formattedName));

                    } catch (error) {
                        console.error("Error fetching models:", error);
                        this.models = [
                            { id: 'google/gemini-flash-1.5', formattedName: 'Google: Gemini Flash 1.5 ($0.350/M)' },
                            { id: 'openai/gpt-4o', formattedName: 'OpenAI: GPT-4o ($15.0/M)' },
                            { id: 'anthropic/claude-3-haiku-20240307', formattedName: 'Anthropic: Claude 3 Haiku ($1.25/M)' }
                        ];
                    }
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        if (this.$refs.chatContainer) {
                            this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
                        }
                    });
                },

                newChat() {
                    const newChat = {
                        id: Date.now(),
                        title: 'New Chat',
                        messages: [],
                        systemPrompt: '',
                        createdAt: new Date().toISOString()
                    };
                    this.chats.push(newChat);
                    this.activeChatId = newChat.id;
                    this.sidebarOpen = false;
                },

                selectChat(chatId) {
                    this.activeChatId = chatId;
                    this.sidebarOpen = false;
                    this.scrollToBottom();
                },

                deleteChat(chatId) {
                    this.chats = this.chats.filter(chat => chat.id !== chatId);
                    if (this.activeChatId === chatId) {
                        this.activeChatId = this.chats.length > 0 ? this.chats[this.chats.length - 1].id : null;
                        if (!this.activeChatId) this.newChat();
                    }
                },

                startEditing(chat) {
                    this.editingChatId = chat.id;
                    this.tempTitle = chat.title;
                    this.$nextTick(() => { this.$refs[`titleInput_${chat.id}`].focus(); });
                },

                saveTitle(chatId) {
                    if (!this.tempTitle.trim()) return;
                    const chat = this.chats.find(c => c.id === chatId);
                    if (chat) chat.title = this.tempTitle.trim();
                    this.editingChatId = null;
                },

                async sendMessage() {
                    if (!this.currentMessage.trim() || this.isLoading) return;
                    if (!this.apiKey) {
                        alert('Please enter your OpenRouter API key in the sidebar first.');
                        return;
                    }

                    this.activeChat.messages.push({ role: 'user', content: this.currentMessage.trim() });
                    if (this.activeChat.messages.length === 1 && this.activeChat.title === 'New Chat') {
                        this.activeChat.title = this.currentMessage.substring(0, 40) + (this.currentMessage.length > 40 ? '...' : '');
                    }
                    this.isLoading = true;

                    const assistantMessageIndex = this.activeChat.messages.length;
                    this.activeChat.messages.push({ role: 'assistant', content: '' });

                    this.scrollToBottom();
                    this.currentMessage = '';
                    this.$nextTick(() => { this.$el.querySelector('textarea').style.height = 'auto'; });

                    let apiMessages = [];
                    if (this.activeChat.systemPrompt && this.activeChat.systemPrompt.trim() !== '') {
                        apiMessages.push({
                            role: 'system',
                            content: this.activeChat.systemPrompt.trim()
                        });
                    }
                    apiMessages.push(...this.activeChat.messages.slice(0, -1));

                    if (this.useStreaming) {
                        // --- STREAMING LOGIC ---
                        try {
                            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${this.apiKey}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    model: this.selectedModel,
                                    messages: apiMessages,
                                    stream: true
                                })
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.error.message || `HTTP error! status: ${response.status}`);
                            }

                            const reader = response.body.getReader();
                            const decoder = new TextDecoder();

                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;

                                const chunk = decoder.decode(value);
                                const lines = chunk.split('\n').filter(line => line.trim() !== '');

                                for (const line of lines) {
                                    if (line.startsWith('data: ')) {
                                        const data = line.substring(6);
                                        if (data === '[DONE]') break;
                                        try {
                                            const json = JSON.parse(data);
                                            const content = json.choices[0]?.delta?.content || '';
                                            if (content) {
                                                this.activeChat.messages[assistantMessageIndex].content += content;
                                                this.scrollToBottom();
                                            }
                                        } catch (e) {
                                            console.error('Error parsing stream data:', e);
                                        }
                                    }
                                }
                            }
                        } catch (error) {
                            console.error('API Error (Streaming):', error);
                            this.activeChat.messages[assistantMessageIndex].content = `**Sorry, there was an error:**\n\n> ${error.message}`;
                        } finally {
                            this.isLoading = false;
                            this.scrollToBottom();
                        }

                    } else {
                        // --- NON-STREAMING LOGIC ---
                        try {
                            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${this.apiKey}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    model: this.selectedModel,
                                    messages: apiMessages,
                                    stream: false
                                })
                            });

                            if (!response.ok) {
                                const errorData = await response.json();
                                throw new Error(errorData.error.message || `HTTP error! status: ${response.status}`);
                            }

                            const data = await response.json();
                            const assistantMessage = data.choices[0].message.content;
                            this.activeChat.messages[assistantMessageIndex].content = assistantMessage;

                        } catch (error) {
                            console.error('API Error (Non-Streaming):', error);
                            this.activeChat.messages[assistantMessageIndex].content = `**Sorry, there was an error:**\n\n> ${error.message}`;
                        } finally {
                            this.isLoading = false;
                            this.scrollToBottom();
                        }
                    }
                },

                renderMarkdown(content) {
                    if (window.marked) {
                        return window.marked.parse(content || '', { gfm: true, breaks: true });
                    }
                    return (content || '').replace(/\n/g, '<br>');
                }
            };
        }
    </script>

</body>

</html>
