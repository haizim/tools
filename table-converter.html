<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Alpine Table Editor</title>
    <script src="assets/js/tailwindcss.js"></script>
    <script src="assets/js/theme-config.js"></script>
    <script defer src="assets/js/alpine.min.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Custom scrollbar for the table container */
        .scrollbar-thin::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #c7c7c7;
            border-radius: 4px;
        }
    </style>
</head>

<body
    class="bg-slate-50 dark:bg-gemini-gray-darker text-slate-800 dark:text-gemini-gray-light font-sans transition-colors duration-300">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <div class="mx-auto p-4 lg:p-8" x-data="tableEditor()" x-init="initData()" x-cloak>
        <header class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-primary-600 dark:text-primary-400">Live Table Editor</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400">Paste data, edit the table, and export code.</p>
            </div>
            <div class="flex gap-2 items-center">
                <!-- Theme Toggle Button -->
                <button @click="toggleTheme()"
                    class="p-2 rounded-lg bg-slate-100 dark:bg-gray-700 text-slate-600 dark:text-gray-300 hover:bg-slate-200 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors mr-2">
                    <!-- Sun Icon -->
                    <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <!-- Moon Icon -->
                    <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        style="display: none;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                        </path>
                    </svg>
                </button>

                <button @click="addRow()"
                    class="text-xs bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 px-3 py-1.5 rounded hover:bg-primary-100 dark:hover:bg-primary-900/50 font-medium transition-colors">+
                    Add Row</button>
                <button @click="addColumn()"
                    class="text-xs bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 px-3 py-1.5 rounded hover:bg-primary-100 dark:hover:bg-primary-900/50 font-medium transition-colors">+
                    Add Col</button>
                <button @click="reset()"
                    class="text-xs text-secondary-500 dark:text-secondary-400 px-3 py-1.5 hover:bg-secondary-50 dark:hover:bg-secondary-900/30 rounded transition-colors">Reset</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <div class="lg:col-span-5 flex flex-col gap-6">

                <div
                    class="bg-white dark:bg-gemini-gray-dark p-4 rounded-lg shadow-sm border border-slate-200 dark:border-gemini-gray-dark transition-colors">
                    <label class="block text-xs font-bold uppercase text-slate-400 dark:text-slate-500 mb-2">1. Paste
                        from
                        Excel/Sheets</label>
                    <textarea x-model="rawInput" @input="parseRawInput()"
                        class="w-full h-[25vh] p-3 text-xs border border-slate-200 dark:border-gemini-gray-dark rounded bg-slate-50 dark:bg-gemini-gray-darker text-slate-800 dark:text-gemini-gray-light focus:ring-2 focus:ring-primary-500 focus:border-primary-500 resize-none font-mono leading-relaxed transition-colors"
                        placeholder="Header1	Header2&#10;Value1	Value2..."></textarea>
                </div>

                <div
                    class="bg-gray-900 dark:bg-gemini-gray-darker rounded-lg shadow-lg flex flex-col overflow-hidden flex-1 transition-colors">
                    <div
                        class="bg-gray-800 dark:bg-gemini-gray-dark p-2 flex justify-between items-center transition-colors">
                        <span class="text-xs font-bold text-gray-400 px-2">EXPORT AS:</span>
                        <div class="flex bg-gray-700 rounded p-0.5">
                            <template x-for="t in ['markdown', 'json', 'html', 'xml']">
                                <button @click="format = t"
                                    :class="format === t ? 'bg-primary-500 text-white' : 'text-gray-400 hover:text-gray-200'"
                                    class="px-2 py-1 text-[10px] font-bold uppercase rounded transition-colors"
                                    x-text="t"></button>
                            </template>
                        </div>
                    </div>

                    <div class="relative flex-1 group">
                        <textarea
                            class="p-4 text-xs font-mono text-primary-400 bg-gray-800 dark:bg-gemini-gray-darker overflow-auto h-[40vh] w-full custom-scrollbar transition-colors"
                            x-ref="outputCode" x-model="generateOutput()"></textarea>
                        <div class="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition">
                            <!-- <button @click="selectAll()"
                                class="bg-white/10 hover:bg-white/20 text-white text-xs px-2 py-1 rounded">Select
                                All</button> -->
                            <button @click="copyOutput()"
                                class="bg-white/10 hover:bg-white/20 text-white text-xs px-2 py-1 rounded"
                                x-text="copied ? 'Copied!' : 'Copy'"></button>
                        </div>
                        <!-- <pre class="p-4 text-xs font-mono text-green-400 overflow-auto h-[40vh] custom-scrollbar">
                            <code x-ref="outputCode" x-text="generateOutput()"></code>
                        </pre> -->
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div
                    class="bg-white dark:bg-gemini-gray-dark rounded-lg shadow-sm border border-slate-200 dark:border-gemini-gray-dark h-full flex flex-col transition-colors">
                    <div
                        class="p-3 border-b border-slate-100 dark:border-gemini-gray-dark bg-slate-50 dark:bg-gemini-gray-darker rounded-t-lg flex justify-between items-center transition-colors">
                        <span class="text-xs font-bold uppercase text-slate-400 dark:text-slate-500">2. Edit Table
                            Data</span>
                        <span class="text-[10px] text-slate-400 dark:text-slate-500 italic">Click cells to edit</span>
                    </div>

                    <div class="overflow-auto flex-1 p-4 scrollbar-thin">
                        <table class="w-full border-collapse text-sm text-left">
                            <thead>
                                <tr>
                                    <th class="w-8 p-2 border-b-2 border-slate-200 dark:border-gemini-gray-dark"></th>
                                    <template x-for="(header, index) in rows[0]" :key="index">
                                        <th
                                            class="border-b-2 border-slate-200 dark:border-gemini-gray-dark bg-slate-50 dark:bg-gemini-gray-darker min-w-[100px] relative group transition-colors">
                                            <input type="text" x-model="rows[0][index]"
                                                class="w-full bg-transparent p-2 font-bold text-slate-700 dark:text-gemini-gray-light focus:outline-none focus:bg-white dark:focus:bg-gemini-gray-dark focus:ring-2 focus:ring-primary-500 rounded transition-colors">
                                            <button @click="removeCol(index)"
                                                class="absolute -top-2 right-0 text-secondary-300 hover:text-secondary-500 opacity-0 group-hover:opacity-100 transition px-1 text-xs">×</button>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="(row, rIndex) in rows.slice(1)" :key="rIndex">
                                    <tr
                                        class="hover:bg-slate-50 dark:hover:bg-gemini-gray-dark/50 group transition-colors">
                                        <td
                                            class="p-2 border-b border-slate-100 dark:border-gemini-gray-dark text-center transition-colors">
                                            <button @click="removeRow(rIndex + 1)"
                                                class="text-slate-300 dark:text-slate-600 hover:text-secondary-500 transition opacity-0 group-hover:opacity-100">×</button>
                                        </td>
                                        <template x-for="(cell, cIndex) in row" :key="cIndex">
                                            <td
                                                class="border-b border-slate-100 dark:border-gemini-gray-dark p-1 transition-colors">
                                                <input type="text" x-model="rows[rIndex + 1][cIndex]"
                                                    class="w-full p-2 rounded border border-transparent hover:border-slate-200 dark:hover:border-gemini-gray-dark focus:border-primary-500 focus:ring-1 focus:ring-primary-500 focus:outline-none transition-all text-slate-600 dark:text-gemini-gray-light bg-transparent">
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function tableEditor() {
            return {
                rawInput: '',
                rows: [], // Format: [['Header1', 'Header2'], ['Val1', 'Val2']]
                format: 'markdown',
                copied: false,
                darkMode: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),

                initData() {
                    // Default demo data
                    this.rawInput = "Product\tPrice\tStock\nApple\t$1.00\t50\nBanana\t$0.50\t100";
                    this.parseRawInput();
                },

                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');

                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                reset() {
                    this.rawInput = "";
                    this.rows = [['Header 1', 'Header 2'], ['Data', 'Data']];
                },

                // 1. Parse Raw Text -> Table Rows
                parseRawInput() {
                    if (!this.rawInput) return;
                    this.rows = this.rawInput.trim().split('\n').map(row => row.split('\t'));
                    // Ensure at least one row exists
                    if (this.rows.length === 0) this.rows = [['']];
                },

                // 2. Table Manipulation
                addRow() {
                    const colCount = this.rows[0] ? this.rows[0].length : 1;
                    this.rows.push(new Array(colCount).fill(''));
                },

                addColumn() {
                    this.rows.forEach(row => row.push(''));
                },

                removeRow(index) {
                    this.rows.splice(index, 1);
                },

                removeCol(index) {
                    this.rows.forEach(row => row.splice(index, 1));
                },

                // 3. Generate Code Output
                generateOutput() {
                    if (!this.rows.length) return '';
                    const headers = this.rows[0];
                    const body = this.rows.slice(1);

                    switch (this.format) {
                        case 'markdown': return this.toMarkdown(headers, body);
                        case 'json': return this.toJson(headers, body);
                        case 'html': return this.toHtml(headers, body);
                        case 'xml': return this.toXml(headers, body);
                        default: return '';
                    }
                },

                // --- Converters (Same logic as before, adapted to use 'rows') ---

                toJson(headers, body) {
                    const data = body.map(row => {
                        let obj = {};
                        headers.forEach((h, i) => obj[h] = row[i] ?? '');
                        return obj;
                    });
                    return JSON.stringify(data, null, 2);
                },

                toMarkdown(headers, body) {
                    const buildRow = (arr) => `| ${arr.map(c => (c || '').trim()).join(' | ')} |`;
                    const sep = `| ${headers.map(() => '---').join(' | ')} |`;
                    return [buildRow(headers), sep, ...body.map(buildRow)].join('\n');
                },

                toHtml(headers, body) {
                    let h = '<thead><tr>' + headers.map(x => `<th>${x}</th>`).join('') + '</tr></thead>';
                    let b = '<tbody>' + body.map(row => '<tr>' + row.map(x => `<td>${x || ''}</td>`).join('') + '</tr>').join('\n') + '</tbody>';
                    return `<table>\n${h}\n${b}\n</table>`;
                },

                toXml(headers, body) {
                    return '<root>\n' + body.map(row => {
                        return '  <item>\n' + headers.map((h, i) => {
                            let tag = (h || 'field').replace(/[^a-z0-9]/gi, '_');
                            return `    <${tag}>${row[i] || ''}</${tag}>`;
                        }).join('\n') + '\n  </item>';
                    }).join('\n') + '\n</root>';
                },

                async copyOutput() {
                    await navigator.clipboard.writeText(this.generateOutput());
                    this.copied = true;
                    setTimeout(() => this.copied = false, 2000);
                },

                selectAll() {
                    const range = document.createRange();
                    range.selectNodeContents(this.$refs.outputCode);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
        }
    </script>
</body>

</html>
