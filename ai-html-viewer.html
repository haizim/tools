<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HTML Viewer</title>
    <script src="assets/js/tailwindcss.js"></script>
    <script>
        const DEFAULT_SOURCE = [
            '<div class="grid place-items-center h-full text-center bg-blue-50 p-6">',
            '  <div>',
            '    <div class="w-16 h-16 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl shadow-lg">🚀</div>',
            '    <h2 class="text-3xl font-bold text-gray-800 mb-2">Siap Meluncur!</h2>',
            '    <p class="text-gray-600 mb-6">Cobalah ubah mode tampilan di atas.</p>',
            '    <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full transition shadow">Aksi Utama</button>',
            '  </div>',
            '</div>'
        ].join('\n');

        document.addEventListener('alpine:init', () => {
            Alpine.data('app', () => ({
                mode: 'split',
                sourceCode: DEFAULT_SOURCE,
                chatOpen: false,
                chatMaximized: false,
                settingsOpen: false,
                messages: [],
                chatInput: '',
                isLoading: false,
                apiKey: '',
                model: 'openai/gpt-4o-mini',
                systemPrompt: 'Kamu adalah asisten AI untuk membuat dan mengedit kode HTML/CSS/JS. Selalu berikan kode lengkap dalam blok kode html. Gunakan Tailwind CSS.',
                creditInfo: '',
                showApiKey: false,

                init() {
                    this.apiKey = localStorage.getItem('openrouter_api_key') || '';
                    this.model = localStorage.getItem('openrouter_model') || 'openai/gpt-4o-mini';
                    this.systemPrompt = localStorage.getItem('openrouter_system_prompt') || 'Kamu adalah asisten AI untuk membuat dan mengedit kode HTML/CSS/JS. Selalu berikan kode lengkap dalam blok kode html. Gunakan Tailwind CSS.';
                    const saved = localStorage.getItem('openrouter_chat_history');
                    if (saved) { try { this.messages = JSON.parse(saved); } catch(e) {} }
                    this.$watch('messages', val => {
                        localStorage.setItem('openrouter_chat_history', JSON.stringify(val));
                    });
                },

                get iframeSrcdoc() {
                    return this.sourceCode + '<script src="https://cdn.tailwindcss.com"><\/script>';
                },

                reloadPreview() {
                    const iframe = this.$refs.previewIframe;
                    if (iframe) {
                        const content = iframe.srcdoc;
                        iframe.srcdoc = '';
                        this.$nextTick(() => { iframe.srcdoc = content; });
                    }
                },

                openInNewTab() {
                    const html = this.sourceCode + '<script src="https://cdn.tailwindcss.com"><\/script>';
                    const blob = new Blob([html], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const win = window.open(url, '_blank');
                    if (win) win.addEventListener('load', () => URL.revokeObjectURL(url), { once: true });
                },

                saveSettings() {
                    localStorage.setItem('openrouter_api_key', this.apiKey);
                    localStorage.setItem('openrouter_model', this.model);
                    localStorage.setItem('openrouter_system_prompt', this.systemPrompt);
                    this.settingsOpen = false;
                    this.creditInfo = '';
                },

                clearChat() {
                    this.messages = [];
                    localStorage.removeItem('openrouter_chat_history');
                },

                applyCode(code) {
                    this.sourceCode = code;
                },

                parseMessageParts(content) {
                    const parts = [];
                    const regex = /```(\w*)\n?([\s\S]*?)```/g;
                    let lastIndex = 0, match;
                    while ((match = regex.exec(content)) !== null) {
                        if (match.index > lastIndex)
                            parts.push({ type: 'text', content: content.slice(lastIndex, match.index) });
                        parts.push({ type: 'code', lang: match[1] || '', content: match[2].trim() });
                        lastIndex = match.index + match[0].length;
                    }
                    if (lastIndex < content.length)
                        parts.push({ type: 'text', content: content.slice(lastIndex) });
                    return parts;
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const el = document.getElementById('chat-messages');
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                },

                async sendMessage() {
                    if (!this.chatInput.trim() || this.isLoading || !this.apiKey) return;
                    const userMsg = this.chatInput.trim();
                    this.chatInput = '';
                    this.messages.push({ role: 'user', content: userMsg });
                    this.isLoading = true;
                    this.scrollToBottom();

                    const conversation = [
                        {
                            role: 'system',
                            content: this.systemPrompt + '\n\nKode HTML saat ini:\n```html\n' + this.sourceCode + '\n```'
                        },
                        ...this.messages.map(m => ({ role: m.role, content: m.content }))
                    ];

                    this.messages.push({ role: 'assistant', content: '' });
                    const assistantIndex = this.messages.length - 1;

                    try {
                        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.apiKey,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ model: this.model, messages: conversation, stream: true })
                        });

                        if (!response.ok) {
                            const err = await response.json();
                            this.messages[assistantIndex].content = 'Error: ' + (err.error?.message || response.statusText);
                            this.isLoading = false;
                            this.scrollToBottom();
                            return;
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();
                            for (const line of lines) {
                                if (!line.startsWith('data: ')) continue;
                                const data = line.slice(6).trim();
                                if (data === '[DONE]') continue;
                                try {
                                    const json = JSON.parse(data);
                                    const delta = json.choices?.[0]?.delta?.content;
                                    if (delta) {
                                        this.messages[assistantIndex].content += delta;
                                        this.scrollToBottom();
                                    }
                                } catch(e) {}
                            }
                        }
                    } catch (e) {
                        this.messages[assistantIndex].content = 'Error: ' + e.message;
                    }

                    this.isLoading = false;
                    this.scrollToBottom();
                },

                async checkCredit() {
                    if (!this.apiKey) { this.creditInfo = 'API key belum diisi.'; return; }
                    this.creditInfo = 'Mengecek...';
                    try {
                        const res = await fetch('https://openrouter.ai/api/v1/auth/key', {
                            headers: { 'Authorization': 'Bearer ' + this.apiKey }
                        });
                        const data = await res.json();
                        if (data.data) {
                            const d = data.data;
                            const sisa = d.limit ? (d.limit - (d.usage || 0)).toFixed(4) : '∞';
                            this.creditInfo = 'Limit: $' + (d.limit ?? '∞') + ' | Digunakan: $' + (d.usage || 0).toFixed(4) + ' | Sisa: $' + sisa;
                        } else {
                            this.creditInfo = JSON.stringify(data);
                        }
                    } catch(e) {
                        this.creditInfo = 'Error: ' + e.message;
                    }
                }
            }));
        });
    </script>
    <script defer src="assets/js/alpine.min.js"></script>
    <style>
        textarea::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track {
            background: #111827;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }

        .dot-flashing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .dot-flashing span {
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            animation: dotFlash 1.2s infinite;
        }

        .dot-flashing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot-flashing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotFlash {

            0%,
            80%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <main class="flex-1 flex overflow-hidden" x-data="app">

        <!-- Editor -->
        <section class="flex flex-col border-r border-gray-800 transition-all duration-300 ease-in-out"
            :class="mode === 'full' ? 'w-0 overflow-hidden' : 'w-1/2'" x-show="mode !== 'full'">
            <div
                class="bg-gray-800 px-4 py-3 text-xs font-bold text-gray-400 uppercase flex justify-between border-b border-gray-700">
                <span>Source Code</span>
                <button @click="sourceCode=''" class="hover:text-red-400">Clear</button>
            </div>
            <textarea x-model="sourceCode"
                class="flex-1 bg-gray-900 text-green-400 font-mono text-sm p-4 focus:outline-none resize-none"
                spellcheck="false" placeholder="Tulis HTML..."></textarea>
        </section>

        <!-- Preview -->
        <section class="flex flex-col bg-gray-100 transition-all duration-300 relative"
            :class="mode === 'full' ? 'w-full' : 'w-1/2'">

            <!-- Toolbar -->
            <div class="bg-white border-b border-gray-200 px-4 py-2 flex justify-between items-center shadow-sm z-10">
                <div class="flex items-center gap-2">
                    <button @click="mode = 'split'"
                        class="flex items-center gap-2 px-3 py-1.5 rounded text-xs font-semibold transition-colors border"
                        :class="mode === 'split' ? 'bg-blue-50 border-blue-200 text-blue-600' : 'text-gray-500 border-transparent hover:bg-gray-100'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        Split
                    </button>
                    <button @click="mode = 'mobile'"
                        class="flex items-center gap-2 px-3 py-1.5 rounded text-xs font-semibold transition-colors border"
                        :class="mode === 'mobile' ? 'bg-blue-50 border-blue-200 text-blue-600' : 'text-gray-500 border-transparent hover:bg-gray-100'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                        Mobile
                    </button>
                    <button @click="mode = 'full'"
                        class="flex items-center gap-2 px-3 py-1.5 rounded text-xs font-semibold transition-colors border"
                        :class="mode === 'full' ? 'bg-blue-50 border-blue-200 text-blue-600' : 'text-gray-500 border-transparent hover:bg-gray-100'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                            </path>
                        </svg>
                        Full
                    </button>
                </div>
                <div class="flex items-center gap-1">
                    <button @click="reloadPreview()" title="Reload preview"
                        class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-semibold text-gray-500 border border-transparent hover:bg-gray-100 hover:text-gray-700 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        Reload
                    </button>
                    <button @click="openInNewTab()" title="Open in new tab"
                        class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-semibold text-gray-500 border border-transparent hover:bg-gray-100 hover:text-gray-700 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14">
                            </path>
                        </svg>
                        New Tab
                    </button>
                </div>
            </div>

            <!-- Preview area -->
            <div class="flex-1 bg-gray-200 overflow-auto flex items-center justify-center p-4 relative">
                <div class="bg-white transition-all duration-500 ease-in-out relative shadow-2xl overflow-hidden"
                    :class="{
                        'w-full h-full': mode === 'split' || mode === 'full',
                        'w-[375px] h-[667px] rounded-3xl border-8 border-gray-800': mode === 'mobile'
                    }">
                    <div x-show="mode === 'mobile'"
                        class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-800 rounded-b-xl z-20">
                    </div>
                    <iframe x-ref="previewIframe" class="w-full h-full border-none"
                        :srcdoc="iframeSrcdoc"
                        sandbox="allow-scripts"></iframe>
                </div>

            </div>
            <!-- Chat Panel -->
            <div class="absolute bottom-4 right-4 flex flex-col items-end gap-3" style="z-index:50">

                <!-- Toggle Button -->
                <button @click="chatOpen = !chatOpen"
                    class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-700 shadow-lg flex items-center justify-center transition-colors">
                    <svg x-show="!chatOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3v-3z">
                        </path>
                    </svg>
                    <svg x-show="chatOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                        </path>
                    </svg>
                </button>

                <!-- Chat Panel -->
                <div x-show="chatOpen" x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 translate-y-4"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 translate-y-0"
                    x-transition:leave-end="opacity-0 translate-y-4" :class="chatMaximized
                        ? 'bottom-16 w-[95vw] h-[95vh]'
                        : 'w-[450px] h-[700px]'"
                    class="bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all duration-200">

                    <!-- Header -->
                    <div
                        class="bg-gray-800 px-4 py-3 flex items-center justify-between border-b border-gray-700 flex-shrink-0">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-green-400"></div>
                            <span class="text-sm font-semibold text-white">AI Assistant</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="chatMaximized = !chatMaximized"
                                :title="chatMaximized ? 'Minimize' : 'Maximize'"
                                class="p-1.5 rounded hover:bg-gray-700 text-gray-400 hover:text-white transition-colors">
                                <svg x-show="!chatMaximized" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                                    </path>
                                </svg>
                                <svg x-show="chatMaximized" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 9V4H4v5h5zm0 0l-5 5m16-5h-5V4h5v5zm0 0l-5 5M9 20H4v-5h5v5zm0 0l-5-5m16 5h-5v-5h5v5zm0 0l-5-5">
                                    </path>
                                </svg>
                            </button>
                            <button @click="clearChat()" title="Clear chat"
                                class="p-1.5 rounded hover:bg-gray-700 text-gray-400 hover:text-red-400 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>
                            <button @click="settingsOpen = true; creditInfo = ''" title="Settings"
                                class="p-1.5 rounded hover:bg-gray-700 text-gray-400 hover:text-white transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Messages -->
                    <div id="chat-messages" class="chat-messages flex-1 overflow-y-auto p-3 space-y-3">

                        <!-- Empty state -->
                        <template x-if="messages.length === 0">
                            <div
                                class="flex flex-col items-center justify-center h-full text-gray-500 text-center px-4">
                                <svg class="w-10 h-10 mb-3 text-gray-700" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3v-3z">
                                    </path>
                                </svg>
                                <p class="text-sm">Tanya AI untuk membuat atau mengedit kode HTML</p>
                                <template x-if="!apiKey">
                                    <p class="text-xs mt-2 text-yellow-600">Set API key di settings dulu</p>
                                </template>
                            </div>
                        </template>

                        <template x-for="(msg, i) in messages" :key="i">
                            <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                                <div
                                    :class="msg.role === 'user'
                                    ? 'bg-blue-600 text-white rounded-2xl rounded-tr-sm px-3 py-2 max-w-[85%] text-sm'
                                    : 'bg-gray-800 text-gray-100 rounded-2xl rounded-tl-sm max-w-[95%] text-sm overflow-hidden'">

                                    <!-- User message -->
                                    <template x-if="msg.role === 'user'">
                                        <p x-text="msg.content" class="whitespace-pre-wrap break-words"></p>
                                    </template>

                                    <!-- Assistant message -->
                                    <template x-if="msg.role === 'assistant'">
                                        <div class="w-full">
                                            <!-- Loading dots -->
                                            <template
                                                x-if="msg.content === '' && isLoading && i === messages.length - 1">
                                                <div class="px-3 py-2 dot-flashing">
                                                    <span></span><span></span><span></span>
                                                </div>
                                            </template>

                                            <!-- Parsed content -->
                                            <template x-if="msg.content !== ''">
                                                <div class="w-full">
                                                    <template x-for="(part, j) in parseMessageParts(msg.content)"
                                                        :key="j">
                                                        <div>
                                                            <template x-if="part.type === 'text'">
                                                                <p x-text="part.content"
                                                                    class="px-3 py-1 whitespace-pre-wrap break-words text-gray-100 leading-relaxed">
                                                                </p>
                                                            </template>
                                                            <template x-if="part.type === 'code'">
                                                                <div class="my-1">
                                                                    <div
                                                                        class="bg-gray-950 border-t border-b border-gray-700">
                                                                        <div
                                                                            class="flex items-center justify-between px-3 py-1.5 border-b border-gray-800">
                                                                            <span
                                                                                class="text-xs text-gray-500 font-mono"
                                                                                x-text="part.lang || 'code'"></span>
                                                                            <template
                                                                                x-if="part.lang === 'html' || part.lang === 'HTML'">
                                                                                <button @click="applyCode(part.content)"
                                                                                    class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded transition-colors">
                                                                                    Apply Code
                                                                                </button>
                                                                            </template>
                                                                        </div>
                                                                        <pre
                                                                            class="p-3 overflow-x-auto text-xs text-green-300 font-mono leading-relaxed"><code x-text="part.content"></code></pre>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Input -->
                    <div class="p-3 border-t border-gray-700 flex-shrink-0">
                        <div class="flex gap-2 items-end">
                            <textarea x-model="chatInput" @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
                                :disabled="isLoading" rows="2"
                                placeholder="Kirim pesan... (Enter kirim, Shift+Enter baris baru)"
                                class="flex-1 bg-gray-800 text-white text-sm rounded-xl px-3 py-2 resize-none focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-gray-500 disabled:opacity-50"></textarea>
                            <button @click="sendMessage()" :disabled="isLoading || !chatInput.trim() || !apiKey"
                                class="flex-shrink-0 w-9 h-9 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Settings Modal -->
        <div x-show="settingsOpen" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4"
            style="z-index:60" @click.self="settingsOpen = false">

            <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md shadow-2xl"
                x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100">

                <!-- Modal Header -->
                <div class="flex items-center justify-between px-5 py-4 border-b border-gray-700">
                    <h2 class="text-base font-semibold text-white">OpenRouter Settings</h2>
                    <button @click="settingsOpen = false" class="text-gray-400 hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-5 py-4 space-y-4">

                    <!-- API Key -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">API Key</label>
                        <div class="relative">
                            <input x-model="apiKey" :type="showApiKey ? 'text' : 'password'" placeholder="sk-or-..."
                                class="w-full bg-gray-800 text-white text-sm rounded-lg px-3 py-2 pr-10 focus:outline-none focus:ring-1 focus:ring-blue-500 border border-gray-700">
                            <button @click="showApiKey = !showApiKey"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                                <svg x-show="!showApiKey" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                    </path>
                                </svg>
                                <svg x-show="showApiKey" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Check Credit -->
                    <div>
                        <button @click="checkCredit()"
                            class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded-lg transition-colors">
                            Cek Credit
                        </button>
                        <p x-show="creditInfo" x-text="creditInfo" class="mt-2 text-xs text-green-400 font-mono"></p>
                    </div>

                    <!-- Model -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">Model</label>
                        <input x-model="model" placeholder="openai/gpt-4o-mini"
                            class="w-full bg-gray-800 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500 border border-gray-700">
                        <p class="mt-1 text-xs text-gray-600">Contoh: openai/gpt-4o, anthropic/claude-3-haiku</p>
                    </div>

                    <!-- System Prompt -->
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">System Prompt</label>
                        <textarea x-model="systemPrompt" rows="4"
                            class="w-full bg-gray-800 text-white text-sm rounded-lg px-3 py-2 resize-none focus:outline-none focus:ring-1 focus:ring-blue-500 border border-gray-700 font-mono"></textarea>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="px-5 py-4 border-t border-gray-700 flex justify-end gap-3">
                    <button @click="settingsOpen = false"
                        class="text-sm px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                        Batal
                    </button>
                    <button @click="saveSettings()"
                        class="text-sm px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors font-medium">
                        Simpan
                    </button>
                </div>
            </div>
        </div>

    </main>
</body>

</html>
